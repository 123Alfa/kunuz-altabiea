function loadSummary(){
  const month=document.getElementById('summaryMonth')?.value||today().slice(0,7);
  const sales=Store.get('sales');
  const purchases=Store.get('purchases');
  const expenses=Store.get('expenses');
  const withdrawals=Store.get('withdrawals');
  const debts=Store.get('debts');
  const products=Store.get('products');
  const customers=Store.get('customers');

  const inMonth=d=>d.startsWith(month);

  const mSales=sales.filter(s=>inMonth(s.date));
  const mPurchases=purchases.filter(p=>inMonth(p.date));
  const mExpenses=expenses.filter(e=>inMonth(e.date));
  const mWithdrawals=withdrawals.filter(w=>inMonth(w.date));

  const totalSales=mSales.reduce((sum,s)=>sum+(s.total||0),0);
  const totalProfit=mSales.reduce((sum,s)=>sum+(s.profit||0),0);
  const totalPurchases=mPurchases.reduce((sum,p)=>sum+(p.total||0),0);
  const totalExpenses=mExpenses.reduce((sum,e)=>sum+(e.amount||0),0);
  const totalWithdrawals=mWithdrawals.reduce((sum,w)=>sum+(w.amount||0),0);
  const totalDiscounts=mSales.reduce((sum,s)=>sum+((s.price*s.qty)-(s.total||0)),0);

  // تصحيح: الديون يجب أن تحسب من السجل الكامل (debts) وليس شهر الملخص فقط لمعرفة المديونية الحقيقية الحالية
  const debtsOnUs=debts.filter(d=>d.type==='علينا'&&!d.paid).reduce((sum,d)=>sum+(d.amount||0),0);
  const debtsForUs=debts.filter(d=>d.type==='لنا'&&!d.paid).reduce((sum,d)=>sum+(d.amount||0),0);
  const netDebts=debtsForUs-debtsOnUs;

  const inventoryValue=products.reduce((sum,p)=>sum+((p.qty||0)*(p.purchase||0)),0);

  const initialCapital=currentUser?.capital||0;
  const capital=initialCapital>0?initialCapital:totalPurchases+inventoryValue;

  // تصحيح: السحوبات (totalWithdrawals) لا تخصم من صافي الربح، بل من رأس المال فقط
  const netProfit=totalProfit-totalExpenses;

  document.getElementById('sumCapital').textContent=fmt(capital);
  document.getElementById('sumInventory').textContent=fmt(inventoryValue);
  document.getElementById('sumSales').textContent=fmt(totalSales);
  document.getElementById('sumPurchases').textContent=fmt(totalPurchases);
  document.getElementById('sumExpenses').textContent=fmt(totalExpenses);
  document.getElementById('sumWithdrawals').textContent=fmt(totalWithdrawals);
  
  document.getElementById('sumDebts').textContent=fmt(netDebts);
  document.getElementById('sumDebts').style.color=netDebts>=0?'var(--success-light)':'var(--danger-light)';
  
  document.getElementById('sumTotalProfit').textContent=fmt(totalProfit);
  document.getElementById('sumTotalProfit').style.color=totalProfit>=0?'var(--success-light)':'var(--danger-light)';
  
  document.getElementById('sumNetProfit').textContent=fmt(netProfit);
  document.getElementById('sumNetProfit').style.color=netProfit>=0?'#fbbf24':'#f87171';

  document.getElementById('sumSaleCount').textContent=mSales.length;
  document.getElementById('sumAvgSale').textContent=fmt(mSales.length?totalSales/mSales.length:0);
  document.getElementById('sumProfitPercent').textContent=totalSales>0?((totalProfit/totalSales)*100).toFixed(1)+'%':'0%';
  document.getElementById('sumTotalDiscounts').textContent=fmt(totalDiscounts);

  // أكثر صنف مبيعاً
  const ps={};
  mSales.forEach(s=>{ps[s.productName]=(ps[s.productName]||0)+(s.total||0)});
  const top=Object.entries(ps).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('sumTopProduct').textContent=top?top[0]:'-';

  // أفضل عميل
  const cs={};
  mSales.filter(s=>s.customerName).forEach(s=>{cs[s.customerName]=(cs[s.customerName]||0)+(s.total||0)});
  const topC=Object.entries(cs).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('sumTopCustomer').textContent=topC?topC[0]+' ('+fmt(topC[1])+')':'-';
}

  });

  expenses.forEach(e=>{byType[e.type]=(byType[e.type]||0)+(e.amount||0)});
  new Chart(document.getElementById('expenseChart'),{
    type:'doughnut',
    data:{labels:Object.keys(byType),datasets:[{data:Object.values(byType),backgroundColor:['#d4a72c','#c99a22','#f39c12','#e74c3c','#3498db','#9b59b6','#2ecc71','#e67e22']}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',padding:15,font:{size:12}}}}}
  });

  // أفضل 5 أصناف
  const ps={};
  sales.forEach(s=>{ps[s.productName]=(ps[s.productName]||0)+(s.total||0)});
  const top5=Object.entries(ps).sort((a,b)=>b[1]-a[1]).slice(0,5);
  new Chart(document.getElementById('topProductsChart'),{
    type:'bar',
    data:{labels:top5.map(x=>x[0]),datasets:[{label:'المبيعات',data:top5.map(x=>x[1]),backgroundColor:['#d4a72c','#c99a22','#b8960c','#a67c00','#8b6914'],borderRadius:8}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#94a3b8'}},x:{grid:{display:false},ticks:{color:'#94a3b8'}}}}
  });

  // الأرباح vs المصروفات
  const monthlyProfit={}, monthlyExpense={};
  sales.forEach(s=>{const m=s.date?.slice(0,7)||'unknown';monthlyProfit[m]=(monthlyProfit[m]||0)+(s.profit||0)});
  expenses.forEach(e=>{const m=e.date?.slice(0,7)||'unknown';monthlyExpense[m]=(monthlyExpense[m]||0)+(e.amount||0)});
  const allMonths=[...new Set([...Object.keys(monthlyProfit),...Object.keys(monthlyExpense)])].sort();
  new Chart(document.getElementById('profitExpenseChart'),{
    type:'bar',
    data:{labels:allMonths,datasets:[
      {label:'الأرباح',data:allMonths.map(m=>monthlyProfit[m]||0),backgroundColor:'rgba(16,185,129,0.7)',borderColor:'#10b981',borderWidth:1,borderRadius:8},
      {label:'المصروفات',data:allMonths.map(m=>monthlyExpense[m]||0),backgroundColor:'rgba(239,68,68,0.7)',borderColor:'#ef4444',borderWidth:1,borderRadius:8}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8'}}},scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#94a3b8'}},x:{grid:{display:false},ticks:{color:'#94a3b8'}}}}
  });
}

// ==================== التصدير والاستيراد ====================
function exportData(){
  const data={
    products:Store.get('products'),
    sales:Store.get('sales'),
    purchases:Store.get('purchases'),
    expenses:Store.get('expenses'),
    withdrawals:Store.get('withdrawals'),
    debts:Store.get('debts'),
    customers:Store.get('customers'),
    suppliers:Store.get('suppliers'),
    offers:Store.get('offers'),
    auditLog:Store.get('auditLog'),
    userData:currentUser,
    exportedAt:new Date().toISOString()
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='mozzarella_backup_'+today()+'.json';a.click();URL.revokeObjectURL(url);
  showToast('✅ تم التصدير');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const data=JSON.parse(e.target.result);
    if(!confirm('سيتم استبدال جميع البيانات. متأكد؟'))return;
    ['products','sales','purchases','expenses','withdrawals','debts','customers','suppliers','offers','auditLog'].forEach(k=>Store.set(k,data[k]||[]));
    if(data.userData)Store.setUser(data.userData);
    showToast('✅ تم الاستيراد');navigateTo('dashboard');
  };
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm('⚠️ سيتم حذف جميع البيانات! متأكد؟'))return;
  if(!confirm('تأكيد نهائي: مسح كل البيانات؟'))return;
  // ملاحظة: هذا لا يمسح Firebase، فقط المحلي. يمكنك إضافة حلقة لحذف كل مجموعة من Firebase إذا أردت.
  Store.clear();showToast('🗑️ تم المسح');navigateTo('dashboard');
}

function openModal(content){

  document.getElementById('modalOverlay').classList.remove('active');

function showToast(message,type='success'){
  const container=document.getElementById('toastContainer');
  const toast=document.createElement('div');
  toast.className='toast '+type;
  const icons={success:'check-circle',error:'exclamation-circle',warning:'exclamation-triangle'};
  toast.innerHTML=`<i class="fas fa-${icons[type]||'check-circle'}"></i> ${message}`;
  container.appendChild(toast);
  setTimeout(()=>{toast.style.animation='toastOut 0.3s ease';setTimeout(()=>toast.remove(),300)},3000);
}
function fmt(n){
  return Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
}
function today(){
  return new Date().toISOString().split('T')[0];
}

    const user=Store.getUser();

    else{showAuthScreen();}
  },1500);
  
});
// دالة مسح بيانات السحابة واستبدالها ببيانات الموبايل
async function replaceCloudDataWithLocal() {
  if (!confirm('⚠️ هل أنت متأكد من مسح جميع البيانات السحابية واستبدالها ببيانات الموبايل الحالية؟')) {
    return;
  }

  const collections = ['products', 'sales', 'purchases', 'expenses', 'withdrawals', 'debts', 'customers', 'suppliers', 'offers', 'auditLog'];
  
  try {
    if (typeof showToast === 'function') showToast('⏳ جاري مسح السحابة وتحديث البيانات...', 'info');

    for (const col of collections) {
      const snapshot = await db.collection(col).get();
      const batch = db.batch();
      snapshot.forEach(doc => batch.delete(doc.ref));
      await batch.commit();

      const localData = Store.get(col);
      if (Array.isArray(localData) && localData.length > 0) {
        for (const item of localData) {
          if (item.id) {
            await db.collection(col).doc(String(item.id)).set(item);
          }
        }
      }
    }
    
    alert('✅ تم مسح البيانات السحابية وتحديثها بالبيانات الجديدة بنجاح!');
  } catch (error) {
    console.error('خطأ أثناء التحديث:', error);
    alert('❌ حدث خطأ أثناء عملية التحديث');
  }
}
