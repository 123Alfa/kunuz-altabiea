<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>متجري - نظام إدارة المبيعات والمخزون</title>

<!-- أيقونة المتصفح -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- لون شريط المتصفح العلوي في الموبايل -->
<meta name="theme-color" content="#0B4DA2">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<!-- Google Identity Services: تسجيل Google والوصول إلى Google Drive بدون Google Drive -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root{
  --primary:#0f766e;
  --primary-dark:#115e59;
  --primary-light:#14b8a6;
  --accent:#c99a22;
  --accent-light:#e3b93f;
  --danger:#dc4b4b;
  --danger-light:#ef8b8b;
  --success:#159a72;
  --success-light:#53c59c;
  --info:#2f80b7;
  --info-light:#67acd6;
  --warning:#d9911e;
  --bg:#f5f7f5;
  --bg-card:#ffffff;
  --bg-elevated:#f0f4f2;
  --bg-input:#fbfcfb;
  --text:#243238;
  --text-light:#64748b;
  --text-muted:#94a3b8;
  --border:#e2e8e5;
  --border-light:#cbd8d3;
  --shadow:0 4px 18px rgba(31,55,48,0.08);
  --shadow-lg:0 12px 35px rgba(31,55,48,0.12);
  --shadow-glow:0 0 28px rgba(15,118,110,0.12);
  --radius:16px;
  --radius-sm:10px;
  --radius-lg:24px
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden;word-spacing:0.5px}
#loading-screen{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#f5f7f5 0%,#ffffff 50%,#fff8e8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;transition:opacity 0.6s ease}
#loading-screen.hidden{opacity:0;pointer-events:none}
.loading-logo{width:100px;height:100px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pulse-glow 2s ease-in-out infinite;box-shadow:0 0 40px rgba(15,118,110,0.4)}
@keyframes pulse-glow{0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(15,118,110,0.4)}50%{transform:scale(1.05);box-shadow:0 0 60px rgba(15,118,110,0.6)}}
.brand-logo{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit}
.loading-logo .brand-logo{width:72px;height:72px}
.auth-logo .icon .brand-logo{width:58px;height:58px}
.app-header .logo-icon .brand-logo{width:34px;height:34px}

.loading-text{font-size:1.4rem;font-weight:800;margin-bottom:12px;background:linear-gradient(90deg,#e3b93f,#d4a72c,#e3b93f);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;letter-spacing:1px}
@keyframes shine{to{background-position:200% center}}
.loading-subtext{font-size:0.9rem;color:var(--text-light);margin-bottom:24px}
.loading-bar{width:220px;height:5px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden}
.loading-bar-inner{height:100%;width:0%;background:linear-gradient(90deg,#c99a22,#d4a72c);border-radius:10px;animation:loadBar 2s ease forwards}
@keyframes loadBar{to{width:100%}}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f5f7f5 0%,#ffffff 40%,#fff8e8 100%);padding:20px;position:relative;overflow:hidden}
#auth-screen::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(212,175,55,0.06) 0%,transparent 50%);animation:rotate 30s linear infinite}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.auth-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:40px 32px;width:100%;max-width:420px;box-shadow:var(--shadow-lg),0 0 60px rgba(15,118,110,0.1);animation:slideUp 0.6s ease;position:relative;z-index:1;border:1px solid var(--border)}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{text-align:center;margin-bottom:30px}
.auth-logo .icon{width:80px;height:80px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:2.5rem;margin-bottom:16px;box-shadow:0 8px 30px rgba(15,118,110,0.3);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.auth-logo h1{font-size:1.6rem;font-weight:900;color:var(--text);margin-bottom:6px;letter-spacing:1px}
.auth-logo p{color:var(--text-light);font-size:0.9rem}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;border-radius:12px;overflow:hidden;border:2px solid var(--border);background:var(--bg)}
.auth-tab{flex:1;padding:14px;border:none;background:transparent;cursor:pointer;font-weight:700;font-size:0.95rem;color:var(--text-light);transition:all 0.3s}
.auth-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;box-shadow:0 4px 15px rgba(15,118,110,0.3)}
.auth-form .form-group{margin-bottom:20px}
.auth-form label{display:block;margin-bottom:8px;font-weight:700;font-size:0.85rem;color:var(--text-light)}
.auth-form input{width:100%;padding:14px 16px;background:var(--bg);border:2px solid var(--border);border-radius:12px;font-size:1rem;color:var(--text);font-family:inherit;transition:all 0.3s}
.auth-form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(15,118,110,0.15)}
.auth-form input::placeholder{color:var(--text-muted)}
.btn-auth{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;font-size:1.05rem;font-weight:800;cursor:pointer;margin-top:10px;box-shadow:0 4px 20px rgba(15,118,110,0.3);transition:all 0.3s}
.btn-auth:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(15,118,110,0.4)}
.btn-auth:disabled{opacity:0.6;transform:none}
.auth-error{background:rgba(239,68,68,0.1);color:var(--danger);padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:0.9rem;display:none;border:1px solid rgba(239,68,68,0.2)}
.auth-footer{text-align:center;margin-top:20px;color:var(--text-muted);font-size:0.8rem}
#app{display:none;min-height:100vh}
.app-header{background:linear-gradient(135deg,#f5f7f5,#ffffff);color:var(--text);padding:16px 18px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(31,55,48,0.08);border-bottom:1px solid var(--border)}
.app-header h1{font-size:1.15rem;display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:0.5px}
.app-header .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 4px 15px rgba(15,118,110,0.3)}
.app-header .logo-text{display:flex;flex-direction:column;gap:2px}
.app-header .logo-text small{font-size:0.65rem;font-weight:500;color:var(--text-light);margin-top:2px}
.user-info{display:flex;align-items:center;gap:12px}
.user-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:white;box-shadow:0 2px 10px rgba(15,118,110,0.3)}
.logout-btn{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:var(--danger);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;transition:all 0.3s}
.logout-btn:hover{background:rgba(239,68,68,0.2);transform:scale(1.05)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.97);display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(31,55,48,0.10);border-top:1px solid var(--border);backdrop-filter:blur(20px)}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:none;background:none;color:var(--text-muted);font-size:0.7rem;cursor:pointer;border-radius:14px;transition:all 0.3s}
.bottom-nav-item i{font-size:1.3rem;transition:all 0.3s}
.bottom-nav-item.active{color:var(--primary);background:rgba(15,118,110,0.12);font-weight:800}
.bottom-nav-item.active i{transform:translateY(-2px)}
.content-area{padding:16px 16px 100px;max-width:900px;margin:0 auto}
.card{background:var(--bg-card);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);transition:all 0.3s}
.card:hover{box-shadow:var(--shadow-glow);border-color:var(--border-light)}
.card-title{font-size:1.05rem;color:var(--text);margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:800}
.card-title i{color:var(--primary)}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--bg-card);border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden;transition:all 0.3s;cursor:pointer}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-glow)}
.stat-card .stat-icon{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:8px}
.stat-card.primary .stat-icon{background:rgba(15,118,110,0.15)}
.stat-card.primary::before{background:linear-gradient(90deg,var(--primary),var(--primary-light))}
.stat-card.danger .stat-icon{background:rgba(239,68,68,0.15)}
.stat-card.danger::before{background:linear-gradient(90deg,var(--danger),var(--danger-light))}
.stat-card.accent .stat-icon{background:rgba(245,158,11,0.15)}
.stat-card.accent::before{background:linear-gradient(90deg,var(--accent),var(--accent-light))}
.stat-card.success .stat-icon{background:rgba(16,185,129,0.15)}
.stat-card.success::before{background:linear-gradient(90deg,var(--success),var(--success-light))}
.stat-card.info .stat-icon{background:rgba(14,165,233,0.15)}
.stat-card.info::before{background:linear-gradient(90deg,var(--info),var(--info-light))}
.stat-value{font-size:1.3rem;font-weight:900;margin:6px 0}
.stat-card.primary .stat-value{color:var(--primary-light)}
.stat-card.danger .stat-value{color:var(--danger-light)}
.stat-card.accent .stat-value{color:var(--accent-light)}
.stat-card.success .stat-value{color:var(--success-light)}
.stat-card.info .stat-value{color:var(--info-light)}
.stat-label{font-size:0.75rem;color:var(--text-light);font-weight:700}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:16px}
@media(min-width:600px){.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.form-grid{grid-template-columns:repeat(3,1fr)}}
.form-group label{display:block;margin-bottom:8px;font-weight:700;font-size:0.82rem;color:var(--text-light)}
.form-group input,.form-group select{width:100%;padding:14px 16px;background:var(--bg-input);border:2px solid var(--border);border-radius:12px;font-size:1rem;font-family:inherit;color:var(--text);transition:all 0.3s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(15,118,110,0.15)}
.form-group input::placeholder,.form-group select option{color:var(--text-muted)}
.form-group input[readonly]{background:var(--bg-elevated);color:var(--text-light)}
.profit-input{background:rgba(16,185,129,0.1)!important;color:var(--success-light)!important;font-weight:800!important;border-color:rgba(16,185,129,0.3)!important}
.btn{padding:14px 28px;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all 0.3s;font-family:inherit}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;box-shadow:0 4px 20px rgba(15,118,110,0.3)}
.btn-primary:hover{box-shadow:0 6px 25px rgba(15,118,110,0.4)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#dc2626);color:white;box-shadow:0 4px 20px rgba(239,68,68,0.3)}
.btn-accent{background:linear-gradient(135deg,var(--accent),#d97706);color:white;box-shadow:0 4px 20px rgba(245,158,11,0.3)}
.btn-success{background:linear-gradient(135deg,var(--success),#059669);color:white;box-shadow:0 4px 20px rgba(16,185,129,0.3)}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary-light)}
.btn-outline:hover{background:rgba(15,118,110,0.1)}
.btn-sm{padding:8px 14px;font-size:0.8rem}
.btn-block{width:100%}

.pos-sale-mode{display:flex;gap:6px;margin-top:8px}
.pos-sale-mode button{flex:1;border:1px solid var(--border);background:#fff;color:var(--text-muted);border-radius:9px;padding:8px 5px;font-family:inherit;font-size:.68rem;font-weight:900;cursor:pointer}
.pos-sale-mode button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.pos-value-input{display:flex;align-items:center;gap:6px;margin-top:7px}
.pos-value-input input{width:100%;min-width:0;padding:9px;border:1.5px solid var(--primary);border-radius:10px;background:#fff;color:var(--text);font-family:inherit;font-weight:900;text-align:center}
.pos-value-hint{font-size:.64rem;color:var(--text-muted);margin-top:5px;line-height:1.45}
.settings-hero{background:linear-gradient(135deg,#0f766e,#0b5f58);color:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 10px 28px rgba(15,118,110,.20)}
.settings-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.settings-hero h2{margin:0;font-size:1.2rem;font-weight:900}
.settings-hero p{margin:7px 0 0;color:rgba(255,255,255,.82);font-size:.78rem}
.settings-back{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:11px;padding:9px 12px;cursor:pointer;font-family:inherit;font-weight:800}
.settings-version{background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-size:.72rem;font-weight:800}
.settings-list{display:flex;flex-direction:column;gap:0}
.settings-row{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-row:last-child{border-bottom:none}
.settings-icon{width:42px;height:42px;min-width:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;background:rgba(15,118,110,.10);color:var(--primary)}
.settings-row-main{flex:1;min-width:0}
.settings-row-title{font-weight:900;color:var(--text);font-size:.9rem}
.settings-row-sub{font-size:.72rem;color:var(--text-muted);margin-top:3px;line-height:1.5}
.settings-arrow{color:var(--text-muted);font-size:.85rem}
.settings-badge{font-size:.65rem;padding:4px 8px;border-radius:999px;background:rgba(16,185,129,.12);color:var(--success);font-weight:800}
.settings-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.settings-mini-stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:13px;padding:12px;text-align:center}
.settings-mini-stat strong{display:block;font-size:1rem;color:var(--primary-light)}
.settings-mini-stat span{display:block;margin-top:4px;font-size:.68rem;color:var(--text-muted)}
.settings-switch{position:relative;width:46px;height:26px;flex:0 0 46px}
.settings-switch input{display:none}
.settings-switch span{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s}
.settings-switch span:before{content:'';position:absolute;width:20px;height:20px;top:3px;right:23px;background:#fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.2s}
.settings-switch input:checked+span{background:var(--primary)}
.settings-switch input:checked+span:before{right:3px}
.settings-note{padding:12px;border-radius:12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.20);color:var(--text-light);font-size:.74rem;line-height:1.7}
.settings-profile{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px}
.settings-profile-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-weight:900;font-size:1.15rem}
.settings-profile-info{flex:1;min-width:0}
.settings-profile-info strong{display:block;font-size:.9rem}
.settings-profile-info span{display:block;color:var(--text-muted);font-size:.72rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn:disabled{opacity:0.5;transform:none}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:0.88rem;table-layout:auto}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
th{background:var(--bg-elevated);font-weight:800;color:var(--primary-light);font-size:0.75rem}
tr:hover td{background:rgba(15,118,110,0.05)}
.td-customer{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-product{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-date{min-width:90px}
.td-type{min-width:60px}
.td-qty{min-width:50px}
.td-price{min-width:80px}
.td-total{min-width:90px}
.td-profit{min-width:80px}
.td-action{min-width:90px;text-align:center}
@media(max-width:600px){th,td{padding:8px 5px;font-size:0.8rem}.td-customer{max-width:80px}.td-product{max-width:100px}.td-action{min-width:80px}}
.badge{padding:5px 12px;border-radius:20px;font-size:0.72rem;font-weight:800;display:inline-block}
.badge-cheese{background:rgba(245,158,11,0.15);color:var(--accent-light);border:1px solid rgba(245,158,11,0.2)}
.badge-frozen{background:rgba(14,165,233,0.15);color:var(--info-light);border:1px solid rgba(14,165,233,0.2)}
.badge-debt{background:rgba(239,68,68,0.15);color:var(--danger-light);border:1px solid rgba(239,68,68,0.2)}
.badge-paid{background:rgba(16,185,129,0.15);color:var(--success-light);border:1px solid rgba(16,185,129,0.2)}
.search-box{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-box input{flex:1;min-width:180px;padding:12px 16px;background:var(--bg-input);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit}
.search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,0.1)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty-state i{font-size:3rem;margin-bottom:15px;opacity:0.5}
.summary-box{background:linear-gradient(135deg,#ffffff,#fff8e8,#f6ead0);color:white;border-radius:var(--radius-lg);padding:28px 22px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-glow);border:1px solid rgba(15,118,110,0.2)}
.summary-box::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(212,175,55,0.08) 0%,transparent 60%)}
.summary-box h2{text-align:center;margin-bottom:24px;font-size:1.3rem;position:relative;z-index:1;font-weight:900}
.summary-grid{display:grid;grid-template-columns:1fr;gap:12px;position:relative;z-index:1}
@media(min-width:600px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.summary-grid{grid-template-columns:repeat(4,1fr)}}
.summary-item{background:rgba(255,255,255,0.06);border-radius:14px;padding:18px 14px;text-align:center;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(10px);transition:all 0.3s}
.summary-item:hover{background:rgba(255,255,255,0.1);transform:translateY(-2px)}
.summary-item h3{font-size:0.8rem;opacity:0.7;margin-bottom:8px;font-weight:600}
.summary-item .amount{font-size:1.2rem;font-weight:900}

<script>
// ==================== معلومات الإصدار ====================
const APP_VERSION='v1.5.56';
const APP_NAME = "متجري";
const APP_BUILD_DATE = "25 أغسطس 2026 — مزامنة Google Drive تلقائية محسّنة ومضمونة";

// =====================================================
// ☁️ Google Drive — مزامنة تلقائية + نسخة محلية
// =====================================================
// هذا هو OAuth Client ID الذي أنشأته في Google Cloud.
// Client ID ليس سرًا ولا يحتاج Client Secret داخل ملف HTML.
const GOOGLE_CLIENT_ID = '795977355730-q1sckt9ldq3fi8vrgtjr960q3pabqttv.apps.googleusercontent.com';
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GOOGLE_USERINFO_SCOPE = 'openid email profile';
const GOOGLE_BACKUP_FILE = 'كنوز_الطبيعة_Backup.json';

let googleTokenClient = null;
let googleAccessToken = '';
let googleTokenExpiresAt = 0;
let googleDriveFileId = localStorage.getItem('bm_google_drive_file_id') || '';
let googleAuthUser = null;
let driveBackupTimer = null;
let driveBackupInProgress = false;
let driveBackupPending = false;
let driveAuthRefreshInProgress = false;
let driveSilentRefreshTimer = null;
let driveAutoSyncInterval = null;
let driveAutoSyncRetryTimer = null;
let driveAutoSyncRetryCount = 0;
const DRIVE_SYNC_PENDING_KEY = 'bm_cloud_sync_pending';

function isGoogleDriveReady(){
  return !!(window.google && window.google.accounts?.oauth2);
}

function driveAccessTokenValid(){
  return !!googleAccessToken && Date.now() < (googleTokenExpiresAt - 60000);
}

function initGoogleDriveClient(){
  if(!isGoogleDriveReady() || googleTokenClient) return !!googleTokenClient;
  googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_DRIVE_SCOPE + ' ' + GOOGLE_USERINFO_SCOPE,
    include_granted_scopes: true,
    callback: async (response) => {
      if(!response || response.error){
        console.error('Google OAuth error:', response);
        localStorage.removeItem('bm_google_connected');
        showToast('❌ تعذر ربط حساب Google. راجع إعدادات OAuth في Google Cloud.','error');
        return;
      }

      googleAccessToken = response.access_token || '';
      googleTokenExpiresAt = Date.now() + (Number(response.expires_in || 3600) * 1000);

      // نعتبر الحساب مرتبطًا بمجرد استلام Access Token.
      // هذا يمنع بقاء شاشة الإعدادات على "غير مرتبط" إذا فشل طلب Drive لاحقًا.
      localStorage.setItem('bm_google_connected','1');

      const silentAuth=!!window.__silentGoogleAuthRequest;
      window.__silentGoogleAuthRequest=false;
      driveAuthRefreshInProgress=false;
      try{
        await loadGoogleUserInfo();
        if(typeof navigateTo==='function' && !silentAuth) navigateTo('settings');

        try{
          await findGoogleBackupFile();
        }catch(driveError){
          console.error('Google Drive file check failed:', driveError);
          if(!silentAuth) showToast('⚠️ تم ربط الحساب، لكن تعذر الوصول إلى Google Drive','warning');
        }

        // بعد تجديد التوكن: نفّذ المزامنة المعلقة تلقائيًا.
        // عند أول ربط فقط لا نرفع فوق نسخة سحابية موجودة تلقائيًا؛
        // ذلك يمنع جهازًا جديدًا من الكتابة فوق بياناتك القديمة قبل الاستعادة.
        if(localStorage.getItem(DRIVE_SYNC_PENDING_KEY)==='1' || (googleDriveFileId && localStorage.getItem('bm_google_backup_at')) || (!googleDriveFileId && !localStorage.getItem('bm_google_backup_at'))){
          setTimeout(()=>backupToGoogle({silent:true}),250);
        }
        refreshGoogleBackupStatusUI();
        updateSyncStatus();
        if(!silentAuth) showToast('✅ تم ربط حساب Google وتفعيل المزامنة التلقائية','success');
      }catch(e){
        console.error('Google account initialization error:',e);
        if(typeof navigateTo==='function' && !silentAuth) navigateTo('settings');
        if(!silentAuth) showToast('⚠️ تم ربط Google لكن تعذر إكمال إعداد النسخ الاحتياطي','warning');
      }
    },
    error_callback: (error) => {
      console.error('Google OAuth popup error:', error);
      if(!window.__silentGoogleAuthRequest) showToast('❌ لم يكتمل تسجيل Google. اسمح بالنوافذ المنبثقة ثم حاول مرة أخرى.','error');
      window.__silentGoogleAuthRequest=false;
    }
  });
  return true;
}

function requestGoogleDriveAccess(options={}){
  const silent=!!options.silent;
  if(!isGoogleDriveReady()){
    if(!silent){
      showToast('⏳ جاري تحميل خدمة Google، حاول مرة أخرى بعد لحظات','info');
    }
    clearTimeout(driveAuthRefreshInProgress?null:driveSilentRefreshTimer);
    driveSilentRefreshTimer=setTimeout(()=>requestGoogleDriveAccess(options),700);
    return;
  }
  initGoogleDriveClient();
  if(silent && driveAuthRefreshInProgress) return;
  if(silent) driveAuthRefreshInProgress=true;
  window.__silentGoogleAuthRequest=silent;
  try{
    googleTokenClient.requestAccessToken({
      prompt: silent ? '' : (options.prompt || (localStorage.getItem('bm_google_connected') ? '' : 'consent')),
      hint: options.login_hint || undefined
    });
  }catch(e){
    console.error(e);
    driveAuthRefreshInProgress=false;
    window.__silentGoogleAuthRequest=false;
    if(!silent) showToast('❌ تعذر فتح تسجيل Google','error');
  }
}

async function loadGoogleUserInfo(){
  if(!driveAccessTokenValid()) return null;
  const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+googleAccessToken}});
  if(!r.ok) throw new Error('userinfo '+r.status);
  const u=await r.json();
  googleAuthUser=u;
  localStorage.setItem('bm_google_uid',u.sub||'');
  localStorage.setItem('bm_google_email',u.email||'');
  localStorage.setItem('bm_google_name',u.name||u.given_name||'');
  return u;
}

async function driveFetch(url, options={}){
  if(!driveAccessTokenValid()) throw new Error('GOOGLE_TOKEN_EXPIRED');
  const headers=new Headers(options.headers||{});
  headers.set('Authorization','Bearer '+googleAccessToken);
  if(options.body && !headers.has('Content-Type') && typeof options.body === 'string') headers.set('Content-Type','application/json');
  const r=await fetch(url,{...options,headers});
  if(r.status===401){ googleAccessToken=''; googleTokenExpiresAt=0; throw new Error('GOOGLE_TOKEN_EXPIRED'); }
  return r;
}

async function findGoogleBackupFile(){
  if(!driveAccessTokenValid()) return null;
  const q=`name='${GOOGLE_BACKUP_FILE.replace(/'/g,"\\'")}' and trashed=false`;
  const url='https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({
    q,
    spaces:'drive',
    fields:'files(id,name,modifiedTime,size)',
    orderBy:'modifiedTime desc',
    pageSize:'20'
  });
  const r=await driveFetch(url);
  if(!r.ok) throw new Error('Drive list '+r.status+' '+await r.text());
  const data=await r.json();
  const files=(data.files||[]).slice().sort((a,b)=>new Date(b.modifiedTime||0)-new Date(a.modifiedTime||0));
  const file=files[0]||null;
  googleDriveFileId=file?.id||'';
  if(googleDriveFileId) localStorage.setItem('bm_google_drive_file_id',googleDriveFileId);
  else localStorage.removeItem('bm_google_drive_file_id');
  return file;
}

// يتحقق من محتوى ملف Google فعليًا قبل استخدامه للاستعادة.
async function downloadGoogleBackupFile(fileId){
  if(!fileId) throw new Error('NO_GOOGLE_FILE');
  const url='https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId)+'?alt=media';
  const r=await driveFetch(url);
  if(!r.ok) throw new Error('Drive download '+r.status+' '+await r.text());
  const data=await r.json();
  if(!data || typeof data!=='object') throw new Error('INVALID_BACKUP');
  return data;
}

// لو عندنا أكثر من ملف بنفس الاسم، لا نختار نسخة فارغة. نبحث عن أحدث نسخة سليمة.
async function findUsableGoogleBackupFile(){
  if(!driveAccessTokenValid()) return null;
  const q=`name='${GOOGLE_BACKUP_FILE.replace(/'/g,"\\'")}' and trashed=false`;
  const url='https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({
    q, spaces:'drive', fields:'files(id,name,modifiedTime,size)',
    orderBy:'modifiedTime desc', pageSize:'20'
  });
  const r=await driveFetch(url);
  if(!r.ok) throw new Error('Drive list '+r.status+' '+await r.text());
  const data=await r.json();
  const files=(data.files||[]).slice().sort((a,b)=>new Date(b.modifiedTime||0)-new Date(a.modifiedTime||0));
  for(const file of files){
    try{
      const backup=await downloadGoogleBackupFile(file.id);
      if(isUsableBackup(backup)){
        googleDriveFileId=file.id;
        localStorage.setItem('bm_google_drive_file_id',file.id);
        return {file,data:backup};
      }
    }catch(e){ console.warn('تجاهل ملف Google غير صالح:',file.id,e); }
  }
  return null;
}

function buildBackupPayload(){
  return {
    backupType:'kanouz-al-tabia-data',
    backupVersion:2,
    appName:getAppName(),
    version:APP_VERSION,
    exportedAt:new Date().toISOString(),
    userData:currentUser,
    products:Store.get('products'),
    sales:Store.get('sales'),
    purchases:Store.get('purchases'),
    expenses:Store.get('expenses'),
    withdrawals:Store.get('withdrawals'),
    debts:Store.get('debts'),
    customers:Store.get('customers'),
    suppliers:Store.get('suppliers'),
    offers:Store.get('offers'),
    auditLog:Store.get('auditLog')
  };
}


function backupRecordCounts(data){
  const keys=getBackupCollections();
  const counts={};
  let total=0;
  keys.forEach(k=>{counts[k]=Array.isArray(data?.[k])?data[k].length:0; total+=counts[k];});
  return {counts,total};
}
function backupSummary(data){
  const {counts,total}=backupRecordCounts(data);
  return `الأصناف ${counts.products} • المبيعات ${counts.sales} • المشتريات ${counts.purchases} • العملاء ${counts.customers} • إجمالي السجلات ${total}`;
}
function isUsableBackup(data){
  if(!data || typeof data!=='object') return false;
  const core=['products','sales','purchases','expenses','withdrawals','debts','customers','suppliers','offers'];
  const validShape=core.every(k=>Array.isArray(data[k]));
  return validShape && backupRecordCounts(data).total>0;
}

async function createDriveBackupFile(payload){
  const meta={name:GOOGLE_BACKUP_FILE,mimeType:'application/json'};
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name,modifiedTime',{method:'POST',body:JSON.stringify(meta)});
  if(!r.ok) throw new Error('Drive create '+r.status+' '+await r.text());
  const file=await r.json();
  googleDriveFileId=file.id;
  localStorage.setItem('bm_google_drive_file_id',googleDriveFileId);
  await uploadDriveBackupData(payload);
  return file;
}

async function uploadDriveBackupData(payload){
  if(!googleDriveFileId) return createDriveBackupFile(payload);
  const body=JSON.stringify(payload);
  const url='https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(googleDriveFileId)+'?uploadType=media&fields=id,name,modifiedTime';
  const r=await driveFetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
  if(r.status===404){
    googleDriveFileId='';
    localStorage.removeItem('bm_google_drive_file_id');
    return createDriveBackupFile(payload);
  }
  if(!r.ok) throw new Error('Drive upload '+r.status+' '+await r.text());
  return r.json();
}

async function backupToGoogle(options={}){
  const silent=!!options.silent;
  const retrying=!!options.retrying;
  if(!driveAccessTokenValid()){
    // لا نفقد التغيير: نضعه دائمًا في قائمة الانتظار، ثم نحاول تجديد جلسة Google
    // ونكرر الرفع تلقائيًا. هذا مهم خصوصًا بعد إغلاق Chrome أو انتهاء Access Token.
    markCloudSyncPending();
    if(localStorage.getItem('bm_google_connected')==='1' && navigator.onLine && !retrying){
      requestGoogleDriveAccess({silent:true});
      scheduleDriveAutoSyncRetry();
    }else if(!silent){
      requestGoogleDriveAccess({prompt:localStorage.getItem('bm_google_connected')?'':'consent'});
    }
    return false;
  }
  if(driveBackupInProgress){
    driveBackupPending=true;
    return false;
  }
  driveBackupInProgress=true;
  try{
    // أهم حماية: لا نرفع أبدًا نسخة محلية فارغة أو ناقصة.
    const payload=buildBackupPayload();
    if(!isUsableBackup(payload)){
      if(!silent) showToast('🛡️ تم منع رفع نسخة فارغة إلى Google Drive','warning');
      return false;
    }

    if(!googleDriveFileId) await findGoogleBackupFile();
    await uploadDriveBackupData(payload);

    // تحقق حقيقي من الملف بعد الرفع. لو كان المحتوى غير صالح، نحاول إنشاء ملف سليم جديد.
    let verified=false;
    for(let attempt=0; attempt<2 && !verified; attempt++){
      try{
        const remote=await downloadGoogleBackupFile(googleDriveFileId);
        verified=isUsableBackup(remote) && backupRecordCounts(remote).total===backupRecordCounts(payload).total;
      }catch(e){
        if(e.message==='GOOGLE_TOKEN_EXPIRED') throw e;
      }
      if(!verified) await new Promise(resolve=>setTimeout(resolve,900));
    }
    if(!verified){
      googleDriveFileId='';
      localStorage.removeItem('bm_google_drive_file_id');
      await uploadDriveBackupData(payload);
      const remote=await downloadGoogleBackupFile(googleDriveFileId);
      verified=isUsableBackup(remote) && backupRecordCounts(remote).total===backupRecordCounts(payload).total;
    }
    if(!verified) throw new Error('GOOGLE_BACKUP_VERIFY_FAILED');

    const stamp=new Date().toLocaleString('ar-EG');
    localStorage.setItem('bm_google_backup_at',stamp); refreshLocalBackupStamp(stamp);
    localStorage.setItem('bm_last_backup',stamp); refreshLocalBackupStamp(stamp);
    localStorage.setItem('bm_google_backup_counts',JSON.stringify(backupRecordCounts(payload).counts));
    localStorage.removeItem(DRIVE_SYNC_PENDING_KEY);
    refreshGoogleBackupStatusUI();
    if(!silent) showToast('☁️ تم رفع النسخة السليمة والتحقق منها على Google بنجاح','success');
    return true;
  }catch(e){
    console.error('Google Drive backup failed:',e);
    refreshGoogleBackupStatusUI();
    if(e.message==='GOOGLE_TOKEN_EXPIRED' && localStorage.getItem('bm_google_connected')==='1' && navigator.onLine && !retrying){
      markCloudSyncPending();
      requestGoogleDriveAccess({silent:true});
    }else if(!silent){
      if(e.message==='GOOGLE_TOKEN_EXPIRED') showToast('⚠️ انتهت جلسة Google، سيتم تجديدها تلقائيًا عند الإمكان','warning');
      else if(e.message==='GOOGLE_BACKUP_VERIFY_FAILED') showToast('❌ تم الرفع لكن تعذر التحقق من سلامة النسخة. لم نعتبرها نسخة ناجحة.','error');
      else showToast('❌ فشل رفع النسخة إلى Google','error');
    }
    return false;
  }finally{
    driveBackupInProgress=false;
    if(driveBackupPending){
      driveBackupPending=false;
      setTimeout(()=>backupToGoogle({silent:true}),500);
    }
  }
}

async function restoreFromGoogle(){
  if(!driveAccessTokenValid()){
    requestGoogleDriveAccess({prompt:localStorage.getItem('bm_google_connected')?'':'consent'});
    return;
  }
  if(!confirm('⚠️ سيتم استبدال البيانات المحلية بالنسخة الموجودة على Google Drive. هل تريد المتابعة؟')) return;
  try{
    showToast('⏳ جاري استعادة البيانات من Google Drive...','info');
    const found=await findUsableGoogleBackupFile();
    if(!found) return showToast('🛡️ لم نجد نسخة سليمة على Google Drive. تم إيقاف الاستعادة لحماية بياناتك.','error');
    const data=found.data;
    const collections=getBackupCollections();
    if(!isUsableBackup(data)){
      showToast('🛡️ النسخة الموجودة على Google فارغة، وتم إيقاف الاستعادة لحماية بياناتك','error');
      return;
    }
    if(!confirm('تم العثور على نسخة صالحة على Google Drive.\n'+backupSummary(data)+'\n\nهل تريد استعادتها واستبدال البيانات الحالية؟')) return;
    for(const col of collections) Store.set(col,Array.isArray(data[col])?data[col]:[]);
    if(data.userData){ currentUser=data.userData; Store.setUser(currentUser); }
    const stamp=data.exportedAt ? new Date(data.exportedAt).toLocaleString('ar-EG') : new Date().toLocaleString('ar-EG');
    localStorage.setItem('bm_google_backup_at',stamp); refreshLocalBackupStamp(stamp);
    localStorage.setItem('bm_last_backup',stamp); refreshLocalBackupStamp(stamp);
    showToast('✅ تمت استعادة بياناتك من Google Drive','success');
    setTimeout(()=>location.reload(),700);
  }catch(e){
    console.error('Google Drive restore failed:',e);
    if(e.message==='GOOGLE_TOKEN_EXPIRED') showToast('⚠️ انتهت جلسة Google، اضغط ربط حساب Google مرة أخرى','warning');
    else showToast('❌ فشلت استعادة النسخة من Google Drive','error');
  }
}

async function ensureGoogleBackupUser(){
  if(driveAccessTokenValid() && googleAuthUser) return googleAuthUser;
  if(driveAccessTokenValid()) return loadGoogleUserInfo();
  requestGoogleDriveAccess({prompt:localStorage.getItem('bm_google_connected')?'':'consent'});
  return null;
}

function signInWithGoogleBackup(){
  requestGoogleDriveAccess({prompt:'select_account'});
}

function cloudBackupStatus(){
  const email=localStorage.getItem('bm_google_email')||'';
  if(email) return 'Google: '+email;
  if(localStorage.getItem('bm_google_connected')==='1') return 'حساب Google مرتبط';
  return 'غير مرتبط بحساب Google';
}

function getGoogleBackupDisplay(){
  const stamp=localStorage.getItem('bm_google_backup_at')||'';
  const fileId=localStorage.getItem('bm_google_drive_file_id')||'';
  if(stamp) return {title:'آخر رفع ناجح ومتحقق',value:stamp,ok:true};
  if(fileId) return {title:'حالة النسخة على Google',value:'يوجد ملف محفوظ — اضغط رفع للتأكد من سلامته',ok:false};
  if(localStorage.getItem('bm_google_connected')==='1') return {title:'حالة النسخة على Google',value:'لا توجد نسخة مرفوعة على Google حتى الآن',ok:false};

function markCloudSyncPending(){
  localStorage.setItem(DRIVE_SYNC_PENDING_KEY,'1');
  updateSyncStatus();

function scheduleDriveAutoSyncRetry(delay=5000){
  clearTimeout(driveAutoSyncRetryTimer);
  if(!navigator.onLine || localStorage.getItem('bm_google_connected')!=='1') return;
  driveAutoSyncRetryTimer=setTimeout(()=>{
    if(localStorage.getItem(DRIVE_SYNC_PENDING_KEY)!=='1') return;
    if(driveBackupInProgress){
      scheduleDriveAutoSyncRetry(5000);
      return;
    }
    if(driveAccessTokenValid()){
      driveAutoSyncRetryCount=0;
      backupToGoogle({silent:true});
      return;
    }
    driveAutoSyncRetryCount=Math.min(driveAutoSyncRetryCount+1,12);
    requestGoogleDriveAccess({silent:true});
    // إعادة المحاولة تدريجيًا حتى 60 ثانية كحد أقصى بين المحاولات.
    const nextDelay=Math.min(5000*Math.max(1,driveAutoSyncRetryCount),60000);
    scheduleDriveAutoSyncRetry(nextDelay);
  },delay);
}

function scheduleDriveBackup(){
  markCloudSyncPending();
  clearTimeout(driveBackupTimer);
  // الحفظ المحلي فوري. بعد كل تعديل مهم ننتظر قليلًا لتجميع عدة تغييرات،
  // ثم نرفع تلقائيًا إلى Google إذا كان الحساب متصلًا. لا يحتاج المستخدم أي زر.
  if(!navigator.onLine || localStorage.getItem('bm_google_connected')!=='1') return;
  driveBackupTimer=setTimeout(()=>{
    if(driveBackupInProgress){
      driveBackupPending=true;
      scheduleDriveAutoSyncRetry(5000);
      return;
    }
    if(!driveAccessTokenValid()){
      requestGoogleDriveAccess({silent:true});
      scheduleDriveAutoSyncRetry(3000);
      return;
    }
    driveAutoSyncRetryCount=0;
    backupToGoogle({silent:true});
  },1500);
}

function startDriveAutoSyncMonitor(){
  if(driveAutoSyncInterval) return;
  // فحص دوري أقصر للتغييرات المعلقة؛ يفيد بعد انتهاء التوكن أو رجوع الإنترنت.
  driveAutoSyncInterval=setInterval(()=>{
    if(!navigator.onLine || localStorage.getItem('bm_google_connected')!=='1') return;
    if(localStorage.getItem(DRIVE_SYNC_PENDING_KEY)!=='1') return;
    if(driveBackupInProgress) return;
    if(!driveAccessTokenValid()){
      requestGoogleDriveAccess({silent:true});
      scheduleDriveAutoSyncRetry(3000);
      return;
    }
    driveAutoSyncRetryCount=0;
    backupToGoogle({silent:true});
  },15000);
}

// ==================== Core safety helpers ====================
// One rounding point for monetary values. Use this helper whenever a value is
// persisted or compared as money; it avoids common floating-point drift.
function money(value){
  const n=Number(value);
  if(!Number.isFinite(n)) return 0;
  return Math.round((n+Number.EPSILON)*100)/100;
}
function safeUUID(){
  try{ if(window.crypto?.randomUUID) return window.crypto.randomUUID(); }catch(e){}
  return 'm-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)+'-'+Math.random().toString(36).slice(2,10);
}

const Store={
  get(key){
    try{
      const raw=localStorage.getItem('bm_'+key);
      if(raw===null || raw==='') return [];
      const parsed=JSON.parse(raw);
      return parsed;
    }catch(e){
      console.warn('تعذر قراءة البيانات المحلية:', key, e);
      return [];
    }
  },
  set(key,val){
    try{
      localStorage.setItem('bm_'+key,JSON.stringify(val));
      // أي تغيير فعلي في البيانات يضع المزامنة السحابية في قائمة الانتظار.
      // التنفيذ مؤجل Debounced حتى لا نرسل عشرات الطلبات عند تحديث عدة سجلات متتالية.
      if(Array.isArray(getBackupCollections()) && getBackupCollections().includes(key)) scheduleDriveBackup();
      return true;
    }catch(e){
      console.warn('تعذر حفظ البيانات المحلية:', key, e);
      return false;
    }
  },
  add(key,data){
    const arr=this.get(key);
    data.id=safeUUID();
    data.createdAt=new Date().toISOString();
    arr.push(data);
    this.set(key,arr);
    this.logAudit('إضافة',key,data.id,data.name||data.person||'');
    scheduleDriveBackup();
    return data;
  },
  update(key,id,data){
    const arr=this.get(key);
    const i=arr.findIndex(x=>x.id===id);
    if(i<0) return false;
    const oldName=arr[i].name||arr[i].person||'';
    arr[i]={...arr[i],...data,updatedAt:new Date().toISOString()};
    if(!this.set(key,arr)) return false;
    this.logAudit('تعديل',key,id,oldName);
    scheduleDriveBackup();
    return true;
  },
  delete(key,id){
    const arr=this.get(key);
    const item=arr.find(x=>x.id===id);
    this.set(key,arr.filter(x=>x.id!==id));
    if(item)this.logAudit('حذف',key,id,item.name||item.person||'');
    scheduleDriveBackup();
  },
  getUser(){return JSON.parse(localStorage.getItem('bm_user')||'null')},
  setUser(u){localStorage.setItem('bm_user',JSON.stringify(u))},
  logAudit(action,entity,entityId,description){
    const logs=this.get('auditLog');
    logs.unshift({
      id:Date.now().toString(36),
      action,entity,entityId,description,
      timestamp:new Date().toISOString(),
      user:currentUser?.name||'مستخدم'
    });
    if(logs.length>500)logs.length=500;
    this.set('auditLog',logs);
    scheduleDriveBackup();
  },
  getAuditLog(){return this.get('auditLog')},
  clear(){['products','sales','purchases','expenses','withdrawals','debts','customers','suppliers','offers','auditLog','user'].forEach(k=>localStorage.removeItem('bm_'+k))}
};

// Lightweight local transaction helper. It snapshots selected collections and
// restores them if the supplied operation throws. This is intentionally opt-in
// so legacy data is not changed just by loading the app.
function runLocalTransaction(keys, operation){
  const snapshot={};
  (keys||[]).forEach(k=>{ snapshot[k]=Store.get(k); });
  try{
    const result=operation();
    return result;
  }catch(error){
    (keys||[]).forEach(k=>{ try{ Store.set(k,snapshot[k]); }catch(e){} });
    throw error;
  }
}

async function hashLockPin(pin){
  const data=new TextEncoder().encode(String(pin));
  if(window.crypto?.subtle){
    const digest=await crypto.subtle.digest('SHA-256',data);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  /* fallback محلي فقط عند عدم توفر Web Crypto */
  let h=2166136261;
  for(let i=0;i<String(pin).length;i++){h^=String(pin).charCodeAt(i);h=Math.imul(h,16777619);}
  return 'fallback-'+(h>>>0).toString(16);
}

async function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري...';
  const email=document.getElementById('loginEmail').value.trim();

  const s=getAppSettings();
  let ok=!!(user&&String(user.email||'').toLowerCase()===String(email||'').toLowerCase());
  if(ok && s.lockEnabled && s.lockPinHash){
    ok=(await hashLockPin(pin))===s.lockPinHash;
  }else if(ok && user.passwordHash){
    ok=(await hashLockPin(pin))===user.passwordHash;
  }
  if(ok){currentUser=user;showApp();}
  else{
    const msg=(s.lockEnabled&&s.lockPinHash)
      ? 'رمز القفل أو البريد الإلكتروني غير صحيح.'
      : 'البريد غير مسجل. أنشئ حساب جديد.';

    document.getElementById('authError').style.display='block';
  }

  const days=[],data=[],profitData=[];

function filterProducts(){
  const search=(document.getElementById('productSearch')?.value||'').trim().toLowerCase(); const sort=document.getElementById('productSort')?.value||'default';
  let products=(window.allProducts||[]).filter(p=>String(p.name||'').toLowerCase().includes(search)); const f=window.productsFilter||'all';
  if(f==='cheese'||f==='frozen') products=products.filter(p=>p.type===f); else if(f==='low') products=products.filter(p=>Number(p.qty||0)<=Number(p.minStock||5));
  const profit=p=>Number(p.retail||0)-Number(p.purchase||0); if(sort==='name')products.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar')); if(sort==='stockLow')products.sort((a,b)=>Number(a.qty||0)-Number(b.qty||0)); if(sort==='priceHigh')products.sort((a,b)=>Number(b.retail||0)-Number(a.retail||0)); if(sort==='profitHigh')products.sort((a,b)=>profit(b)-profit(a));
  const grid=document.getElementById('productsGrid'); if(!grid)return; const count=document.getElementById('productsResultCount'); if(count)count.textContent=`${products.length} صنف`;

}

function calcProductProfit(){
  const purchase=parseFloat(document.getElementById('pPurchase')?.value)||0;
  const retail=parseFloat(document.getElementById('pRetail')?.value)||0;
  const profit=retail-purchase;
  const percent=purchase>0?((profit/purchase)*100).toFixed(1):0;
  const ep=document.getElementById('pExpectedProfit');
  const pp=document.getElementById('pProfitPercent');
  if(ep){ep.value=profit.toFixed(2);ep.style.color=profit>=0?'var(--success-light)':'var(--danger-light)';}
  if(pp){pp.value=percent+'%';pp.style.color=profit>=0?'var(--success-light)':'var(--danger-light)';}
}

// ==================== تنسيق كميات المخزون والمباع حسب نوع الجبن (تم الإصلاح) ====================
function getProductQtyDecimals(p){
  if (!p) return null;

  const name = String(p.name || '').trim().toLowerCase();

  // موزاريلا + كيري + قشطة + رومي: رقمان عشريان
  if (/موزاريلا|موتزاريلا|mozzarella|كيري|kiri|قشطة|قشطه|cream|رومي|رومى|romy/.test(name)) {
    return 2;
  }

  // براميلي + جبنة الثلاجة: رقمان عشريان
  if (/براميلي|براميل|ثلاجة|ثلاجه|fridge/.test(name)) {
    return 2;
  }

  // باقي المنتجات: لا نغيّر تنسيقها.
  return null;
}

function formatProductQty(p, qty){
  const value = Number(qty);
  if(!Number.isFinite(value)) return '0';

  const decimals = getProductQtyDecimals(p);

  // الأصناف غير المميزة: لا نغيّر تنسيقها بالقوة.
  if(decimals === null){
    return String(qty);
  }

  return value.toFixed(decimals);
}

// الدالة النهائية لتصفية وعرض المنتجات بثلاثة أرقام عشرية
function filterProducts() {
  const search = document.getElementById('productSearch')?.value.toLowerCase() || '';
  const products = (window.allProducts || []).filter(p => (p.name || '').toLowerCase().includes(search));
  
  const grid = document.getElementById('productsGrid');
  if (!grid) return;

  grid.innerHTML = products.map(p => {
    const profit = (p.retail || 0) - (p.purchase || 0);
    const pct = p.purchase > 0 ? ((profit / p.purchase) * 100).toFixed(0) : 0;
    const icon = p.type === 'cheese' ? '🧀' : '❄️';
    const isLow = (p.qty || 0) <= (p.minStock || 5);
    const lowStock = isLow ? `<div style="color:var(--danger);font-size:.7rem;font-weight:800;margin-top:5px"><i class="fas fa-exclamation-triangle"></i> مخزون منخفض (${formatProductQty(p, p.qty || 0)})</div>` : '';

    return `<div class="product-item" onclick="editProduct('${p.id}')">
      <div class="p-image">${image}</div>
      <div class="p-name" title="${p.name}">${p.name}</div>

      ${lowStock}
      <div class="p-actions"><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button></div>
    </div>`;

function readProductImage(file, callback){
  if(!file) return callback('');
  if(!file.type.startsWith('image/')) return showToast('اختر ملف صورة صالح','warning');
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=900;
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.width*scale));
      canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      callback(canvas.toDataURL('image/jpeg',0.82));
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

  const wholesale=parseFloat(document.getElementById('pWholesale').value)||0;

  Store.add('products',{

function toggleSalesHistory(force){
  const section=document.getElementById('salesHistorySection');
  if(!section)return;
  const shouldOpen = typeof force==='boolean' ? force : section.classList.contains('sales-history-collapsed');
  section.classList.toggle('sales-history-collapsed',!shouldOpen);
  const btn=document.getElementById('salesHistoryOpenBtn');
  if(btn)btn.innerHTML=shouldOpen?'<i class="fas fa-chevron-up"></i>':'<i class="fas fa-chevron-down"></i>';
  const body=document.getElementById('salesHistoryBody');
  if(body)body.setAttribute('aria-hidden',shouldOpen?'false':'true');
  if(shouldOpen && typeof renderSalesTable==='function') renderSalesTable();
}

  if(btn)btn.classList.add('active');

// ==================== دوال مساعدة مفقودة ====================
function reservedProductQty(productId, excludeIndex = -1) {
    const cart = window.posCart || [];
    let total = 0;
    cart.forEach((item, index) => {
        if (index === excludeIndex) return;
        if (String(item.id) === String(productId) && !item.service) {
            total += (item.weight || 1) * (item.qty || 0);
        }
    });
    return total;
}

function packagePrice(product, weight, saleType) {
    if (!product) return 0;
    const basePrice = Number(
        saleType === 'wholesale' ? (product.wholesale || 0) : (product.retail || 0)
    );
    const safeWeight = Number(weight);
    if (!Number.isFinite(safeWeight) || safeWeight <= 0) return isKgProduct(product) ? 0 : basePrice;
    return isKgProduct(product) ? basePrice * safeWeight : basePrice;
}

function weightLabel(weight) {
    const w=Number(weight||0);
    if (w === 0) return '0';
    if (Math.abs(w-1)<0.000001) return '1 كجم';
    if (Math.abs(w-0.5)<0.000001) return '500 جم';
    if (Math.abs(w-0.25)<0.000001) return '250 جم';
    return w >= 1 ? (Number.isInteger(w)?w:w.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')) + ' كجم' : (w * 1000) + ' جم';
}

// أصناف تُباع بالعلبة وليست بالوزن حتى لو كانت الوحدة القديمة مضبوطة خطأً.
function isFixedPackProduct(p){
  if(!p) return false;
  const name=String(p.name||'').trim().toLowerCase();
  return /رومي|رومى|romy|كيري|kiri|قشطة|قشطه|cream/.test(name) && !/موزاريلا|موتزاريلا|mozzarella/.test(name);
}
function isMozzarellaProduct(p){
  if(!p) return false;
  const name=String(p.name||'').trim().toLowerCase();
  return /موزاريلا|موتزاريلا|mozzarella/.test(name);
}
function isKgProduct(p){
  if(!p) return false;
  if(isFixedPackProduct(p)) return false;
  if(isMozzarellaProduct(p)) return true;
  if(p.sellByWeight===true) return true;
  const unit=String(p.unit||'').trim().toLowerCase();
  return ['كجم','كيلو','كغ','kg','كيلوجرام'].includes(unit);
}
function saleUnitLabel(p, weight){
  if(isKgProduct(p)) return weightLabel(weight);
  return String(p?.unit||'علبة');
}
function saleQuantityLabel(p, qty, weight){
  const q=Number(qty||1);
  return isKgProduct(p) ? `${q} × ${weightLabel(weight)}` : `${q} ${saleUnitLabel(p,weight)}`;
}

// ==================== تنبيه اختيار المنتج في نقطة البيع ====================
let posSaleAudioContext = null;

function playPOSAddSound(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;

    posSaleAudioContext = posSaleAudioContext || new AudioCtx();
    if(posSaleAudioContext.state === 'suspended') posSaleAudioContext.resume();

    const now = posSaleAudioContext.currentTime;
    const osc = posSaleAudioContext.createOscillator();
    const gain = posSaleAudioContext.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(1320, now + 0.07);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.07, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);

    osc.connect(gain);
    gain.connect(posSaleAudioContext.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }catch(e){
    console.warn('تعذر تشغيل صوت إضافة المنتج:', e);
  }
}

    setTimeout(() => card.classList.remove('sale-selected'), 450);
  }

  // صوت خفيف فقط عند نجاح إضافة المنتج

}

function addToPOSCart(id, weight = 1) {
  const productId = String(id);
  const p = (window.saleProducts || []).find(x => String(x.id) === productId);
  if (!p) return showToast('تعذر العثور على المنتج', 'warning');
  const stock = Number(p.qty);
  if (!Number.isFinite(stock) || stock <= 0) return showToast('المنتج غير متاح في المخزون', 'warning');
  let actualWeight = Number(weight);
  if (!isKgProduct(p)) actualWeight = 1;
  else if (!Number.isFinite(actualWeight) || actualWeight <= 0) actualWeight = 1;

  const existingReserved = reservedProductQty(productId);
  if (existingReserved + actualWeight > stock + 0.000001) {
    return showToast(`الكمية المتاحة غير كافية — المتاح ${formatProductQty(p, p.qty)} ${p.unit || 'كجم'}`, 'warning');
  }

  window.posCart = window.posCart || [];
  const existing = window.posCart.find(x => String(x.id) === productId && Math.abs(Number(x.weight || 1) - actualWeight) < 0.000001);
  if (existing) {
    existing.qty = Number(existing.qty || 0) + 1;
  } else {
    window.posCart.push({
      id: productId,
      name: p.name || 'صنف',
      qty: 1,
      weight: actualWeight,
      priceOverride: null,
      saleMode: 'weight',
      valueAmount: 0
    });
  }
  renderPOSCart();
  renderSaleProductGrid();
  showPOSProductSelected(productId);
}

function changePOSQty(index,delta){
  const item=(window.posCart||[])[index];
  if(!item)return;
  if(item.service){
    const newQty=Number(item.qty||0)+delta;
    if(newQty<=0){window.posCart.splice(index,1);renderPOSCart();return;}
    item.qty=newQty;
    renderPOSCart();
    return;
  }
  const p=(window.saleProducts||[]).find(x=>String(x.id)===String(item.id));
  if(!p)return;
  const newQty=Number(item.qty||0)+delta;
  if(newQty<=0){window.posCart.splice(index,1);renderPOSCart();renderSaleProductGrid();return;}
  const otherReserved=reservedProductQty(p.id,index);
  const needed=otherReserved+(Number(item.weight||1)*newQty);
  if(needed>(Number(p.qty)||0)+0.000001)return showToast(`المتاح فقط ${formatProductQty(p, p.qty)} ${p.unit||'كجم'}`,'warning');
  item.qty=newQty;
  renderPOSCart(); renderSaleProductGrid();
}
function changePOSWeight(index,newWeight){
  const item=(window.posCart||[])[index];
  if(!item)return;
  const p=(window.saleProducts||[]).find(x=>String(x.id)===String(item.id)); if(!p)return;
  newWeight=Number(newWeight);
  if(!Number.isFinite(newWeight)||newWeight<=0)return showToast('أدخل وزنًا صحيحًا بالكيلو','warning');
  if(!isKgProduct(p))newWeight=1;
  const otherReserved=reservedProductQty(p.id,index);
  const needed=otherReserved+(newWeight*Number(item.qty||0));
  if(needed>(Number(p.qty)||0)+0.000001){renderPOSCart();return showToast(`المتاح لا يكفي لهذا الوزن — المتاح ${formatProductQty(p, p.qty)} ${p.unit||'كجم'}`,'warning');}
  const same=window.posCart.find((x,i)=>i!==index && String(x.id)===String(p.id) && Math.abs(Number(x.weight||1)-newWeight)<0.000001);
  if(same){same.qty+=item.qty;window.posCart.splice(index,1);}else item.weight=newWeight;
  renderPOSCart(); renderSaleProductGrid();
}
function setPOSQuickWeight(index,grams){

function handleLiveWeightInput(index, value, pricePerKg) {
    let val = String(value || '').trim();
    if (val.startsWith('.')) {

function getLastSalePrice(productId,type){
  const sales=Store.get('sales').filter(s=>s.productId===productId && s.type===type && Number(s.price)>0);
  if(!sales.length)return null;
  sales.sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date)));
  const last=sales[0];
  if(last.weight && last.weight>0) return Number(last.price||0);
  return Number(last.price||0);
}
function getActiveOfferForProduct(productId){
  const offers=Store.get('offers')||[];
  const now=today();
  const active=offers.filter(o=>{
    if(!o || o.active===false) return false;
    if(o.startDate && o.startDate>now) return false;
    if(o.endDate && o.endDate<now) return false;
    return !o.productId || String(o.productId)===String(productId);
  });
  // العرض الخاص بالصنف له الأولوية على العرض العام
  return active.sort((a,b)=>{
    const as=a.productId?1:0, bs=b.productId?1:0;
    return bs-as;
  })[0]||null;
}
function getOfferDiscountForProduct(productId,basePrice){
  const offer=getActiveOfferForProduct(productId);
  if(!offer) return {offer:null,discount:0,price:Number(basePrice)||0,percent:0};
  const discount=Math.min(Math.max(0,Number(offer.discountValue!=null?offer.discountValue:offer.discount)||0),Math.max(0,Number(basePrice)||0));
  const price=Math.max(0,(Number(basePrice)||0)-discount);
  const percent=(Number(basePrice)>0)?(discount/Number(basePrice))*100:0;
  return {offer,discount,price,percent};
}
function roundPOSMoney(value){
  const n=Number(value)||0;
  return Math.round((n+Number.EPSILON)*100)/100;
}
function getPOSItemUnitPrice(item,p,type){
  if(item.service)return Number(item.price||0);
  if(item.priceOverride!==null && item.priceOverride!==undefined && Number(item.priceOverride)>=0){
    return Number(item.priceOverride);
  }
  const base=Number(type === 'wholesale' ? (p.wholesale || 0) : (p.retail || 0));
  const result=getOfferDiscountForProduct(p.id,base);
  return result.price;
}

function setPOSCartSaleMode(index,mode){

function updatePOSCartValue(index,value){

  const amount=roundPOSMoney(Math.max(0,Number(value)||0));
  const p=(window.saleProducts||[]).find(x=>String(x.id)===String(item.id));
  const type=document.getElementById('posSaleType')?.value||'retail';
  const price=p?getPOSItemUnitPrice(item,p,type):0;
  item.saleMode='value'; item.valueAmount=amount;
  item.weight=price>0?amount/price:0;
  renderPOSCart();
}

        <div class="pos-cart-price-cell"><small>السعر</small><strong>${fmt(Number(item.price||0))}</strong><span>ج.م</span></div>
        <div class="pos-cart-total-cell"><small>الإجمالي</small><strong>${fmt(Number(item.price||0)*Number(item.qty||0))}</strong><span>ج.م</span></div>
      </div>`;
    }
    const p=products.find(x=>String(x.id)===String(item.id)); if(!p) return '';
    const weight=Number(item.weight||1);
    const price=getPOSItemUnitPrice(item,p,type);
    const lastPrice=getLastSalePrice(p.id,type);
    const img=p.image?`<img src="${p.image}" alt="${p.name}">`:`<div class="pos-cart-noimg">🧀</div>`;
    const out=(p.qty||0)<=0;
    const isWeight=isKgProduct(p);
    const total=isWeight&&item.saleMode==='value' ? roundPOSMoney(Number(item.valueAmount||0)*Number(item.qty||1)) : roundPOSMoney(price*(item.qty||1)*(isWeight?weight:1));
    const basePrice=Number(type === 'wholesale' ? (p.wholesale || 0) : (p.retail || 0));
    const offerInfo=getOfferDiscountForProduct(p.id,basePrice);
    const offerHtml=offerInfo.offer && offerInfo.discount>0 ? `<div class="pos-cart-offer">🏷️ ${offerInfo.offer.name}: خصم ${fmt(offerInfo.discount)} ج (${offerInfo.percent.toFixed(2)}%)</div>` : '';
    const lastHtml=(lastPrice!=null && lastPrice!==price)?`<div class="pos-cart-last"><i class="fas fa-history"></i> آخر سعر: ${fmt(lastPrice)} ج.م</div>`:'';
    const weightControl=isWeight?`
      <div class="pos-sale-mode">
        <button type="button" class="${item.saleMode!=='value'?'active':''}" onclick="setPOSCartSaleMode(${index},'weight')">⚖️ بالوزن</button>

          <span>ج.م</span>
        </div>
        <div class="pos-value-hint">الوزن المحسوب: ${Number(item.weight||0).toFixed(4)} كجم</div>
      `:`
        <div class="pos-weight-control"><input id="weightInput_${index}" type="number" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" min="0" step="0.001" value="${item.weight ? item.weight : '.250'}" placeholder="0.250" oninput="handleLiveWeightInput(${index}, this.value, ${price})" onkeydown="return ['e','E','+','-'].includes(event.key) ? false : true"><span>كجم</span></div>

function setPOSPaidToTotal(){
  const input=document.getElementById('posPaid');
  if(!input)return;
  const type=document.getElementById('posSaleType')?.value||'retail';
  const products=window.saleProducts||[];
  const cart=window.posCart||[];
  const subtotal=cart.reduce((sum,item)=>{
    if(item.service)return sum+Number(item.price||0)*Number(item.qty||0);
    const prod=products.find(x=>String(x.id)===String(item.id));
    if(!prod)return sum;
    return sum+getPOSItemUnitPrice(item,prod,type)*Number(item.weight||1)*Number(item.qty||0);
  },0);
  const discount=Math.min(Math.max(0,Number(document.getElementById('posDiscount')?.value||0)),subtotal);
  const taxRate=Math.min(100,Math.max(0,Number(document.getElementById('posTaxRate')?.value||0)));
  const taxable=Math.max(0,subtotal-discount);
  const tax=roundPOSMoney(taxable*taxRate/100);
  input.value=roundPOSMoney(taxable+tax).toFixed(2);
  updatePOSSummary();
}
function updatePOSSummary(){
  const type=document.getElementById('posSaleType')?.value||'retail';
  const products=window.saleProducts||[];
  const cart=window.posCart||[];
  const subtotal=roundPOSMoney(cart.reduce((sum,item)=>{
    if(item.service)return sum+Number(item.price||0)*Number(item.qty||0);
    const p=products.find(x=>String(x.id)===String(item.id)); if(!p)return sum;
    const price=getPOSItemUnitPrice(item,p,type);
    const weight=Number(item.weight||1), qty=Number(item.qty||0);
    return sum+(price*weight*qty);
  },0));
  const discount=roundPOSMoney(Math.min(Math.max(0,Number(document.getElementById('posDiscount')?.value||0)),subtotal));
  const taxable=Math.max(0,subtotal-discount);
  const taxRate=Math.min(100,Math.max(0,Number(document.getElementById('posTaxRate')?.value||0)));
  const tax=roundPOSMoney(taxable*taxRate/100);
  const total=roundPOSMoney(taxable+tax);
  const paid=roundPOSMoney(Math.max(0,Number(document.getElementById('posPaid')?.value)||0));
  const method=document.getElementById('posPaymentMethod')?.value||'cash';
  const change=roundPOSMoney(Math.max(0,paid-total));
  const remaining=roundPOSMoney(Math.max(0,total-paid));
  const el=id=>document.getElementById(id);
  if(el('posSubtotal'))el('posSubtotal').textContent=fmt(subtotal);
  if(el('posDiscountDisplay'))el('posDiscountDisplay').textContent=fmt(discount);
  if(el('posGrandTotal'))el('posGrandTotal').textContent=fmt(total);
  if(el('posLiveTotal'))el('posLiveTotal').textContent=fmt(total);
  if(el('posLivePaid'))el('posLivePaid').textContent=fmt(paid);
  if(el('posLiveRemaining'))el('posLiveRemaining').textContent=fmt(remaining);
  if(el('posTaxDisplay'))el('posTaxDisplay').textContent=fmt(tax);
  if(el('posTaxRateDisplay'))el('posTaxRateDisplay').textContent=taxRate.toFixed(2)+'%';
  if(el('posChange'))el('posChange').textContent=method==='credit'?`آجل: ${fmt(remaining)}`:fmt(change);
  if(el('posChangeLabel'))el('posChangeLabel').textContent=method==='credit'?'المتبقي':'الباقي';
  const cb=el('posChangeBox'); if(cb){cb.classList.toggle('remaining',method==='credit'&&remaining>0);cb.classList.toggle('positive',method==='cash'&&change>0);}
  if(el('posCartCount'))el('posCartCount').textContent=`${cart.reduce((n,x)=>n+Number(x.qty||0),0)} صنف`;
  if(el('posCartCountNumber'))el('posCartCountNumber').textContent=cart.reduce((n,x)=>n+Number(x.qty||0),0);
  if(el('posCartItemsBadge'))el('posCartItemsBadge').textContent=cart.length;
  if(el('posCheckoutBtn')){
    el('posCheckoutBtn').disabled=!cart.length||total<=0||(method!=='credit'&&paid<total);
    if(el('posCheckoutAmount'))el('posCheckoutAmount').textContent=fmt(total);
  }
  updatePOSCustomerPill(); updatePOSHeldCount();
}

function getNextInvoiceSequence(){
  // ترقيم أي فواتير قديمة بلا رقم قبل إنشاء الفاتورة الجديدة.
  try{ if(typeof ensureLegacyInvoiceSequences==='function') ensureLegacyInvoiceSequences(); }catch(e){}
  const sales=Store.get('sales')||[];
  let maxSeq=0;
  const seenBatches=new Set();
  sales.forEach(s=>{
    const batch=s.saleBatchId||('sale:'+s.id);
    if(seenBatches.has(batch)) return;
    seenBatches.add(batch);
    const n=Number(s.invoiceSeq||0);
    if(Number.isFinite(n)&&n>maxSeq) maxSeq=n;
  });
  // الفواتير القديمة التي لا تحمل رقمًا تسلسليًا تُحسب كفواتير سابقة.
  if(maxSeq===0) maxSeq=seenBatches.size;
  return maxSeq+1;
}

}
// ===== التوقيت الموحد لبرنامج «متجري» — توقيت مصر =====
function cairoDateTimeParts(date=new Date()){
  const parts=new Intl.DateTimeFormat('en-CA',{
    timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'
  }).formatToParts(date).reduce((o,p)=>(o[p.type]=p.value,o),{});
  return parts;
}
function cairoDateISO(date=new Date()){
  const p=cairoDateTimeParts(date);
  return `${p.year}-${p.month}-${p.day}`;
}
function cairoDateTimeISO(date=new Date()){
  const p=cairoDateTimeParts(date);
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}`;
}
function cairoTimeFromStored(value){
  if(!value)return '';
  const s=String(value);
  // السجلات القديمة التي خزنت ISO UTC مثل 2026-08-26T22:43:00.000Z
  // يتم تحويلها الآن تلقائيًا إلى توقيت القاهرة عند العرض.
  if(/Z$|[+-]\d{2}:?\d{2}$/.test(s)){
    const d=new Date(s);
    if(!Number.isNaN(d.getTime())) return new Intl.DateTimeFormat('ar-EG',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Africa/Cairo'}).format(d);
  }
  const m=s.match(/T(\d{2}:\d{2})/);
  return m?m[1]:s.slice(11,16);
}
function currentTimeLabel(){
  return new Intl.DateTimeFormat('ar-EG',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Africa/Cairo'}).format(new Date());
}

function checkoutPOS(){
  const cart=window.posCart||[]; if(!cart.length)return showToast('السلة فارغة','warning');
  const type=document.getElementById('posSaleType')?.value||'retail';
  const method=document.getElementById('posPaymentMethod')?.value||'cash';
  const discount=Math.max(0,Number(document.getElementById('posDiscount')?.value||0));
  const taxRate=Math.min(100,Math.max(0,Number(document.getElementById('posTaxRate')?.value||0)));
  const note=document.getElementById('posSaleNote')?.value?.trim()||'';
  const invoiceDate=document.getElementById('posInvoiceDate')?.value||today();
  const customerId=document.getElementById('posCustomer')?.value||'';
  const customName=document.getElementById('posCustomCustomer')?.value?.trim()||'';
  const customerName=customerId?(Store.get('customers').find(c=>c.id===customerId)?.name||''):(customName||'عميل عادي');
  const products=window.saleProducts||[];
  const invoiceSeq=getNextInvoiceSequence();
  const invoiceNo='INV-'+String(invoiceSeq);
  const saleBatchId='SALE-'+safeUUID();
  const saleTime=currentTimeLabel();
  const subtotal=roundPOSMoney(cart.reduce((sum,item)=>{
    if(item.service)return sum+Number(item.price||0)*Number(item.qty||0);
    const p=products.find(x=>String(x.id)===String(item.id)); if(!p)return sum;
    return sum+getPOSItemUnitPrice(item,p,type)*Number(item.weight||1)*Number(item.qty||0);
  },0));
  const safeDiscount=roundPOSMoney(Math.min(Math.max(0,discount),subtotal));
  const taxable=Math.max(0,subtotal-safeDiscount);
  const tax=roundPOSMoney(taxable*taxRate/100);
  const total=roundPOSMoney(taxable+tax);
  const paid=roundPOSMoney(Math.max(0,Number(document.getElementById('posPaid')?.value)||0));
  if(paid-total>0.005)return showToast('المبلغ المدفوع لا يمكن أن يتجاوز إجمالي الفاتورة','warning');
  const remaining=roundPOSMoney(Math.max(0,total-paid));
  const hasNamedCustomer=Boolean(customerId||customName);
  if(method==='credit'&&remaining>0&&!hasNamedCustomer)return showToast('حدد العميل أو اكتب اسمه لتسجيل المبلغ المتبقي كآجل','warning');
  if(method!=='credit'&&paid<total)return showToast('المبلغ المدفوع أقل من إجمالي الفاتورة','warning');

  // تحقق كامل قبل أي تعديل على المخزون أو حفظ الفاتورة.
  for(const item of cart){
    if(item.service) continue;
    const p=products.find(x=>String(x.id)===String(item.id));
    if(!p) return showToast('الصنف غير موجود أو تم حذفه','error');
    const weight=Number(item.weight||1), packs=Number(item.qty||0);
    if(!Number.isFinite(weight)||weight<=0||!Number.isFinite(packs)||packs<=0) return showToast('كمية أو وزن غير صالح','warning');
    const required=money(weight*packs), available=Number(p.qty||0);
    if(required>available+0.000001) return showToast(`المخزون غير كافٍ للصنف: ${p.name} — المتاح ${formatProductQty(p,available)}`,'warning');
  }

  const transactionKeys=['products','sales','debts','customers','auditLog'];
  const transactionSnapshot={};
  transactionKeys.forEach(k=>{transactionSnapshot[k]=localStorage.getItem('bm_'+k);});
  try{
  cart.forEach(item=>{
    if(item.service){
      const serviceTotal=Number(item.price||0)*Number(item.qty||0);
      const ratio=subtotal?serviceTotal/subtotal:0;
      const itemDiscount=safeDiscount*ratio;
      const itemTax=tax*ratio;
      const itemTotal=Math.max(0,serviceTotal-itemDiscount+itemTax);
      Store.add('sales',{saleBatchId,invoiceNo,invoiceSeq,date:invoiceDate,time:saleTime,productId:null,productName:item.name,customerId:customerId||null,customerName,type,qty:item.qty,packages:item.qty,weight:1,unitPrice:Number(item.price||0),price:Number(item.price||0),cost:0,discount:serviceTotal?((itemDiscount/serviceTotal)*100):0,discountAmount:itemDiscount,taxRate,taxAmount:itemTax,discountedPrice:Number(item.price||0),total:itemTotal,profit:itemTotal,paymentMethod:method,paid,remaining,initialPaid:money(paid),collectionHistory:[],isWeightSale:false,sellUnit:String(item.unit||'خدمة'),note:note||'خدمة من الكاشير'});
      return;
    }
    const p=products.find(x=>String(x.id)===String(item.id)); if(!p)return;
    const weight=Number(item.weight||1), packs=Number(item.qty||0), price=getPOSItemUnitPrice(item,p,type);
    const qtyKg=weight*packs, costKg=Number(p.purchase||0), gross=price*weight*packs;
    const ratio=subtotal?gross/subtotal:0;
    const itemDiscount=safeDiscount*ratio, itemTax=tax*ratio;
    const itemTotal=Math.max(0,gross-itemDiscount+itemTax);
    const effectivePackPrice=packs?itemTotal/packs:0;
    const profit=(effectivePackPrice-(costKg*weight))*packs;
    const newQty=Math.max(0,Number(p.qty||0)-qtyKg);
    Store.update('products',p.id,{qty:newQty});
    Store.add('sales',{saleBatchId,invoiceNo,invoiceSeq,date:invoiceDate,time:saleTime,productId:p.id,productName:p.name,customerId:customerId||null,customerName,type,qty:qtyKg,packages:packs,weight,unitPrice:price,price:effectivePackPrice,cost:costKg*weight,discount:price?((itemDiscount/gross)*100):0,discountAmount:itemDiscount,taxRate,taxAmount:itemTax,discountedPrice:effectivePackPrice,total:itemTotal,profit,paymentMethod:method,paid,remaining,initialPaid:money(paid),collectionHistory:[],isWeightSale:isKgProduct(p),sellUnit:isKgProduct(p)?'كجم':String(p.unit||'علبة'),note:note||`بيع من الكاشير — ${saleQuantityLabel(p,packs,weight)}${method==='credit'?' — آجل':''}`});
  });
  if(customerId){const customers=Store.get('customers');const i=customers.findIndex(c=>c.id===customerId);if(i>=0){customers[i].points=(customers[i].points||0)+Math.floor(total/10);customers[i].totalSpent=(customers[i].totalSpent||0)+total;Store.set('customers',customers);}}
  if(method==='credit'&&remaining>0){Store.add('debts',{saleBatchId,invoiceNo,sourceSaleId:null,customerId:customerId||null,date:invoiceDate,person:customerName,type:'لنا',amount:remaining,paidAmount:0,paymentHistory:[],debtVersion:2,due:document.getElementById('posDueDate')?.value||'',note:`آجل من الفاتورة ${invoiceNo}${customerId?' — عميل مسجل':''}`,paid:false,source:'sale',saleTotal:total});}
  // اكتملت تغييرات البيانات داخل العملية المحمية.
  const invoice={invoiceNo,invoiceSeq,saleBatchId,date:invoiceDate,time:saleTime,customerName,type,method,subtotal,discount:safeDiscount,taxRate,tax, total,paid,remaining,change:method==='cash'?roundPOSMoney(paid-total):0,note};
  localStorage.setItem('bm_lastPOSInvoice',JSON.stringify(invoice));
  const invChip=document.getElementById('posInvoiceNo'); if(invChip)invChip.textContent=String(invoiceSeq);
  showToast(method==='credit'?`📋 تم حفظ الفاتورة ${invoiceNo} — المتبقي ${fmt(remaining)}`:`✅ تم حفظ الفاتورة ${invoiceNo} — الباقي ${fmt(invoice.change)}`,'success');
  window.posCart=[];
  renderSalesPage(document.getElementById('contentArea'));
  setTimeout(()=>openPOSReceiptPreview(invoice),120);
  }catch(error){
    transactionKeys.forEach(k=>{try{
      const key='bm_'+k;
      const raw=transactionSnapshot[k];
      if(raw===null)localStorage.removeItem(key);else localStorage.setItem(key,raw);
    }catch(e){}});
    console.error('فشل حفظ الفاتورة وتم التراجع عن العملية:',error);
    showToast('❌ تعذر حفظ الفاتورة — تم التراجع عن العملية بالكامل','error');
  }
}

      <div class="sp-pack-price">${kg?`500 جم ${fmt(Number(p.retail||0)*.5)} · 250 جم ${fmt(Number(p.retail||0)*.25)}`:'اضغط للإضافة'}</div>

function updateSalePrice(){
  const select=document.getElementById('sProduct');
  const selectedId=select?.value||'';
  const option=select?.options[select.selectedIndex];
  if(!selectedId || !option){
    const priceEl=document.getElementById('sPrice');
    const costEl=document.getElementById('sCost');
    const profitEl=document.getElementById('sProfit');
    if(priceEl) priceEl.value='';
    if(costEl) costEl.value='';
    if(profitEl) profitEl.value='';
    updateSaleSelectedPreview();
    const grid=document.getElementById('saleProductGrid');
    if(grid) renderSaleProductGrid();
    return;
  }
  const type=document.getElementById('sType').value;
  const price=type==='wholesale'?parseFloat(option.dataset.wholesale):parseFloat(option.dataset.retail);
  document.getElementById('sPrice').value=price||'';
  const cost=parseFloat(option.dataset.purchase)||0;
  document.getElementById('sCost').value=cost||'';
  calcSaleProfit();
  updateSaleSelectedPreview();
  const grid=document.getElementById('saleProductGrid');
  if(grid)renderSaleProductGrid();
}
function calcSaleProfit(){
  const price=parseFloat(document.getElementById('sPrice').value)||0;
  const cost=parseFloat(document.getElementById('sCost').value)||0;
  const qty=parseFloat(document.getElementById('sQty').value)||0;
  const discountPct=parseFloat(document.getElementById('sDiscount').value)||0;
  const discountedPrice=price*(1-discountPct/100);
  const profit=(discountedPrice-cost)*qty;
  const profitEl=document.getElementById('sProfit');
  profitEl.value=profit.toFixed(2);
  profitEl.style.color=profit>=0?'var(--success-light)':'var(--danger-light)';
}

      <div class="form-group"><label>الكمية</label><input type="number" id="esQty" value="${sale.qty}" step="0.01"></div>
      <div class="form-group"><label>سعر البيع</label><input type="number" id="esPrice" value="${sale.price}" step="0.01"></div>
