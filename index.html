function savePurchaseEdit(id){
  const purchases=Store.get('purchases');
  const original=purchases.find(p=>p.id===id);
  if(!original)return;

  const pid=document.getElementById('epurProduct').value;
  const qty=parseFloat(document.getElementById('epurQty').value)||0;
  const price=parseFloat(document.getElementById('epurPrice').value)||0;
  const total=qty*price;
  let paid=parseFloat(document.getElementById('epurPaid')?.value)||0;
  if(paid<0)paid=0;
  if(paid>total)return showToast('المبلغ المدفوع أكبر من إجمالي الشراء','warning');
  const remaining=Math.max(0,total-paid);

  if(!pid||qty<=0||price<=0)return showToast('أكمل البيانات','warning');

  const product=Store.get('products').find(p=>p.id===pid);
  if(!product)return;

  if(original.productId){
    const origProduct=Store.get('products').find(p=>p.id===original.productId);
    if(origProduct){
      const restoredQty=(origProduct.qty||0)-original.qty;
      Store.update('products',original.productId,{qty:Math.max(0,restoredQty)});
    }
  }

  const currentProduct=Store.get('products').find(p=>p.id===pid);
  const oldQty=currentProduct.qty||0;
  const oldPurchasePrice=currentProduct.purchase||0;
  const totalNewQty=oldQty+qty;
  const netUnitPrice=qty>0?total/qty:price;
  const avgPurchasePrice=totalNewQty>0?((oldQty*oldPurchasePrice)+(qty*netUnitPrice))/totalNewQty:netUnitPrice;

  Store.update('products',pid,{qty:totalNewQty,purchase:avgPurchasePrice});

  const supplierId=document.getElementById('epurSupplier').value;
  const supplierName=supplierId?(Store.get('suppliers').find(s=>s.id===supplierId)?.name||''):'';
  const purchaseBatchId=original.purchaseBatchId||('PUR-'+Date.now()+'-'+Math.random().toString(36).slice(2,8));

  Store.update('purchases',id,{
    date:document.getElementById('epurDate').value||today(),
    productId:pid,
    productName:product.name,
    qty,
    price,
    total,
    paid,
    remaining,
    paymentMethod:remaining>0?'credit':'cash',
    purchaseBatchId:original.purchaseBatchId||('PUR-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)),
    supplierId:supplierId||null,
    supplierName:supplierName,
    note:document.getElementById('epurNote').value
  });

  // إعادة ضبط دين المورد المرتبط بهذه الفاتورة
  const batchId=original.purchaseBatchId;
  if(batchId){
    Store.get('debts').filter(d=>d.purchaseBatchId===batchId).forEach(d=>Store.delete('debts',d.id));
  }
  if(remaining>0){
    Store.add('debts',{purchaseBatchId:original.purchaseBatchId||purchaseBatchId,date:document.getElementById('epurDate').value||today(),person:supplierName||'بائع/مورد',type:'علينا',amount:remaining,due:'',note:`آجل من شراء ${product.name}`,paid:false,source:'purchase',purchaseTotal:total,paidAmount:paid});
  }

  closeModal();showToast('✅ تم التعديل');renderPurchasesPage(document.getElementById('contentArea'));
}

function deletePurchase(id){
  if(!confirm('حذف عملية الشراء؟ سيتم خصم الكمية من المخزون.'))return;

  const purchases=Store.get('purchases');
  const purchase=purchases.find(p=>p.id===id);
  if(!purchase){showToast('❌ العملية غير موجودة','error');return;}

  const products=Store.get('products');
  const product=products.find(p=>p.id===purchase.productId);
  if(!product){Store.delete('purchases',id);showToast('🗑️ تم الحذف');renderPurchasesTable();return;}

  const newQty=(product.qty||0)-(purchase.qty||0);

  if(newQty<0){
    if(!confirm('⚠️ الكمية في المخزون أقل من الكمية المشتراة! سيتم جعل الكمية صفر. متأكد؟'))return;
  }

  Store.update('products',purchase.productId,{qty:Math.max(0,newQty)});

  const batchId=purchase.purchaseBatchId;
  if(batchId){Store.get('debts').filter(d=>d.purchaseBatchId===batchId).forEach(d=>Store.delete('debts',d.id));}
  Store.delete('purchases',id);

  showToast('🗑️ تم الحذف وتحديث المخزون');
  renderPurchasesTable();
}

function renderOffersPage(container){

        <div class="form-group"><label>السعر بعد الخصم</label><input type="text" id="oOfferPrice" value="-" readonly></div>
        <div class="form-group"><label>تاريخ البداية</label><input type="date" id="oStart" value="${today()}"></div>

      </div>

      <button class="btn btn-primary btn-block" onclick="addOffer()"><i class="fas fa-save"></i> حفظ العرض</button>
    </div>
    <div class="card"><div class="card-title"><i class="fas fa-tags"></i> العروض النشطة</div><div id="offersList"></div></div>
  </div>`;
  const productSelect=document.getElementById('oProduct');
  productSelect?.addEventListener('change',()=>{
    const p=products.find(x=>String(x.id)===String(productSelect.value));
    const base=document.getElementById('oBasePrice');
    if(base && p) base.value=Number(p.retail||0);
    updateOfferPreview();
  });
  renderOffersList();
}
function updateOfferPreview(){
  const discount=Math.max(0,Number(document.getElementById('oDiscount')?.value||0));
  const productId=document.getElementById('oProduct')?.value||'';
  const products=Store.get('products')||[];
  const p=products.find(x=>String(x.id)===String(productId));
  const baseEl=document.getElementById('oBasePrice');
  const base=Number(baseEl?.value|| (p?.retail||0));
  if(baseEl && p && !baseEl.value) baseEl.value=Number(p.retail||0);
  const pct=base>0?Math.min(100,(discount/base)*100):0;
  const final=Math.max(0,base-discount);
  const pe=document.getElementById('oDiscountPercent'); if(pe)pe.value=`${pct.toFixed(2)}%`;
  const fe=document.getElementById('oOfferPrice'); if(fe)fe.value=base>0?fmt(final):'-';
  const box=document.getElementById('offerPreviewBox');
  if(box) box.innerHTML=base>0 && discount>0 ? `🏷️ خصم <strong>${fmt(discount)}</strong> = <strong>${pct.toFixed(2)}%</strong> من ${fmt(base)} → السعر بعد الخصم <strong>${fmt(final)}</strong>` : 'أدخل قيمة الخصم واختر الصنف لعرض النسبة والسعر بعد الخصم.';
}
function addOffer(){
  const name=document.getElementById('oName').value.trim();
  const discount=Math.max(0,Number(document.getElementById('oDiscount').value||0));
  const productId=document.getElementById('oProduct').value||null;
  if(!name||discount<=0)return showToast('أكمل اسم العرض وقيمة الخصم','warning');
  Store.add('offers',{name,productId,discountValue:discount,discount:discount,startDate:document.getElementById('oStart').value||today(),endDate:document.getElementById('oEnd').value||null,note:document.getElementById('oNote').value,active:true});
  showToast('✅ تم إضافة العرض وتفعيله في المبيعات');
  renderOffersPage(document.getElementById('contentArea'));
}
function renderOffersList(){
  const offers=Store.get('offers')||[];
  const products=Store.get('products')||[];
  const now=today();
  document.getElementById('offersList').innerHTML=offers.map(o=>{
    const isActive=o.active!==false&&(!o.startDate||o.startDate<=now)&&(!o.endDate||o.endDate>=now);
    const productName=o.productId?(products.find(p=>String(p.id)===String(o.productId))?.name||'الصنف غير موجود'):'كل الأصناف';
    const base=o.productId?(Number(products.find(p=>String(p.id)===String(o.productId))?.retail||0)):0;
    const d=Math.max(0,Number(o.discountValue!=null?o.discountValue:o.discount)||0);
    const pct=base>0?Math.min(100,d/base*100):null;
    const final=base>0?Math.max(0,base-d):null;
    return `<div class="offer-card ${isActive?'active':''}">
      <div class="offer-title">${o.name} ${isActive?'<span style="color:var(--success)">● نشط</span>':'<span style="color:var(--text-muted)">● غير نشط/منتهي</span>'}</div>
      <div class="offer-details">📦 ${productName} | 📅 ${o.startDate||'-'} ${o.endDate?' إلى '+o.endDate:''}</div>
      <div class="offer-discount">خصم ${fmt(d)}${pct!==null?` · ${pct.toFixed(2)}%`:''}</div>
      ${base>0?`<div class="offer-details">💰 ${fmt(base)} → ${fmt(final)}</div>`:''}
      <div style="margin-top:10px;display:flex;gap:6px">
        <button class="btn btn-sm ${o.active?'btn-danger':'btn-success'}" onclick="toggleOffer('${o.id}',${o.active!==false})">${o.active?'إيقاف':'تفعيل'}</button>
        <button class="btn btn-sm btn-danger" onclick="deleteOffer('${o.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>`;
  }).join('')||'<div class="empty-state"><i class="fas fa-tags"></i><p>لا يوجد عروض</p></div>';
}
function toggleOffer(id,currentActive){Store.update('offers',id,{active:!currentActive});showToast(!currentActive?'✅ تم التفعيل وتطبيق العرض في المبيعات':'⏹️ تم إيقاف العرض');renderOffersList();}
function deleteOffer(id){if(!confirm('حذف العرض؟'))return;Store.delete('offers',id);showToast('🗑️ تم الحذف');renderOffersList();}

function loadSummary(){
  const month=document.getElementById('summaryMonth')?.value||today().slice(0,7);
  const sales=Store.get('sales');
  const purchases=Store.get('purchases');
  const expenses=Store.get('expenses');
  const withdrawals=Store.get('withdrawals');
  const debts=Store.get('debts');
  const products=Store.get('products');
  const customers=Store.get('customers');

  const inMonth=d=>d.startsWith(month);

  const mSales=sales.filter(s=>inMonth(s.date));
  const mPurchases=purchases.filter(p=>inMonth(p.date));
  const mExpenses=expenses.filter(e=>inMonth(e.date));
  const mWithdrawals=withdrawals.filter(w=>inMonth(w.date));

  const totalSales=mSales.reduce((sum,s)=>sum+(s.total||0),0);
  const totalProfit=mSales.reduce((sum,s)=>sum+(s.profit||0),0);
  const totalPurchases=mPurchases.reduce((sum,p)=>sum+(p.total||0),0);
  const totalExpenses=mExpenses.reduce((sum,e)=>sum+(e.amount||0),0);
  const totalWithdrawals=mWithdrawals.reduce((sum,w)=>sum+(w.amount||0),0);
  const totalDiscounts=mSales.reduce((sum,s)=>sum+((s.price*s.qty)-(s.total||0)),0);

  const debtsOnUs=debts.filter(d=>d.type==='علينا'&&!d.paid).reduce((sum,d)=>sum+(d.amount||0),0);
  const debtsForUs=debts.filter(d=>d.type==='لنا'&&!d.paid).reduce((sum,d)=>sum+(d.amount||0),0);
  const netDebts=debtsForUs-debtsOnUs;

  const inventoryValue=products.reduce((sum,p)=>sum+((p.qty||0)*(p.purchase||0)),0);

  const initialCapital=currentUser?.capital||0;
  const capital=initialCapital>0?initialCapital:totalPurchases+inventoryValue;

  const netProfit=totalProfit-totalExpenses;

  document.getElementById('sumCapital').textContent=fmt(capital);
  document.getElementById('sumInventory').textContent=fmt(inventoryValue);
  document.getElementById('sumSales').textContent=fmt(totalSales);
  document.getElementById('sumPurchases').textContent=fmt(totalPurchases);
  document.getElementById('sumExpenses').textContent=fmt(totalExpenses);
  document.getElementById('sumWithdrawals').textContent=fmt(totalWithdrawals);
  
  document.getElementById('sumDebts').textContent=fmt(netDebts);
  document.getElementById('sumDebts').style.color=netDebts>=0?'var(--success-light)':'var(--danger-light)';
  
  document.getElementById('sumTotalProfit').textContent=fmt(totalProfit);
  document.getElementById('sumTotalProfit').style.color=totalProfit>=0?'var(--success-light)':'var(--danger-light)';
  
  document.getElementById('sumNetProfit').textContent=fmt(netProfit);
  document.getElementById('sumNetProfit').style.color=netProfit>=0?'#fbbf24':'#f87171';

  document.getElementById('sumSaleCount').textContent=mSales.length;
  document.getElementById('sumAvgSale').textContent=fmt(mSales.length?totalSales/mSales.length:0);
  document.getElementById('sumProfitPercent').textContent=totalSales>0?((totalProfit/totalSales)*100).toFixed(1)+'%':'0%';
  document.getElementById('sumTotalDiscounts').textContent=fmt(totalDiscounts);

  const ps={};
  mSales.forEach(s=>{ps[s.productName]=(ps[s.productName]||0)+(s.total||0)});
  const top=Object.entries(ps).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('sumTopProduct').textContent=top?top[0]:'-';

  const cs={};
  mSales.filter(s=>s.customerName).forEach(s=>{cs[s.customerName]=(cs[s.customerName]||0)+(s.total||0)});
  const topC=Object.entries(cs).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('sumTopCustomer').textContent=topC?topC[0]+' ('+fmt(topC[1])+')':'-';
}

function renderReportsPage(container){
  if (typeof Chart === 'undefined') { console.warn('Chart.js غير متاح بدون إنترنت'); return; }

  container.innerHTML=`<div class="fade-in">
    <div class="card"><div class="card-title"><i class="fas fa-chart-line"></i> تحليل المبيعات الشهرية</div><div class="chart-container"><canvas id="salesChart"></canvas></div></div>
    <div class="card"><div class="card-title"><i class="fas fa-chart-pie"></i> توزيع المصروفات</div><div class="chart-container"><canvas id="expenseChart"></canvas></div></div>
    <div class="card"><div class="card-title"><i class="fas fa-chart-bar"></i> أفضل 5 أصناف مبيعاً</div><div class="chart-container"><canvas id="topProductsChart"></canvas></div></div>
    <div class="card"><div class="card-title"><i class="fas fa-coins"></i> الأرباح مقابل المصروفات</div><div class="chart-container"><canvas id="profitExpenseChart"></canvas></div></div>
  </div>`;

  const sales=Store.get('sales');
  const expenses=Store.get('expenses');

  const monthly={};
  sales.forEach(s=>{const m=s.date?.slice(0,7)||'unknown';monthly[m]=(monthly[m]||0)+(s.total||0)});
  new Chart(document.getElementById('salesChart'),{
    type:'line',
    data:{labels:Object.keys(monthly).sort(),datasets:[{label:'المبيعات الشهرية',data:Object.keys(monthly).sort().map(k=>monthly[k]),borderColor:'#d4a72c',backgroundColor:'rgba(212,175,55,0.1)',fill:true,tension:0.4,borderWidth:3,pointBackgroundColor:'#d4a72c',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#94a3b8'}},x:{grid:{display:false},ticks:{color:'#94a3b8'}}}}
  });

  const byType={};
  expenses.forEach(e=>{byType[e.type]=(byType[e.type]||0)+(e.amount||0)});
  new Chart(document.getElementById('expenseChart'),{
    type:'doughnut',
    data:{labels:Object.keys(byType),datasets:[{data:Object.values(byType),backgroundColor:['#d4a72c','#c99a22','#f39c12','#e74c3c','#3498db','#9b59b6','#2ecc71','#e67e22']}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',padding:15,font:{size:12}}}}}
  });

  const ps={};
  sales.forEach(s=>{ps[s.productName]=(ps[s.productName]||0)+(s.total||0)});
  const top5=Object.entries(ps).sort((a,b)=>b[1]-a[1]).slice(0,5);
  new Chart(document.getElementById('topProductsChart'),{
    type:'bar',
    data:{labels:top5.map(x=>x[0]),datasets:[{label:'المبيعات',data:top5.map(x=>x[1]),backgroundColor:['#d4a72c','#c99a22','#b8960c','#a67c00','#8b6914'],borderRadius:8}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#94a3b8'}},x:{grid:{display:false},ticks:{color:'#94a3b8'}}}}
  });

  const monthlyProfit={}, monthlyExpense={};
  sales.forEach(s=>{const m=s.date?.slice(0,7)||'unknown';monthlyProfit[m]=(monthlyProfit[m]||0)+(s.profit||0)});
  expenses.forEach(e=>{const m=e.date?.slice(0,7)||'unknown';monthlyExpense[m]=(monthlyExpense[m]||0)+(e.amount||0)});
  const allMonths=[...new Set([...Object.keys(monthlyProfit),...Object.keys(monthlyExpense)])].sort();
  new Chart(document.getElementById('profitExpenseChart'),{
    type:'bar',
    data:{labels:allMonths,datasets:[
      {label:'الأرباح',data:allMonths.map(m=>monthlyProfit[m]||0),backgroundColor:'rgba(16,185,129,0.7)',borderColor:'#10b981',borderWidth:1,borderRadius:8},
      {label:'المصروفات',data:allMonths.map(m=>monthlyExpense[m]||0),backgroundColor:'rgba(239,68,68,0.7)',borderColor:'#ef4444',borderWidth:1,borderRadius:8}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8'}}},scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#94a3b8'}},x:{grid:{display:false},ticks:{color:'#94a3b8'}}}}
  });
}

function getAppSettings(){
  try{

function saveAppSettings(data){
  localStorage.setItem('bm_settings',JSON.stringify(data||{}));
}
function toggleAppSetting(key,checked){
  const s=getAppSettings();
  s[key]=!!checked;
  saveAppSettings(s);
  showToast(checked?'✅ تم تفعيل الإعداد':'⏸️ تم إيقاف الإعداد');
}
function getDataCounts(){

async function createSettingsBackup(){
  exportData();
  const stamp=new Date().toLocaleString('ar-EG');
  localStorage.setItem('bm_last_backup',stamp);
  refreshGoogleBackupStatusUI();
  if(driveAccessTokenValid()) await backupToGoogle({silent:false});
  else showToast('✅ تم إنشاء النسخة على الجهاز. يمكنك ربط Google ورفعها للسحابة عند الحاجة.','success');
  setTimeout(()=>navigateTo('settings'),350);
}

    <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="saveProfile()"><i class="fas fa-save"></i> حفظ البيانات</button>
    <button class="btn btn-outline btn-block" style="margin-top:10px" onclick="closeModal()">إلغاء</button>
  `);
}
function saveProfile(){
  const name=document.getElementById('settingsProfileName')?.value.trim();
  const email=document.getElementById('settingsProfileEmail')?.value.trim();
  const capital=parseFloat(document.getElementById('settingsProfileCapital')?.value)||0;
  if(!name||!email){showToast('⚠️ الاسم والبريد مطلوبان','warning');return;}
  currentUser={...(currentUser||{}),name,email,capital};
  Store.setUser(currentUser);
  document.getElementById('userName').textContent=name;
  document.getElementById('userAvatar').textContent=name[0];
  closeModal();
  showToast('✅ تم تحديث بيانات المستخدم');
  navigateTo('settings');
}

// ==================== التصدير والاستيراد ====================
function exportData(){
  const data={
    products:Store.get('products'),
    sales:Store.get('sales'),
    purchases:Store.get('purchases'),
    expenses:Store.get('expenses'),
    withdrawals:Store.get('withdrawals'),
    debts:Store.get('debts'),
    customers:Store.get('customers'),
    suppliers:Store.get('suppliers'),
    offers:Store.get('offers'),
    auditLog:Store.get('auditLog'),
    userData:currentUser,
    exportedAt:new Date().toISOString()
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='mozzarella_backup_'+today()+'.json';a.click();URL.revokeObjectURL(url);
  showToast('✅ تم التصدير');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
  const data=JSON.parse(e.target.result);
    if(!isUsableBackup(data)){
      showToast('🛡️ ملف النسخة الاحتياطية فارغ أو غير صالح، ولم يتم تغيير أي بيانات','error');
      return;
    }
    if(!confirm('تم العثور على نسخة صالحة.\n'+backupSummary(data)+'\n\nسيتم استبدال البيانات الحالية. هل تريد المتابعة؟'))return;
    ['products','sales','purchases','expenses','withdrawals','debts','customers','suppliers','offers','auditLog'].forEach(k=>Store.set(k,Array.isArray(data[k])?data[k]:[]));
    if(data.userData)Store.setUser(data.userData);
    const stamp=new Date().toLocaleString('ar-EG');
    localStorage.setItem('bm_last_backup',stamp);
    refreshGoogleBackupStatusUI();
    showToast('✅ تمت استعادة النسخة من الجهاز بنجاح');navigateTo('dashboard');
  };
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm('⚠️ سيتم حذف جميع البيانات! متأكد؟'))return;
  if(!confirm('تأكيد نهائي: مسح كل البيانات؟'))return;
  Store.clear();showToast('🗑️ تم المسح');navigateTo('dashboard');
}
function renderProductsGrid() {
  const products = Store.get('products') || [];
  if (products.length === 0) {
    return `<div style="text-align:center; padding:20px; color:var(--text-light)">لا توجد منتجات مسجلة</div>`;
  }
  let html = '<div class="products-grid">';
  products.forEach(product => {
    html += `
      <div class="pos-product-card" onclick="addToCart('${product.id}')">
        <div class="icon"><i class="fas fa-box"></i></div>
        <div class="name">${product.name}</div>
        <div class="price">${fmt(product.price)}</div>
      </div>
    `;
  });
  html += '</div>';
  return html;
}

// ==================== الأدوات المساعدة ====================
function openModal(content){
  document.getElementById('modalContent').innerHTML=content;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
}
function showToast(message,type='success'){
  const container=document.getElementById('toastContainer');
  const toast=document.createElement('div');
  toast.className='toast '+type;
  const icons={success:'check-circle',error:'exclamation-circle',warning:'exclamation-triangle'};
  toast.innerHTML=`<i class="fas fa-${icons[type]||'check-circle'}"></i> ${message}`;
  container.appendChild(toast);
  setTimeout(()=>{toast.style.animation='toastOut 0.3s ease';setTimeout(()=>toast.remove(),300)},3000);
}
function fmt(n){
  return Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
}
function today(){
  return new Date().toISOString().split('T')[0];
}
window.addEventListener('DOMContentLoaded', () => {
  applyAppIdentity();
  const user = Store.getUser();
  if (user && !isLockEnabled()) {
    currentUser = user;
    showApp();
  } else {
    showAuthScreen();
  }
  // Google Identity Services تعمل داخل الصفحة ولا تحتاج Firebase Auth أو Redirect URI.
  setTimeout(()=>{
    if(isGoogleDriveReady()) initGoogleDriveClient();
  },300);
});
async function replaceCloudDataWithLocal() {
  if(!confirm('⚠️ سيتم استبدال النسخة الموجودة على Google Drive بالبيانات الموجودة على هذا الجهاز. هل تريد المتابعة؟')) return;
  if(!driveAccessTokenValid()){
    requestGoogleDriveAccess({prompt:localStorage.getItem('bm_google_connected')?'':'consent'});
    return;
  }
  const ok=await backupToGoogle({silent:false});
  if(ok) showToast('✅ تم استبدال نسخة Google Drive بالبيانات الحالية','success');
}

<script id="sales-history-v142-js">
(function(){
  const money = v => Number(v||0);
  function allSales(){ return Array.isArray(Store.get('sales')) ? Store.get('sales') : []; }
  function lineItems(s){ return Array.isArray(s.items) ? s.items : [s]; }
  function invoiceKey(s){ return s.saleBatchId ? 'batch:'+s.saleBatchId : 'sale:'+s.id; }

  // ===== ترقيم الفواتير القديمة تلقائيًا =====
  // الفواتير القديمة التي كانت تحمل INV-YYYYMMDD-xxxxxx تُعطى أرقامًا
  // تسلسلية مرة واحدة، مع الاحتفاظ بالرقم القديم داخل invoiceNo للرجوع إليه.
  function legacyInvoiceSortKey(lines){
    const first=lines[0]||{};
    const no=String(first.invoiceNo||'');
    const m=no.match(/^INV-(\d{8})-(\d+)$/i);
    if(m) return m[1]+'-'+m[2].padStart(20,'0');
    return String(first.date||'')+' '+String(first.time||'')+' '+String(first.id||'');
  }
  function ensureLegacyInvoiceSequences(){
    const sales=allSales();
    if(!sales.length) return;
    const map=new Map();
    sales.forEach(s=>{
      const key=invoiceKey(s);
      if(!map.has(key)) map.set(key,[]);
      map.get(key).push(s);
    });
    const groups=[...map.values()];
    const used=new Set();
    groups.forEach(lines=>{
      const n=Number(lines.find(s=>Number(s.invoiceSeq)>0)?.invoiceSeq||0);
      if(Number.isFinite(n)&&n>0) used.add(n);
    });
    const missing=groups.filter(lines=>!lines.some(s=>Number(s.invoiceSeq)>0)).sort((a,b)=>legacyInvoiceSortKey(a).localeCompare(legacyInvoiceSortKey(b)));
    let next=1;
    missing.forEach(lines=>{
      while(used.has(next)) next++;
      lines.forEach(s=>Store.update('sales',s.id,{invoiceSeq:next}));
      used.add(next);
      next++;
    });
  }

  function productForSaleLine(s){
    const p=(Store.get('products')||[]).find(x=>String(x.id)===String(s.productId));
    if(p) return p;
    const name=String(s.productName||'').trim();
    if(/موزاريلا|موتزاريلا|mozzarella/i.test(name)) return {name,unit:'كجم',sellByWeight:true};
    if(/رومي|رومى|romy|كيري|kiri|قشطة|قشطه|cream/i.test(name)) return {name,unit:'علبة'};
    return {name,unit:s.sellUnit||'علبة'};
  }

  function repairLegacyWeightSalePrices(){
    const sales=allSales();
    let changed=false;
    sales.forEach(s=>{
      if(!s.isWeightSale) return;
      const p=productForSaleLine(s);
      if(!p || !isMozzarellaProduct(p)) return;
      const w=money(s.weight||1), factor=weightPriceMultiplier(p,w);
      if(factor<=0) return;
      const storedUnit=money(s.unitPrice);
      // الفواتير القديمة خزنت سعر الـ500 جم في unitPrice ثم خزنت price/total بعد ضربه في الوزن.
      // نصححها فقط عندما تكون البنية القديمة واضحة، ولا نمس الفواتير الصحيحة.
      if(storedUnit>0){
        const expectedGross=roundPOSMoney(storedUnit*factor*money(s.packages!=null?s.packages:1));
        const currentTotal=money(s.total);
        const currentPrice=money(s.price);
        const legacyMatch=Math.abs(currentTotal - storedUnit*w*money(s.packages!=null?s.packages:1))<0.011 ||
                           Math.abs(currentPrice - storedUnit*w)<0.011;
        if(legacyMatch && Math.abs(currentTotal-expectedGross)>0.011){
          const discountPct=Math.max(0,money(s.discount));
          const correctedTotal=roundPOSMoney(expectedGross*(1-discountPct/100));
          const packages=money(s.packages!=null?s.packages:1);
          const costPerKg=w>0?money(s.cost)/w:money(s.cost);
          const correctedProfit=roundPOSMoney(correctedTotal-(costPerKg*w*packages));
          Store.update('sales',s.id,{
            price:storedUnit,
            unitPrice:storedUnit,
            discountedPrice:storedUnit,
            total:correctedTotal,
            profit:correctedProfit
          });
          changed=true;
        }
      }
    });
    return changed;
  }

  function groupSales(){
    repairLegacyWeightSalePrices();
    ensureLegacyInvoiceSequences();
    const map=new Map();
    allSales().forEach(s=>{
      const key=invoiceKey(s);
      if(!map.has(key)) map.set(key,[]);
      map.get(key).push(s);
    });
    return [...map.values()].map(lines=>{
      const first=lines[0];
      const total=lines.reduce((n,s)=>n+money(s.total),0);
      const profit=lines.reduce((n,s)=>n+money(s.profit),0);
      const paid=money(first.paid);
      const remaining=Math.max(0,total-paid);
      return {key:invoiceKey(first),id:first.id,saleBatchId:first.saleBatchId||null,invoiceNo:first.invoiceNo||('INV-'+String(first.id||'').slice(-6)),invoiceSeq:first.invoiceSeq||null,date:first.date||'',time:first.time||'',customerId:first.customerId||null,customerName:first.customerName||'عميل عادي',type:first.type||'retail',paymentMethod:first.paymentMethod||'cash',note:first.note||'',total,profit,paid,remaining,lines};
    }).sort((a,b)=>String(b.date+' '+b.time).localeCompare(String(a.date+' '+a.time)));
  }
  function paymentLabel(m){return ({cash:'نقدي',credit:'آجل',transfer:'تحويل',card:'بطاقة'})[m]||m||'نقدي';}
  function paymentIcon(m){return ({cash:'fa-money-bill-wave',credit:'fa-clock',transfer:'fa-mobile-screen-button',card:'fa-credit-card'})[m]||'fa-wallet';}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function invoiceTotalText(inv){return fmt(inv.total);}
  function invoiceText(inv){
    let t=`🧾 *كنوز الطبيعة — فاتورة بيع*\n`;
    t+=`━━━━━━━━━━━━━━\n`;
    t+=`🔢 رقم الفاتورة: *${inv.invoiceSeq||inv.invoiceNo}*\n`;
    t+=`📅 التاريخ: *${formatInvoiceDate(inv.date)}*\n`;
    t+=`⏰ الوقت: *${inv.time||'غير مسجل في الفاتورة القديمة'}*\n`;
    t+=`👤 العميل: *${inv.customerName||'عميل عادي'}*\n`;
    t+=`🛍️ نوع البيع: *${inv.type==='wholesale'?'جملة':'قطاعي'}*\n`;
    t+=`━━━━━━━━━━━━━━\n`;
    inv.lines.forEach((s,i)=>{
      const p=productForSaleLine(s);
      const qty=isKgProduct(p)||s.isWeightSale ? saleQuantityLabel(p,s.packages||1,s.weight||1) : `${s.packages||s.qty||1} ${isFixedPackProduct(p)?'علبة':(s.sellUnit||p?.unit||'علبة')}`;
      const cashierLabel=`بيع من الكاشير — ${qty}`;
      t+=`${i+1}. *${s.productName||'صنف'}*\n`;
      t+=`   📦 ${cashierLabel}\n`;
      t+=`   💰 ${fmt(s.total)}\n`;
    });
    t+=`━━━━━━━━━━━━━━\n`;
    if(money(inv.subtotal)!==money(inv.total)||money(inv.discount)>0)t+=`الإجمالي قبل الخصم: ${fmt(inv.subtotal)}\n`;
    if(money(inv.discount)>0)t+=`🏷️ الخصم: ${fmt(inv.discount)}\n`;
    if(money(inv.tax)>0)t+=`🧾 الضريبة: ${fmt(inv.tax)}\n`;
    t+=`💰 *الإجمالي النهائي: ${fmt(inv.total)}*\n`;
    t+=`💵 المدفوع: ${fmt(inv.paid)}\n`;
    t+=`${inv.paymentMethod==='cash'?'💸 الباقي':'📌 المتبقي'}: *${fmt(inv.paymentMethod==='cash'?Math.max(0,inv.paid-inv.total):inv.remaining)}*\n`;
    t+=`💳 السداد: *${paymentLabel(inv.paymentMethod)}*`;
    if(inv.note)t+=`\n📝 ملاحظة: ${inv.note}`;
    t+=`\n━━━━━━━━━━━━━━\n❤️ *شكرًا لتعاملكم معنا*`;
    return t;
  }

  function historyCard(inv){
    const lineCount=inv.lines.length;
    const qtyText=inv.lines.reduce((n,s)=>n+money(s.packages||s.qty||0),0);
    return `<article class="invoice-pro-card" onclick="openInvoicePro('${esc(inv.key)}')">
      <div class="invoice-pro-top"><div><span class="invoice-pro-number">رقم ${esc(inv.invoiceSeq||inv.invoiceNo)}</span><small>${esc(inv.date)} ${esc(inv.time)}</small></div><span class="invoice-pro-status ${inv.remaining>0?'due':'paid'}">${inv.remaining>0?'آجل':'مدفوع'}</span></div>
      <div class="invoice-pro-main"><div class="invoice-pro-icon"><i class="fas fa-file-invoice"></i></div><div class="invoice-pro-info"><strong>${esc(inv.customerName)}</strong><span class="invoice-pro-product-name"><i class="fas fa-box-open"></i> ${esc(inv.lines.slice(0,2).map(s=>s.productName||'صنف').join(' + '))}${lineCount>2?' + '+(lineCount-2)+' أصناف أخرى':''}</span><small>${lineCount} ${lineCount===1?'صنف':'أصناف'} • ${qtyText} كمية</small></div><div class="invoice-pro-total"><small>الإجمالي</small><b>${invoiceTotalText(inv)}</b></div></div>
      <div class="invoice-pro-meta"><span><i class="fas fa-${paymentIcon(inv.paymentMethod)}"></i> ${paymentLabel(inv.paymentMethod)}</span><span><i class="fas fa-hand-holding-dollar"></i> ${fmt(inv.paid)}</span><span class="${inv.remaining>0?'due-text':'profit-text'}">${inv.remaining>0?'متبقي '+fmt(inv.remaining):'ربح '+fmt(inv.profit)}</span></div>
      <div class="invoice-pro-actions" onclick="event.stopPropagation()"><button onclick="openInvoicePro('${esc(inv.key)}')"><i class="fas fa-eye"></i> الفاتورة</button><button onclick="printInvoicePro('${esc(inv.key)}')"><i class="fas fa-print"></i></button><button onclick="shareInvoicePro('${esc(inv.key)}')"><i class="fab fa-whatsapp"></i></button><button onclick="editInvoicePro('${esc(inv.key)}')"><i class="fas fa-pen"></i></button></div>
    </article>`;
  }

  window.ensureLegacyInvoiceSequences=ensureLegacyInvoiceSequences;
  window.productForSaleLine=productForSaleLine;
  window.salesInvoiceProState=window.salesInvoiceProState||{q:'',range:'all',type:'',payment:'',date:''};
  window.renderSalesTable=function(){
    const st=window.salesInvoiceProState;
    const q=(document.getElementById('saleSearch')?.value??st.q).trim().toLowerCase();
    const type=document.getElementById('saleTypeFilter')?.value??st.type;
    const payment=document.getElementById('salePaymentFilter')?.value??st.payment;
    const date=document.getElementById('saleFilterDate')?.value??st.date;
    const range=window.salesRange||st.range||'all';
    st.q=q;st.type=type;st.payment=payment;st.date=date;st.range=range;
    let list=groupSales();
    let start='',end='';
    if(range==='custom'&&date){start=end=date;} else if(range!=='all'&&typeof getSalesRangeDates==='function'){[start,end]=getSalesRangeDates(range);}
    list=list.filter(inv=>{
      const hay=`${inv.invoiceNo} ${inv.customerName} ${inv.note} ${inv.lines.map(s=>s.productName||'').join(' ')}`.toLowerCase();
      return (!q||hay.includes(q))&&(!type||inv.type===type)&&(!payment||inv.paymentMethod===payment)&&(!start||(inv.date||'')>=start&&(inv.date||'')<=end);
    });
    const total=list.reduce((n,x)=>n+x.total,0), paid=list.reduce((n,x)=>n+x.paid,0), profit=list.reduce((n,x)=>n+x.profit,0);
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    set('salesStatCount',list.length);set('salesStatTotal',fmt(total));set('salesStatPaid',fmt(paid));set('salesStatProfit',fmt(profit));
    const target=document.getElementById('salesTable');if(target)target.innerHTML=list.map(historyCard).join('')||'<div class="sales-empty"><div><i class="fas fa-receipt"></i></div><strong>لا توجد فواتير</strong><span>جرّب تغيير البحث أو الفلاتر</span></div>';
  };

  window.clearSalesFilters=function(){window.salesRange='all';window.salesInvoiceProState={q:'',range:'all',type:'',payment:'',date:''};['saleSearch','saleFilterDate','saleTypeFilter','salePaymentFilter'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});document.querySelectorAll('.sales-quick-filters button').forEach(b=>b.classList.toggle('active',b.dataset.range==='all'));renderSalesTable();};

  function findInvoice(key){return groupSales().find(x=>x.key===key);}
  function closeIfOpen(){try{closeModal();}catch(e){}}

  window.openInvoicePro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const rows=inv.lines.map(s=>{const q=money(s.packages||s.qty||1),w=money(s.weight||1);const p=productForSaleLine(s);const qty=isKgProduct(p)||s.isWeightSale?saleQuantityLabel(p,q,w):`${q} ${isFixedPackProduct(p)?'علبة':(s.sellUnit||p?.unit||'علبة')}`;return `<div class="invoice-line-pro"><div><strong>${esc(s.productName||'صنف')}</strong><small>${esc(qty)} — ${fmt(s.price||0)}</small></div><b>${fmt(s.total)}</b></div>`}).join('');
    openModal(`<div class="invoice-modal-pro"><div class="modal-header"><div><h2><i class="fas fa-file-invoice" style="color:var(--primary);margin-left:8px"></i> فاتورة رقم ${esc(inv.invoiceSeq||inv.invoiceNo)}</h2><small style="color:var(--text-muted)">${esc(inv.date)} ${esc(inv.time)}</small></div><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="invoice-pro-banner"><div><span>العميل</span><strong>${esc(inv.customerName)}</strong></div><div><span>طريقة السداد</span><strong><i class="fas ${paymentIcon(inv.paymentMethod)}"></i> ${paymentLabel(inv.paymentMethod)}</strong></div><div><span>نوع البيع</span><strong>${inv.type==='wholesale'?'📦 جملة':'🛍️ قطاعي'}</strong></div></div><div class="invoice-lines-pro">${rows}</div><div class="invoice-totals-pro"><div><span>الإجمالي</span><b>${fmt(inv.total)}</b></div><div><span>المدفوع</span><b>${fmt(inv.paid)}</b></div><div class="${inv.remaining>0?'due-row':''}"><span>المتبقي</span><b>${fmt(inv.remaining)}</b></div><div><span>الربح</span><b class="profit-text">${fmt(inv.profit)}</b></div></div>${inv.note?`<div class="invoice-note-pro"><i class="fas fa-note-sticky"></i> ${esc(inv.note)}</div>`:''}<div class="invoice-actions-pro"><button onclick="printInvoicePro('${esc(inv.key)}')"><i class="fas fa-print"></i><span>إعادة طباعة</span></button><button onclick="shareInvoicePro('${esc(inv.key)}')"><i class="fab fa-whatsapp"></i><span>واتساب</span></button><button onclick="editInvoicePro('${esc(inv.key)}')"><i class="fas fa-pen"></i><span>تعديل</span></button><button onclick="openInvoiceReturnPro('${esc(inv.key)}')"><i class="fas fa-rotate-left"></i><span>مرتجع</span></button>${inv.remaining>0?`<button onclick="openInvoiceCollectionPro('${esc(inv.key)}')"><i class="fas fa-money-bill-wave"></i><span>تحصيل</span></button>`:''}<button class="danger" onclick="deleteInvoicePro('${esc(inv.key)}')"><i class="fas fa-trash"></i><span>حذف</span></button></div></div>`);
  };

  window.shareInvoicePro=function(key){const inv=findInvoice(key);if(!inv)return;window.open('https://wa.me/?text='+encodeURIComponent(invoiceText(inv)),'_blank');};

  window.printInvoicePro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const rows=inv.lines.map(s=>{const q=money(s.packages||s.qty||1),w=money(s.weight||1);const p=productForSaleLine(s);const qty=isKgProduct(p)||s.isWeightSale?saleQuantityLabel(p,q,w):`${q} ${isFixedPackProduct(p)?'علبة':(s.sellUnit||p?.unit||'علبة')}`;return `<tr><td>${esc(s.productName||'صنف')}</td><td>${esc(qty)}</td><td>${fmt(s.price||0)}</td><td>${fmt(s.total)}</td></tr>`}).join('');
    const w=window.open('','_blank','width=900,height=800');if(!w){showToast('اسمح بفتح نافذة الطباعة','warning');return;}
    const html='<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>'+esc(inv.invoiceNo)+'</title><style>@page{size:A4;margin:12mm}body{margin:0;font-family:Arial,Tahoma,sans-serif;color:#173b32;background:#fff}.page{width:100%;max-width:190mm;margin:auto;padding:6mm;box-sizing:border-box}.brand{text-align:center;font-size:28px;font-weight:900;color:#0f766e;margin-bottom:4px}.sub{text-align:center;color:#66756f;font-size:12px;line-height:1.8}.line{border-top:1px solid #dce8e3;margin:14px 0}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}th{background:#eef7f3;color:#0f766e}th,td{padding:9px 7px;border-bottom:1px solid #e6eeeb;text-align:right}.r{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}.grand{font-size:19px;font-weight:900;border-top:2px solid #0f766e;margin-top:8px;padding-top:10px}.thanks{text-align:center;margin-top:25px;color:#71827b;font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.meta div{border:1px solid #dfeae5;border-radius:10px;padding:8px}.meta small{display:block;color:#778780;font-size:10px}.meta b{display:block;margin-top:3px;font-size:12px}@media print{button{display:none}}</style></head><body><div class="page"><div class="brand">كنوز الطبيعة</div><div class="sub">فاتورة بيع — '+esc(inv.invoiceNo)+'<br>'+esc(inv.date)+' '+esc(inv.time)+'</div><div class="line"></div><div class="meta"><div><small>العميل</small><b>'+esc(inv.customerName)+'</b></div><div><small>نوع البيع</small><b>'+(inv.type==='wholesale'?'جملة':'قطاعي')+'</b></div><div><small>السداد</small><b>'+paymentLabel(inv.paymentMethod)+'</b></div></div><div class="line"></div><table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+rows+'</tbody></table><div class="line"></div><div class="r"><span>الإجمالي</span><b>'+fmt(inv.total)+'</b></div><div class="r"><span>المدفوع</span><b>'+fmt(inv.paid)+'</b></div><div class="r grand"><span>المتبقي</span><b>'+fmt(inv.remaining)+'</b></div>'+(inv.note?'<div class="line"></div><div class="r"><span>ملاحظات</span><b>'+esc(inv.note)+'</b></div>':'')+'<div class="thanks">شكرًا لتعاملكم معنا ❤️</div></div></body></html>';
    w.document.open();w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),350);
  };

  window.editInvoicePro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const rows=inv.lines.map((s,i)=>{
      const p=productForSaleLine(s);
      const w=money(s.weight||1);
      const factor=(s.isWeightSale||isKgProduct(p))?weightPriceMultiplier(p,w):1;
      const displayPrice=(s.isWeightSale||isKgProduct(p)) ? (money(s.unitPrice)>0 ? money(s.unitPrice) : (factor>0?money(s.price)/factor:money(s.price))) : money(s.price);
      return `<div class="edit-invoice-line"><div class="edit-invoice-name"><strong>${esc(s.productName||'صنف')}</strong><small>المباع: ${money(s.packages!=null?s.packages:s.qty||1)} × ${esc(s.isWeightSale||isKgProduct(p)?weightLabel(w):(s.sellUnit||p?.unit||'علبة'))}</small></div><input data-edit-line="${i}" data-field="qty" type="number" min="0" step="0.001" value="${money(s.qty)}" placeholder="الكمية"><input data-edit-line="${i}" data-field="price" type="number" min="0" step="0.01" value="${displayPrice}" placeholder="السعر"><input data-edit-line="${i}" data-field="discount" type="number" min="0" max="100" step="0.1" value="${money(s.discount)}" placeholder="خصم %"></div>`;
    }).join('');
    openModal(`<div class="modal-header"><h2><i class="fas fa-pen" style="color:var(--primary);margin-left:8px"></i> تعديل الفاتورة ${esc(inv.invoiceNo)}</h2><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="form-group" style="margin-bottom:12px"><label><i class="fas fa-calendar-day" style="color:var(--primary);margin-left:6px"></i> تاريخ الفاتورة</label><input id="editInvoiceDate" type="date" value="${esc(inv.date||'')}"></div><div class="edit-invoice-head"><span>الصنف</span><span>الكمية</span><span>السعر</span><span>الخصم %</span></div><div id="editInvoiceLines">${rows}</div><div class="form-group" style="margin-top:10px"><label>ملاحظات</label><input id="editInvoiceNote" value="${esc(inv.note)}"></div><button class="btn btn-primary btn-block" onclick="saveInvoiceEditPro('${esc(inv.key)}')"><i class="fas fa-save"></i> حفظ تعديل الفاتورة</button>`);
  };

  window.saveInvoiceEditPro=function(key){
    const inv=findInvoice(key);if(!inv)return;

    // حماية خاصة لتعديل التاريخ فقط:
    // إذا لم تتغير الكمية أو السعر أو الخصم أو الملاحظات، نغيّر التاريخ
    // فقط بدون إعادة حساب الفاتورة وبدون لمس المخزون أو الربح أو الكمية.
    const dateInput=document.getElementById('editInvoiceDate');
    const noteInput=document.getElementById('editInvoiceNote');
    const newDateOnly=dateInput?.value||inv.date||'';
    const newNoteOnly=noteInput?.value||'';
    let linesUnchanged=true;

    inv.lines.forEach((s,i)=>{
      const q=money(document.querySelector(`[data-edit-line="${i}"][data-field="qty"]`)?.value);
      const p=money(document.querySelector(`[data-edit-line="${i}"][data-field="price"]`)?.value);
      const d=Math.min(100,Math.max(0,money(document.querySelector(`[data-edit-line="${i}"][data-field="discount"]`)?.value)));
      if(Math.abs(q-money(s.qty))>=0.000001 ||
         Math.abs(p-money(s.price))>=0.000001 ||
         Math.abs(d-money(s.discount))>=0.000001){
        linesUnchanged=false;
      }
    });

    if(linesUnchanged && newNoteOnly===String(inv.note||'')){
      if(newDateOnly!==String(inv.date||'')){
        inv.lines.forEach(s=>Store.update('sales',s.id,{date:newDateOnly}));
        if(inv.saleBatchId){
          (Store.get('debts')||[])
            .filter(d=>d.saleBatchId===inv.saleBatchId&&d.source==='sale')
            .forEach(d=>Store.update('debts',d.id,{date:newDateOnly}));
        }
        closeIfOpen();
        showToast('✅ تم تغيير تاريخ الفاتورة فقط بدون تغيير الكمية أو الحساب','success');
        renderSalesTable();
        return;
      }
      closeIfOpen();
      showToast('لم يتم إجراء أي تغيير','warning');
      return;
    }

    const originalTotal=inv.total;
    let newTotal=0,newProfit=0,valid=true;
    const newVals=inv.lines.map((s,i)=>{
      const qtyInput=document.querySelector(`[data-edit-line="${i}"][data-field="qty"]`);
      const qInput=money(qtyInput?.value);
      const p=money(document.querySelector(`[data-edit-line="${i}"][data-field="price"]`)?.value);
      const d=Math.min(100,Math.max(0,money(document.querySelector(`[data-edit-line="${i}"][data-field="discount"]`)?.value)));
      if(qInput<0||p<0)valid=false;

      // مهم: لو المستخدم غيّر التاريخ فقط، لا نعيد تفسير كمية البيع بالوزن.
      // الفاتورة قد تكون 6 أنصاف × 500 جم = 3 كجم، والـ qty المخزنة هي 3 كجم
      // بينما packages المخزنة هي 6. عند تعديل التاريخ فقط يجب الحفاظ على الاثنين كما هما.
      const oldQty=money(s.qty);
      const oldPackages=s.packages!=null?money(s.packages):oldQty;
      const weight=money(s.weight||1);
      const pObj=productForSaleLine(s);
      const isWeightSale=Boolean(s.isWeightSale||isKgProduct(pObj)||s.weight);
      const quantityUnchanged=Math.abs(qInput-oldQty)<0.000001;
      const q=isWeightSale&&quantityUnchanged?oldQty:qInput;
      const packages=isWeightSale
        ? (quantityUnchanged?oldPackages:Math.max(0,q/(weight||1)))
        : q;
      const multiplier=isWeightSale?weightPriceMultiplier(pObj,weight):1;
      const gross=p*multiplier*packages;
      const total=Math.max(0,gross*(1-d/100));
      const oldCostPerKg=isWeightSale && weight>0 && s.cost ? money(s.cost)/weight : money(s.cost);
      const cost=isWeightSale?oldCostPerKg*weight:money(s.cost);
      const profit=(q>0?Math.max(0,total-cost*q):0);
      newTotal+=total;newProfit+=profit;
      return {s,q,packages,p,d,total,profit,weight,isWeightSale,multiplier,cost,unitPrice:isWeightSale?p:p};
    });
    if(!valid)return showToast('تحقق من الكميات والأسعار','warning');
    // Inventory adjustment per line: return old qty, then deduct new qty.
    newVals.forEach(v=>{const p=Store.get('products').find(x=>String(x.id)===String(v.s.productId));if(p){const restored=money(p.qty)+money(v.s.qty);Store.update('products',p.id,{qty:restored-v.q});}});
    const oldCustomer=inv.customerId,oldCustomerName=inv.customerName;
    const note=newNoteOnly;
    const newDate=newDateOnly;
    const delta=newTotal-originalTotal;
    newVals.forEach(v=>Store.update('sales',v.s.id,{qty:v.q,packages:v.packages,price:v.isWeightSale?(v.p*v.multiplier):v.p,unitPrice:v.p,cost:v.cost,discount:v.d,total:v.total,profit:v.profit,note,date:newDate}));
    const paid=Math.min(inv.paid,newTotal),remaining=Math.max(0,newTotal-paid);
    if(inv.saleBatchId){
      newVals.forEach(v=>Store.update('sales',v.s.id,{paid,remaining}));
      (Store.get('debts')||[]).filter(d=>d.saleBatchId===inv.saleBatchId&&d.source==='sale').forEach(d=>Store.delete('debts',d.id));
      if(remaining>0)Store.add('debts',{saleBatchId:inv.saleBatchId,invoiceNo:inv.invoiceNo,date:newDate,person:oldCustomerName,type:'لنا',amount:remaining,due:'',note:`آجل من الفاتورة ${inv.invoiceNo}`,paid:false,source:'sale',saleTotal:newTotal,paidAmount:paid});
    }else{
      Store.update('sales',inv.id,{paid,remaining});
    }
    if(oldCustomer){const cs=Store.get('customers');const c=cs.find(x=>x.id===oldCustomer);if(c){c.totalSpent=Math.max(0,money(c.totalSpent)+delta);Store.set('customers',cs);}}
    closeIfOpen();showToast('✅ تم تعديل الفاتورة وتحديث المخزون','success');renderSalesTable();
  };

  window.openInvoiceReturnPro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const rows=inv.lines.map((s,i)=>`<div class="return-invoice-line"><div><strong>${esc(s.productName||'صنف')}</strong><small>المباع: ${money(s.qty)} ${s.weight?'كجم':''}</small></div><input data-return-line="${i}" type="number" min="0" max="${money(s.qty)}" step="0.001" value="0" placeholder="مرتجع"></div>`).join('');
    openModal(`<div class="modal-header"><h2><i class="fas fa-rotate-left" style="color:var(--accent);margin-left:8px"></i> مرتجع الفاتورة</h2><button class="modal-close" onclick="closeModal()">&times;</button></div><p style="font-size:.72rem;color:var(--text-light)">يمكنك إدخال كمية مرتجعة لكل صنف، أو إدخال كامل الكمية للمرتجع الكامل.</p><div class="return-invoice-list">${rows}</div><button class="btn btn-accent btn-block" style="margin-top:10px" onclick="confirmInvoiceReturnPro('${esc(inv.key)}')"><i class="fas fa-check"></i> تنفيذ المرتجع</button>`);
  };

  window.confirmInvoiceReturnPro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    let refund=0,changed=false;
    inv.lines.forEach((s,i)=>{const input=document.querySelector(`[data-return-line="${i}"]`);const r=Math.min(money(s.qty),Math.max(0,money(input?.value)));if(r<=0)return;changed=true;const ratio=s.qty?Math.min(1,r/money(s.qty)):1;refund+=money(s.total)*ratio;const p=Store.get('products').find(x=>String(x.id)===String(s.productId));if(p)Store.update('products',p.id,{qty:money(p.qty)+r});const newQty=Math.max(0,money(s.qty)-r);const newTotal=Math.max(0,money(s.total)-money(s.total)*ratio);const newProfit=Math.max(0,money(s.profit)-money(s.profit)*ratio);Store.update('sales',s.id,{qty:newQty,packages:s.weight?newQty/(money(s.weight)||1):newQty,total:newTotal,profit:newProfit,returnedQty:money(s.returnedQty)+r,returnedAmount:money(s.returnedAmount)+money(s.total)*ratio});});
    if(!changed)return showToast('حدد كمية المرتجع أولًا','warning');
    const updated=findInvoice(key);const newTotal=updated?updated.total:Math.max(0,inv.total-refund);const paid=Math.min(inv.paid,newTotal),remaining=Math.max(0,newTotal-paid);
    if(inv.saleBatchId){const batch=allSales().filter(s=>s.saleBatchId===inv.saleBatchId);batch.forEach(s=>Store.update('sales',s.id,{paid,remaining}));(Store.get('debts')||[]).filter(d=>d.saleBatchId===inv.saleBatchId&&d.source==='sale').forEach(d=>Store.delete('debts',d.id));if(remaining>0)Store.add('debts',{saleBatchId:inv.saleBatchId,invoiceNo:inv.invoiceNo,date:inv.date,person:inv.customerName,type:'لنا',amount:remaining,due:'',note:`آجل بعد مرتجع ${inv.invoiceNo}`,paid:false,source:'sale',saleTotal:newTotal,paidAmount:paid});}
    closeIfOpen();showToast('✅ تم تسجيل المرتجع '+fmt(refund)+' وتحديث المخزون','success');renderSalesTable();
  };

  window.openInvoiceCollectionPro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    openModal(`<div class="modal-header"><h2><i class="fas fa-money-bill-wave" style="color:var(--success);margin-left:8px"></i> تحصيل من ${esc(inv.invoiceNo)}</h2><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="collection-pro-box"><small>المتبقي الحالي</small><strong>${fmt(inv.remaining)}</strong><input id="invoiceCollectionAmount" type="number" min="0" max="${inv.remaining}" step="0.01" value="${inv.remaining}"></div><button class="btn btn-success btn-block" onclick="confirmInvoiceCollectionPro('${esc(inv.key)}')"><i class="fas fa-check"></i> تسجيل التحصيل</button>`);
  };
  window.confirmInvoiceCollectionPro=function(key){
    const inv=findInvoice(key);if(!inv)return;const amount=Math.min(inv.remaining,Math.max(0,money(document.getElementById('invoiceCollectionAmount')?.value)));if(amount<=0)return showToast('أدخل مبلغ التحصيل','warning');const newPaid=inv.paid+amount,newRemaining=Math.max(0,inv.total-newPaid);inv.lines.forEach(s=>Store.update('sales',s.id,{paid:newPaid,remaining:newRemaining}));if(inv.saleBatchId){(Store.get('debts')||[]).filter(d=>d.saleBatchId===inv.saleBatchId&&d.source==='sale').forEach(d=>Store.delete('debts',d.id));if(newRemaining>0)Store.add('debts',{saleBatchId:inv.saleBatchId,invoiceNo:inv.invoiceNo,date:inv.date,person:inv.customerName,type:'لنا',amount:newRemaining,due:'',note:`تحصيل جزئي من ${inv.invoiceNo}`,paid:false,source:'sale',saleTotal:inv.total,paidAmount:newPaid});}closeIfOpen();showToast('✅ تم تسجيل التحصيل '+fmt(amount),'success');renderSalesTable();
  };

  window.deleteInvoicePro=function(key){const inv=findInvoice(key);if(!inv)return;if(!confirm(`حذف الفاتورة ${inv.invoiceNo} بالكامل؟ سيتم إعادة الكميات للمخزون.`))return;inv.lines.forEach(s=>{const p=Store.get('products').find(x=>String(x.id)===String(s.productId));if(p)Store.update('products',p.id,{qty:money(p.qty)+money(s.qty)});Store.delete('sales',s.id);});if(inv.saleBatchId)(Store.get('debts')||[]).filter(d=>d.saleBatchId===inv.saleBatchId&&d.source==='sale').forEach(d=>Store.delete('debts',d.id));closeIfOpen();showToast('🗑️ تم حذف الفاتورة وإرجاع الكميات للمخزون');renderSalesTable();};

  // Make the existing sale-history section look like an invoice manager without replacing the POS.
  const originalRenderSalesPage=window.renderSalesPage;
  if(typeof originalRenderSalesPage==='function'){
    window.renderSalesPage=function(container){originalRenderSalesPage(container);setTimeout(()=>renderSalesTable(),0);};
  }
})();

</script>

<script id="v1-5-10-swipe-navigation">
(function(){
  const mainTabs=['dashboard','products','sales','more'];
  let startX=0,startY=0,startTime=0,tracking=false;
  const MIN_X=46, MAX_Y=68, MAX_TIME=850;
  function blockedTarget(el){
    if(!el) return true;
    return !!el.closest('input,textarea,select,button,[contenteditable="true"],.modal-overlay,.modal,.table-wrap,.pos-cart-list,.pos-category-row,.products-filter-buttons');
  }
  function animateSwipe(direction){
    const c=document.getElementById('contentArea'); if(!c)return;
    c.classList.remove('swipe-next','swipe-prev'); void c.offsetWidth;
    c.classList.add(direction==='next'?'swipe-next':'swipe-prev');
    setTimeout(()=>c.classList.remove('swipe-next','swipe-prev'),430);
  }
  function goSwipe(direction){
    const current=mainTabs.indexOf(currentTab); if(current<0)return;
    const next=direction==='next'?current+1:current-1;
    if(next<0||next>=mainTabs.length)return;
    animateSwipe(direction);
    requestAnimationFrame(()=>navigateTo(mainTabs[next]));
  }
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1||blockedTarget(e.target))return;
    const t=e.touches[0]; startX=t.clientX; startY=t.clientY; startTime=Date.now(); tracking=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!tracking||e.changedTouches.length!==1){tracking=false;return;}
    tracking=false; if(blockedTarget(e.target))return;
    const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY,dt=Date.now()-startTime;
    if(dt>MAX_TIME||Math.abs(dx)<MIN_X||Math.abs(dy)>MAX_Y||Math.abs(dx)<Math.abs(dy)*1.15)return;
    if(dx<0)goSwipe('next');else goSwipe('prev');
  },{passive:true});
})();
</script>
