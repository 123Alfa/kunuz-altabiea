function saveSaleEdit(id){
  const sales=Store.get('sales')||[];
  const original=sales.find(s=>String(s.id)===String(id));
  if(!original)return;

  const pid=document.getElementById('esProduct').value;
  const qty=Number(document.getElementById('esQty').value)||0;
  const price=Number(document.getElementById('esPrice').value)||0;
  const cost=Number(document.getElementById('esCost').value)||0;
  const discountPct=Math.max(0,Math.min(100,Number(document.getElementById('esDiscount').value)||0));
  if(!pid||qty<=0||price<=0)return showToast('أكمل البيانات','warning');

  const products=Store.get('products')||[];
  const newProduct=products.find(p=>String(p.id)===String(pid));
  if(!newProduct)return showToast('الصنف غير موجود','error');

  const batchId=original.saleBatchId||'';
  const batch=batchId?sales.filter(s=>String(s.saleBatchId)===String(batchId)):[original];
  const oldTotal=batch.reduce((n,s)=>n+Number(s.total||0),0);
  const oldPaid=Math.max(0,Number(original.paid||0));
  const oldInitialPaid=Math.max(0,Number(original.initialPaid||0));
  const oldCollections=Math.max(0,oldPaid-oldInitialPaid);

  // Snapshot everything affected so a failed edit cannot leave stock/sales/debts inconsistent.
  const snapshot={
    products:localStorage.getItem('bm_products'),
    sales:localStorage.getItem('bm_sales'),
    debts:localStorage.getItem('bm_debts'),
    customers:localStorage.getItem('bm_customers')
  };
  try{
    // Restore the original stock first, then reserve the new quantity.
    if(original.productId){
      const oldProduct=products.find(p=>String(p.id)===String(original.productId));
      if(oldProduct)Store.update('products',oldProduct.id,{qty:Number(oldProduct.qty||0)+Number(original.qty||0)});
    }
    const currentProduct=(Store.get('products')||[]).find(p=>String(p.id)===String(pid));
    if(!currentProduct)throw new Error('NEW_PRODUCT_NOT_FOUND');
    if(Number(currentProduct.qty||0)+1e-9<qty){
      throw new Error('INSUFFICIENT_STOCK');
    }
    Store.update('products',currentProduct.id,{qty:Number(currentProduct.qty||0)-qty});

    const discountedPrice=money(price*(1-discountPct/100));
    const total=money(discountedPrice*qty);
    const profit=money((discountedPrice-cost)*qty);
    const customerId=document.getElementById('esCustomer').value||'';
    const customCustomerName=(document.getElementById('esCustomCustomer')?.value||'').trim();
    const customerName=customerId?
      ((Store.get('customers')||[]).find(c=>String(c.id)===String(customerId))?.name||''):
      (customCustomerName||'عميل عادي');

    Store.update('sales',original.id,{
      date:document.getElementById('esDate').value||today(),
      productId:pid,
      productName:newProduct.name,
      customerId:customerId||null,
      customerName,
      type:document.getElementById('esType').value,
      qty,
      price:money(price),
      cost:money(cost),
      discount:discountPct,
      discountedPrice,
      total,
      profit,
      note:document.getElementById('esNote').value
    });

    // If this is part of an invoice, rebuild its financial totals from the whole batch.
    if(batchId){
      const updatedBatch=(Store.get('sales')||[]).filter(s=>String(s.saleBatchId)===String(batchId));
      const newTotal=money(updatedBatch.reduce((n,s)=>n+Number(s.total||0),0));
      const paid=money(Math.min(oldPaid,newTotal));
      const remaining=money(Math.max(0,newTotal-paid));
      updatedBatch.forEach((line,i)=>Store.update('sales',line.id,{
        paid,
        remaining,
        // Keep the original first-payment amount stable; later collections remain history entries.
        initialPaid:i===0?money(Math.min(oldInitialPaid,paid)):0
      }));

      const debts=(Store.get('debts')||[]).filter(d=>String(d.saleBatchId)===String(batchId)&&d.source==='sale'&&d.type==='لنا');
      debts.forEach(d=>Store.delete('debts',d.id));
      if(remaining>0){
        const base=debts[0]||{};
        const paidFromCollections=money(Math.min(remaining+oldCollections,Math.max(0,oldCollections)));
        Store.add('debts',{
          ...base,
          saleBatchId:batchId,
          invoiceNo:original.invoiceNo,
          customerId:customerId||original.customerId||null,
          date:document.getElementById('esDate').value||original.date||today(),
          person:customerName||original.customerName||'عميل عادي',
          type:'لنا',
          amount:remaining,
          paidAmount:paidFromCollections,
          paymentHistory:Array.isArray(base.paymentHistory)?base.paymentHistory:[],
          debtVersion:2,
          paid:remaining<=0,
          source:'sale',
          saleTotal:newTotal,
          note:`آجل من الفاتورة ${original.invoiceNo||''}`
        });
      }
    }

    closeModal();
    showToast('✅ تم تعديل الفاتورة وتحديث المخزون والدين المرتبط بها','success');
    renderSalesPage(document.getElementById('contentArea'));
  }catch(error){
    ['products','sales','debts','customers'].forEach(k=>{
      try{
        const raw=snapshot[k];
        if(raw===null)localStorage.removeItem('bm_'+k);else localStorage.setItem('bm_'+k,raw);
      }catch(e){}
    });
    if(error.message==='INSUFFICIENT_STOCK')showToast('❌ الكمية المطلوبة غير متاحة بعد استرجاع الكمية القديمة','warning');
    else {console.error('فشل تعديل البيع وتم التراجع:',error);showToast('❌ تعذر تعديل الفاتورة — تم التراجع عن العملية','error');}
  }
}

function addSale(){
  const pid=document.getElementById('sProduct').value;
  const qty=parseFloat(document.getElementById('sQty').value)||0;
  const price=parseFloat(document.getElementById('sPrice').value)||0;
  const cost=parseFloat(document.getElementById('sCost').value)||0;
  const discountPct=parseFloat(document.getElementById('sDiscount').value)||0;
  if(!pid||qty<=0||price<=0)return showToast('أكمل البيانات','warning');
  const product=(window.saleProducts||[]).find(p=>p.id===pid);
  if(!product)return;
  if((product.qty||0)<qty)return showToast('الكمية غير متوفرة! المتاح: '+formatProductQty(product, product.qty)+' '+product.unit,'warning');

  const discountedPrice=price*(1-discountPct/100);
  const total=discountedPrice*qty;
  const profit=(discountedPrice-cost)*qty;

  Store.update('products',pid,{qty:(product.qty||0)-qty});

  const customerId=document.getElementById('sCustomer').value;
  const customerName=customerId?(Store.get('customers').find(c=>c.id===customerId)?.name||''):'';

  Store.add('sales',{
    date:document.getElementById('sDate').value||today(),
    productId:pid,
    productName:product.name,
    customerId:customerId||null,
    customerName:customerName,
    type:document.getElementById('sType').value,
    qty,
    price,
    cost,
    discount:discountPct,
    discountedPrice,
    total,
    profit,
    note:document.getElementById('sNote').value
  });

  // تحديث نقاط العميل
  if(customerId){
    const customers=Store.get('customers');
    const cIdx=customers.findIndex(c=>c.id===customerId);
    if(cIdx>=0){
      customers[cIdx].points=(customers[cIdx].points||0)+Math.floor(total/10);
      customers[cIdx].totalSpent=(customers[cIdx].totalSpent||0)+total;
      Store.set('customers',customers);
    }
  }

  showToast('✅ تم البيع: '+fmt(total));
  document.getElementById('sQty').value='';
  document.getElementById('sDiscount').value='';
  document.getElementById('sNote').value='';
  calcSaleProfit();
  renderSalesPage(document.getElementById('contentArea'));
}
function salesEscape(value){
  return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

function salePaymentLabel(method){return ({cash:'نقدي',credit:'آجل',transfer:'تحويل',card:'بطاقة'})[method]||'غير محدد';}
function salePaymentIcon(method){return ({cash:'fa-money-bill-wave',credit:'fa-file-invoice-dollar',transfer:'fa-mobile-screen-button',card:'fa-credit-card'})[method]||'fa-wallet';}
function getSalesRangeDates(range){
  const now=new Date(); const local=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;};
  if(range==='today')return [iso(local),iso(local)];
  if(range==='month')return [iso(new Date(local.getFullYear(),local.getMonth(),1)),iso(new Date(local.getFullYear(),local.getMonth()+1,0))];
  if(range==='week'){const day=local.getDay();const diffToSaturday=(day+1)%7;const start=new Date(local);start.setDate(local.getDate()-diffToSaturday);const end=new Date(start);end.setDate(start.getDate()+6);return [iso(start),iso(end)];}
  return ['',''];
}

function renderSalesTable(){
  const sales=Store.get('sales')||[];
  const fs=(document.getElementById('saleSearch')?.value||'').toLowerCase().trim();
  const fd=document.getElementById('saleFilterDate')?.value||'';
  const type=document.getElementById('saleTypeFilter')?.value||'';
  const payment=document.getElementById('salePaymentFilter')?.value||'';
  const range=window.salesRange||'all';
  let start='',end='';
  if(range==='custom'&&fd){start=end=fd;} else if(range!=='all'){[start,end]=getSalesRangeDates(range);}
  const filtered=sales.filter(s=>{
    const text=`${s.productName||''} ${s.customerName||''} ${s.note||''}`.toLowerCase();
    return (!fs||text.includes(fs))&&(!type||s.type===type)&&(!payment||s.paymentMethod===payment)&&(!start||(s.date||'')>=start&&(s.date||'')<=end);
  }).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const total=filtered.reduce((sum,s)=>sum+Number(s.total||0),0);
  const paid=filtered.reduce((sum,s)=>sum+Number(s.paid??s.total??0),0);
  const profit=filtered.reduce((sum,s)=>sum+Number(s.profit||0),0);
  const c=id=>document.getElementById(id);
  if(c('salesStatCount'))c('salesStatCount').textContent=filtered.length;
  if(c('salesStatTotal'))c('salesStatTotal').textContent=fmt(total);
  if(c('salesStatPaid'))c('salesStatPaid').textContent=fmt(paid);
  if(c('salesStatProfit'))c('salesStatProfit').textContent=fmt(profit);
  const target=c('salesTable'); if(!target)return;
  target.innerHTML=filtered.map(s=>{
    const remaining=Math.max(0,Number(s.remaining??(Number(s.total||0)-Number(s.paid||0))));
    const qty=s.packages&&s.weight?`${s.packages} × ${salesEscape(weightLabel(Number(s.weight)))}<small>${salesEscape(s.qty)} كجم</small>`:salesEscape(s.qty??0);
    return `<article class="sale-record-card">
      <div class="sale-record-top"><div class="sale-record-date"><i class="fas fa-calendar-day"></i><span>${salesEscape(s.date||'-')}</span></div><span class="sale-type-pill ${s.type==='wholesale'?'wholesale':'retail'}">${s.type==='wholesale'?'📦 جملة':'🛍️ قطاعي'}</span></div>

      <div class="sale-record-meta"><div><small>الكمية</small><strong>${qty}</strong></div><div><small>السعر</small><strong>${fmt(s.price||0)}</strong></div><div><small>السداد</small><strong><i class="fas ${salePaymentIcon(s.paymentMethod)}"></i> ${salePaymentLabel(s.paymentMethod)}</strong></div><div><small>الربح</small><strong class="sale-profit">${fmt(s.profit||0)}</strong></div></div>
      ${remaining>0?`<div class="sale-record-debt"><span><i class="fas fa-hourglass-half"></i> متبقي</span><strong>${fmt(remaining)}</strong></div>`:''}
      <div class="sale-record-actions"><button type="button" class="sale-view-btn" onclick="openSaleDetails('${s.id}')"><i class="fas fa-eye"></i> التفاصيل</button><button type="button" class="sale-edit-btn" onclick="editSale('${s.id}')"><i class="fas fa-edit"></i></button><button type="button" class="sale-delete-btn" onclick="deleteSale('${s.id}','${s.productId||''}',${Number(s.qty)||0})"><i class="fas fa-trash"></i></button></div>
    </article>`;
  }).join('')||`<div class="sales-empty"><div><i class="fas fa-receipt"></i></div><strong>لا توجد مبيعات</strong><span>جرّب تغيير الفلاتر أو البحث عن عملية أخرى</span></div>`;
}
function deleteSale(id,productId,qty){
  if(!confirm('حذف عملية البيع؟'))return;
  const sales=Store.get('sales')||[];
  const sale=sales.find(x=>String(x.id)===String(id));
  const batchId=sale?.saleBatchId||'';
  if(productId){const p=Store.get('products').find(x=>String(x.id)===String(productId));if(p)Store.update('products',productId,{qty:(p.qty||0)+qty});}
  Store.delete('sales',id);

  // حذف الدين المرتبط بالفاتورة عند حذف آخر بند من نفس الفاتورة
  if(batchId){
    const remainingBatch=(Store.get('sales')||[]).some(x=>x.saleBatchId===batchId);
    if(!remainingBatch){
      (Store.get('debts')||[]).filter(d=>d.saleBatchId===batchId && d.source==='sale' && d.type==='لنا').forEach(d=>Store.delete('debts',d.id));
    }
  } else if(sale?.customerId && Number(sale?.remaining||0)>0){
    // توافق مع الفواتير القديمة التي لم يكن لها رقم فاتورة موحد
    const candidates=(Store.get('debts')||[]).filter(d=>d.source==='sale'&&d.type==='لنا'&&!d.paid&&String(d.person||'')===String(sale.customerName||''));
    const match=candidates.find(d=>Math.abs(Number(d.amount||0)-Number(sale.remaining||0))<0.01 && d.date===sale.date);
    if(match)Store.delete('debts',match.id);
  }
  showToast('🗑️ تم حذف البيع والدين المرتبط به إن وجد');
  renderSalesTable();
}

function addPurchase(){
  const pid=document.getElementById('purProduct').value;
  const qty=parseFloat(document.getElementById('purQty').value)||0;
  const price=parseFloat(document.getElementById('purPrice').value)||0;
  const total=qty*price;
  let paid=parseFloat(document.getElementById('purPaid')?.value)||0;
  if(!pid||qty<=0||price<=0)return showToast('أكمل البيانات','warning');
  if(paid<0)paid=0;
  if(paid>total)return showToast('المبلغ المدفوع أكبر من إجمالي الشراء','warning');
  const remaining=Math.max(0,total-paid);
  const products=Store.get('products');
  const product=products.find(p=>p.id===pid);if(!product)return;
  const netUnitPrice=qty>0?total/qty:price;
  const oldQty=Number(product.qty||0);
  const oldPurchasePrice=Number(product.purchase||0);
  const totalNewQty=oldQty+qty;
  const avgPurchasePrice=totalNewQty>0?((oldQty*oldPurchasePrice)+(qty*netUnitPrice))/totalNewQty:netUnitPrice;
  Store.update('products',pid,{qty:totalNewQty,purchase:avgPurchasePrice});
  const supplierId=document.getElementById('purSupplier').value;
  const supplierName=supplierId?(Store.get('suppliers').find(s=>s.id===supplierId)?.name||''):'بائع/مورد';
  const purchaseBatchId='PUR-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
  Store.add('purchases',{purchaseBatchId,date:document.getElementById('purDate').value||today(),productId:pid,productName:product.name,qty,price,total,paid,remaining,supplierId:supplierId||null,supplierName,note:document.getElementById('purNote').value,paymentMethod:remaining>0?'credit':'cash'});
  if(remaining>0){
    Store.add('debts',{purchaseBatchId,sourcePurchaseId:null,supplierId:supplierId||null,date:document.getElementById('purDate').value||today(),person:supplierName,type:'علينا',amount:remaining,paidAmount:0,paymentHistory:[],debtVersion:2,due:'',note:`آجل من شراء ${product.name}`,paid:false,source:'purchase',purchaseTotal:total});
  }
  showToast(remaining>0?'✅ تم الشراء وتسجيل المتبقي آجل: '+fmt(remaining):'✅ تم الشراء: '+fmt(total));
  renderPurchasesPage(document.getElementById('contentArea'));
}

  const total=qty*price;
  let paid=parseFloat(document.getElementById('epurPaid')?.value)||0;
  if(paid<0)paid=0;
  if(paid>total)return showToast('المبلغ المدفوع أكبر من إجمالي الشراء','warning');
  const remaining=Math.max(0,total-paid);

  if(!pid||qty<=0||price<=0)return showToast('أكمل البيانات','warning');

  const product=Store.get('products').find(p=>p.id===pid);
  if(!product)return;

  if(original.productId){
    const origProduct=Store.get('products').find(p=>p.id===original.productId);
    if(origProduct){
      const restoredQty=(origProduct.qty||0)-original.qty;
      Store.update('products',original.productId,{qty:Math.max(0,restoredQty)});
    }
  }

  const currentProduct=Store.get('products').find(p=>p.id===pid);
  const oldQty=currentProduct.qty||0;
  const oldPurchasePrice=currentProduct.purchase||0;
  const totalNewQty=oldQty+qty;
  const netUnitPrice=qty>0?total/qty:price;
  const avgPurchasePrice=totalNewQty>0?((oldQty*oldPurchasePrice)+(qty*netUnitPrice))/totalNewQty:netUnitPrice;

  Store.update('products',pid,{qty:totalNewQty,purchase:avgPurchasePrice});

  const supplierId=document.getElementById('epurSupplier').value;
  const supplierName=supplierId?(Store.get('suppliers').find(s=>s.id===supplierId)?.name||''):'';
  const purchaseBatchId=original.purchaseBatchId||('PUR-'+Date.now()+'-'+Math.random().toString(36).slice(2,8));

  Store.update('purchases',id,{
    date:document.getElementById('epurDate').value||today(),
    productId:pid,
    productName:product.name,
    qty,
    price,
    total,
    paid,
    remaining,
    paymentMethod:remaining>0?'credit':'cash',
    purchaseBatchId:original.purchaseBatchId||('PUR-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)),
    supplierId:supplierId||null,
    supplierName:supplierName,
    note:document.getElementById('epurNote').value
  });

  // إعادة ضبط دين المورد المرتبط بهذه الفاتورة
  const batchId=original.purchaseBatchId;
  if(batchId){
    Store.get('debts').filter(d=>d.purchaseBatchId===batchId).forEach(d=>Store.delete('debts',d.id));
  }
  if(remaining>0){
    Store.add('debts',{purchaseBatchId:original.purchaseBatchId||purchaseBatchId,supplierId:supplierId||null,date:document.getElementById('epurDate').value||today(),person:supplierName||'بائع/مورد',type:'علينا',amount:remaining,paidAmount:0,paymentHistory:[],debtVersion:2,due:'',note:`آجل من شراء ${product.name}`,paid:false,source:'purchase',purchaseTotal:total});
  }

  closeModal();showToast('✅ تم التعديل');renderPurchasesPage(document.getElementById('contentArea'));
}

function deletePurchase(id){
  if(!confirm('حذف عملية الشراء؟ سيتم خصم الكمية من المخزون.'))return;

  const purchases=Store.get('purchases');
  const purchase=purchases.find(p=>p.id===id);
  if(!purchase){showToast('❌ العملية غير موجودة','error');return;}

  const products=Store.get('products');
  const product=products.find(p=>p.id===purchase.productId);
  if(!product){Store.delete('purchases',id);showToast('🗑️ تم الحذف');renderPurchasesTable();return;}

  const newQty=(product.qty||0)-(purchase.qty||0);

  if(newQty<0){
    if(!confirm('⚠️ الكمية في المخزون أقل من الكمية المشتراة! سيتم جعل الكمية صفر. متأكد؟'))return;
  }

  Store.update('products',purchase.productId,{qty:Math.max(0,newQty)});

  const batchId=purchase.purchaseBatchId;
  if(batchId){Store.get('debts').filter(d=>d.purchaseBatchId===batchId).forEach(d=>Store.delete('debts',d.id));}
  Store.delete('purchases',id);

  showToast('🗑️ تم الحذف وتحديث المخزون');
  renderPurchasesTable();
}

function cashboxList(key){
  try{
    const value=Store.get(key);
    return Array.isArray(value)?value:[];
  }catch(e){
    console.warn('تعذر قراءة حركة الخزنة:',key,e);
    return [];
  }
}
function cashboxNum(v){
  const n=Number(v);
  return Number.isFinite(n)&&n>0?n:0;
}
function getCashboxData(){
  const movements=[];
  try{
    const sales=cashboxList('sales');
    const saleGroups=new Map();
    sales.forEach(s=>{
      if(!s||typeof s!=='object') return;
      const key=s.saleBatchId?String(s.saleBatchId):'sale:'+String(s.id||'');
      if(!saleGroups.has(key)) saleGroups.set(key,[]);
      saleGroups.get(key).push(s);
    });
    saleGroups.forEach(lines=>{
      const first=lines[0]||{};
      const method=String(first.paymentMethod||'cash').toLowerCase();
      const total=lines.reduce((n,x)=>n+cashboxNum(x&&x.total),0);
      const isCash=method==='cash'||method==='نقدي'||method==='نقد';
      const isCredit=method==='credit'||method==='آجل';
      // مهم: paid في سجل المبيعات هو الرصيد المدفوع التراكمي للفواتير، وليس مبلغًا جديدًا دخل الخزنة.
      // لذلك لا نستخدمه مباشرة بعد التحصيلات اللاحقة؛ نستخدم initialPaid للتحصيل وقت إنشاء الفاتورة،
      // وcollectionHistory للتحصيلات التي تمت لاحقًا من سجل المبيعات.
      let initialPaid;
      if(Object.prototype.hasOwnProperty.call(first,'initialPaid')){
        initialPaid=Math.min(total,Math.max(0,Number(first.initialPaid)||0));
      }else if(isCash){
        // توافق مع الفواتير القديمة: الفاتورة النقدية القديمة كانت تسجل كامل قيمتها نقدًا.
        initialPaid=Object.prototype.hasOwnProperty.call(first,'paid')?Math.min(total,Math.max(0,Number(first.paid)||0)):total;
      }else if(isCredit){
        // للفواتير الآجلة القديمة، يمكن استنتاج الدفعة الأولى من الدين الأصلي إن كان لا يزال موجودًا.
        const debt=(cashboxList('debts')||[]).find(d=>d&&d.source==='sale'&&d.saleBatchId&&String(d.saleBatchId)===String(first.saleBatchId||''));
        initialPaid=debt&&Object.prototype.hasOwnProperty.call(debt,'saleTotal')?Math.min(total,Math.max(0,Number(debt.saleTotal)-Number(debt.amount||0))):0;
      }else initialPaid=0;
      if((isCash||isCredit)&&initialPaid>0){
        const title=isCredit?'بيع آجل — تحصيل مقدم':'بيع نقدي';
        const detail='فاتورة '+String(first.invoiceSeq||first.invoiceNo||first.id||'')+' • '+String(first.customerName||'عميل عادي')+(isCredit?' • إجمالي '+fmt(total):'');
        movements.push({date:String(first.date||'').slice(0,10),time:String(first.time||'').slice(0,5),kind:'in',amount:initialPaid,title,detail,icon:'fa-cart-shopping',ref:(first.saleBatchId||first.id)+'-initial'});
      }
      // تحصيلات تمت من سجل المبيعات: كل دفعة تظهر كمقبوض مستقل بالمبلغ والوقت الحقيقيين.
      // التحصيلات اللاحقة للفاتورة الآجلة تُقرأ من paymentHistory في سجل الدين.
      // لا نعيد قراءتها من collectionHistory هنا حتى لا تدخل الخزنة مرتين.
      const linkedSaleDebt=(cashboxList('debts')||[]).some(d=>d&&d.source==='sale'&&d.type==='لنا'&&String(d.saleBatchId||'')===String(first.saleBatchId||''));
      if(!linkedSaleDebt){
        const collections=Array.isArray(first.collectionHistory)?first.collectionHistory:[];
        collections.forEach((h,i)=>{
          const amount=cashboxNum(h&&h.amount); if(!amount)return;
          const dt=String(h&&h.date||'');
          movements.push({date:dt.slice(0,10)||String(first.date||'').slice(0,10),time:cairoTimeFromStored(dt),kind:'in',amount,title:'تحصيل من عميل',detail:String(first.customerName||'عميل عادي')+' • فاتورة '+String(first.invoiceSeq||first.invoiceNo||first.id||''),icon:'fa-hand-holding-dollar',ref:String(first.saleBatchId||first.id)+'-collection-'+i});
        });
      }
    });
    cashboxList('purchases').forEach(p=>{
      const paid=cashboxNum(p&&p.paid);
      if(paid>0) movements.push({date:String(p&&p.date||'').slice(0,10),time:'',kind:'out',amount:paid,title:'شراء مدفوع',detail:String(p&&p.productName||'مشتريات')+' • '+String(p&&p.supplierName||'بائع/مورد'),icon:'fa-cart-flatbed',ref:p&&p.purchaseBatchId||p&&p.id});
    });
    cashboxList('expenses').forEach(e=>{
      const amount=cashboxNum(e&&e.amount);
      if(amount>0) movements.push({date:String(e&&e.date||'').slice(0,10),time:'',kind:'out',amount,title:'مصروف',detail:String(e&&e.type||'مصروف')+(e&&e.note?' • '+String(e.note):''),icon:'fa-receipt',ref:e&&e.id});
    });
    cashboxList('withdrawals').forEach(w=>{
      const amount=cashboxNum(w&&w.amount);
      if(amount>0) movements.push({date:String(w&&w.date||'').slice(0,10),time:'',kind:'out',amount,title:'سحب شخصي',detail:String(w&&w.note||'سحب من الخزنة'),icon:'fa-money-bill-transfer',ref:w&&w.id});
    });
    cashboxList('debts').forEach(d=>{
      if(!d||typeof d!=='object') return;
      const type=d.type==='لنا'?'in':'out';
      const history=Array.isArray(d.paymentHistory)?d.paymentHistory:[];
      history.forEach((h,i)=>{
        const amount=cashboxNum(h&&h.amount);
        if(!amount)return;
        const dt=String(h&&h.date||'');
        movements.push({date:dt.slice(0,10)||String(d.date||'').slice(0,10),time:cairoTimeFromStored(dt),kind:type,amount,title:type==='in'?'تحصيل من عميل':'سداد لمورد',detail:String(d.person||'حساب')+' • '+(h&&h.type==='full'?'سداد كامل':'سداد جزئي'),icon:type==='in'?'fa-hand-holding-dollar':'fa-money-bill-wave',ref:String(d.id||'')+'-'+i});
      });
    });
  }catch(e){
    console.error('خطأ في تجهيز بيانات الخزنة:',e);
  }
  movements.sort((a,b)=>String((b.date||'')+' '+(b.time||'')).localeCompare(String((a.date||'')+' '+(a.time||''))));
  return movements;
}
function getCashboxOpening(){return cashboxNum(currentUser&&currentUser.capital);}
function cashboxEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderCashboxPage(container){
  try{
    if(!container) throw new Error('منطقة عرض الخزنة غير موجودة');
    const t=today();
    container.innerHTML=`<div class="fade-in cashbox-page">
      <div class="cashbox-hero"><div><small>إدارة السيولة وحركة النقد</small><h2>💰 الخزنة</h2><p>اعرف رصيدك النقدي وحركة المقبوضات والمدفوعات في مكان واحد.</p></div><div class="cashbox-hero-icon"><i class="fas fa-vault"></i></div></div>

      <div class="cashbox-filter"><div class="cashbox-filter-row"><div><label>من تاريخ</label><input type="date" id="cashboxFrom" value="${t.slice(0,8)}01"></div><div><label>إلى تاريخ</label><input type="date" id="cashboxTo" value="${t}"></div><button type="button" onclick="renderCashboxData()"><i class="fas fa-filter"></i> تحديث</button></div></div>
      <div class="cashbox-section"><div class="cashbox-section-head"><h3><i class="fas fa-list" style="color:var(--primary);margin-left:5px"></i> حركة الخزنة</h3><small id="cashboxMovementCount">0 حركة</small></div><div id="cashboxMovements"></div></div>
    </div>`;
    renderCashboxData();
  }catch(e){
    console.error('خطأ في فتح الخزنة:',e);
    if(container) container.innerHTML='<div class="card" style="margin:20px;text-align:center;padding:30px"><div style="font-size:3rem">💰</div><h2 style="margin:10px 0">تعذر فتح الخزنة</h2><p style="color:var(--text-light)">تم تحميل البرنامج، لكن حدث خطأ بسيط أثناء قراءة حركة الخزنة.</p><button class="btn btn-primary" style="margin-top:15px" onclick="renderCashboxPage(document.getElementById(\'contentArea\'))">إعادة فتح الخزنة</button></div>';
  }
}
function renderCashboxData(){
  try{
    const from=document.getElementById('cashboxFrom')?.value||'';
    const to=document.getElementById('cashboxTo')?.value||today();
    const all=getCashboxData();
    const period=all.filter(m=>(!from||m.date>=from)&&(!to||m.date<=to));
    const allBeforeEnd=all.filter(m=>!to||m.date<=to);
    const opening=getCashboxOpening();
    const inPeriod=period.filter(m=>m.kind==='in').reduce((n,m)=>n+cashboxNum(m.amount),0);
    const outPeriod=period.filter(m=>m.kind==='out').reduce((n,m)=>n+cashboxNum(m.amount),0);
    const totalInToEnd=allBeforeEnd.filter(m=>m.kind==='in').reduce((n,m)=>n+cashboxNum(m.amount),0);
    const totalOutToEnd=allBeforeEnd.filter(m=>m.kind==='out').reduce((n,m)=>n+cashboxNum(m.amount),0);
    const balance=opening+totalInToEnd-totalOutToEnd;
    const balanceEl=document.getElementById('cashboxBalance'); if(balanceEl) balanceEl.textContent=fmt(balance);
    const inEl=document.getElementById('cashboxIn'); if(inEl) inEl.textContent=fmt(inPeriod);
    const outEl=document.getElementById('cashboxOut'); if(outEl) outEl.textContent=fmt(outPeriod);
    const net=inPeriod-outPeriod;
    const netEl=document.getElementById('cashboxNet'); if(netEl){netEl.textContent=fmt(net);netEl.style.color=net>=0?'#4b5fc5':'#c53b45';}
    const countEl=document.getElementById('cashboxMovementCount'); if(countEl) countEl.textContent=`${period.length} حركة`;
    const listEl=document.getElementById('cashboxMovements');
    if(listEl) listEl.innerHTML=period.map(m=>`<div class="cashbox-movement ${m.kind}"><div class="cashbox-movement-icon"><i class="fas ${cashboxEsc(m.icon||'fa-circle')}"></i></div><div class="cashbox-movement-main"><strong>${cashboxEsc(m.title)}</strong><small>${cashboxEsc(m.detail)} • ${cashboxEsc(m.date)}${m.time?' • '+cashboxEsc(m.time):''}</small></div><div class="cashbox-movement-amount">${m.kind==='in'?'+':'−'} ${fmt(m.amount)}</div></div>`).join('')||'<div class="cashbox-empty"><i class="fas fa-box-open" style="font-size:1.6rem;display:block;margin-bottom:7px"></i>لا توجد حركات نقدية في الفترة المحددة</div>';
  }catch(e){
    console.error('خطأ في تحديث الخزنة:',e);
    const listEl=document.getElementById('cashboxMovements');
    if(listEl) listEl.innerHTML='<div class="cashbox-empty">تعذر قراءة حركات الخزنة حاليًا.</div>';
  }
}

function addDebt(){
  const person=document.getElementById('dPerson').value.trim();
  const amount=parseFloat(document.getElementById('dAmount').value)||0;
  if(!person||amount<=0)return showToast('أكمل البيانات','warning');
  Store.add('debts',{
    date:document.getElementById('dDate').value||today(),
    person,
    type:document.getElementById('dType').value,
    amount,
    paidAmount:0,
    paymentHistory:[],
    debtVersion:2,
    due:document.getElementById('dDue').value,
    note:document.getElementById('dNote').value,
    paid:false
  });
  showToast('✅ تم التسجيل');
  ['dPerson','dAmount','dDue','dNote'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  renderDebtsList();
}

function renderDebtsList(){
  const allDebts=Store.get('debts')||[];
  const search=(document.getElementById('debtSearch')?.value||'').trim().toLowerCase();
  const type=(document.getElementById('debtTypeFilter')?.value||'');
  const filtered=allDebts.filter(d=>(
    (!search||String(d.person||'').toLowerCase().includes(search))&&(!type||d.type===type)
  ));

  const active=allDebts.filter(d=>getDebtRemaining(d)>0);
  const totalOwedToUs=active.filter(d=>d.type==='لنا').reduce((n,d)=>n+getDebtRemaining(d),0);
  const totalWeOwe=active.filter(d=>d.type==='علينا').reduce((n,d)=>n+getDebtRemaining(d),0);
  const totalActive=totalOwedToUs+totalWeOwe;
  const stats=document.getElementById('debtsStats');
  if(stats)stats.innerHTML=`
    <div class="debts-pro-stat"><strong>${fmt(totalOwedToUs)}</strong><span>لنا</span></div>
    <div class="debts-pro-stat"><strong>${fmt(totalWeOwe)}</strong><span>علينا</span></div>
    <div class="debts-pro-stat"><strong>${fmt(totalActive)}</strong><span>إجمالي المتبقي</span></div>`;

  const groups={};
  filtered.forEach(d=>{
    const key=String(d.type||'')+'|'+String(d.person||'').trim().toLowerCase();
    if(!groups[key])groups[key]={person:d.person,type:d.type,items:[]};
    groups[key].items.push(d);
  });

  const list=document.getElementById('debtsList');
  if(!list)return;

  const groupArray=Object.values(groups).sort((a,b)=>{
    const ar=a.items.reduce((n,d)=>n+getDebtRemaining(d),0);
    const br=b.items.reduce((n,d)=>n+getDebtRemaining(d),0);
    return br-ar;
  });

  list.innerHTML=groupArray.map((g,gi)=>{
    const groupRemaining=g.items.reduce((n,d)=>n+getDebtRemaining(d),0);
    const groupOriginal=g.items.reduce((n,d)=>n+Number(d.amount||0),0);
    const groupPaid=g.items.reduce((n,d)=>n+(Number(d.amount||0)-getDebtRemaining(d)),0);
    const phone=(g.items.find(d=>d.phone)?.phone)||'';
    const detailKey=encodeURIComponent((g.type||'')+'|'+(g.person||'')).replace(/%/g,'_');

    // التراجع لا يظهر للحساب المسدد بالكامل.
    const groupPayments=[];
    g.items.forEach(d=>(Array.isArray(d.paymentHistory)?d.paymentHistory:[]).forEach(h=>{
      if(h.groupId)groupPayments.push({groupId:h.groupId,date:h.date});
    }));
    groupPayments.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const canUndoGroup=groupRemaining>0 && groupPayments.length>0;
    const latestGroupId=canUndoGroup?groupPayments[0].groupId:'';

    const details=g.items.map(d=>{
      const remaining=getDebtRemaining(d);
      const original=Math.max(0,Number(d.amount||0));
      const paid=Math.max(0,original-remaining);
      const now=cairoDateISO();
      const isOverdue=d.due&&d.due<now&&remaining>0;
      return `<div class="debt-group-detail compact-detail" style="${isOverdue?'border-right-color:var(--warning)':''}">
        <div class="debt-group-detail-main">
          <div><strong>${d.invoiceNo?`فاتورة ${d.invoiceNo}`:(d.note||'حركة دين')}</strong></div>
          <div class="debt-meta">${d.date||''} ${isOverdue?'<span style="color:var(--warning)">⚠️ متأخر</span>':''}</div>
          <div class="debt-balance-line">الدين ${fmt(original)} • مدفوع ${fmt(paid)} • <b>متبقي ${fmt(remaining)}</b></div>
        </div>
      </div>`;
    }).join('');

    return `<div class="debt-card debt-group-card compact-debt-card ${groupRemaining<=0?'paid':''}">
      <div class="debt-info compact-debt-info">
        <div class="debt-person">${g.person} ${g.type==='علينا'?'📤':'📥'}</div>
        <div class="debt-group-summary">
          <strong>${groupRemaining>0?fmt(groupRemaining):'0 ج.م'}</strong>
          <span>${groupRemaining>0?`${g.items.length} ${g.items.length===1?'فاتورة':'فواتير'} • مدفوع ${fmt(groupPaid)}`:'مسدد بالكامل ✓'}</span>
        </div>
      </div>

      ${groupRemaining>0?`
      <div class="debt-group-account-actions compact-actions">
        <button class="btn btn-sm btn-success" onclick="openGroupDebtPayment('${encodeURIComponent(g.person)}','${g.type}')">💳 سداد جزء</button>
        <button class="btn btn-sm btn-primary" onclick="payGroupDebtFull('${encodeURIComponent(g.person)}','${g.type}')">✅ سداد كامل</button>
      </div>`:''}

      ${canUndoGroup?`
      <button class="btn btn-sm btn-outline debt-group-undo compact-undo" onclick="undoGroupDebtPayment('${encodeURIComponent(g.person)}','${g.type}','${latestGroupId}')">↩️ تراجع عن آخر سداد</button>`:''}

      <div class="debt-detail-toggle-row">
        <button id="debtDetailsBtn-${detailKey}" class="debt-detail-toggle" onclick="toggleDebtGroupDetails('${detailKey}')">تفاصيل الحساب ↓</button>
        ${phone?`<button class="debt-whatsapp-mini" title="إرسال الحساب على واتساب" onclick="openWhatsApp('${phone}',debtShareMessage('${String(g.person).replace(/'/g,"\\\\'")}',${groupRemaining},'${g.type}'))"><i class="fab fa-whatsapp"></i></button>`:''}
      <button class="debt-delete-mini" title="حذف الحساب" onclick="deleteDebtGroup('${encodeURIComponent(g.person)}','${g.type}')"><i class="fas fa-trash"></i></button>
      </div>

      <div id="debtDetails-${detailKey}" class="debt-group-details collapsible-debt-details">
        ${details}
      </div>
    </div>`;
  }).join('')||'<div class="empty-state"><i class="fas fa-clipboard-check"></i><p>لا يوجد ديون مطابقة</p></div>';
}

function deleteDebtGroup(encodedPerson,type){
  const person=decodeURIComponent(encodedPerson);
  const debts=Store.get('debts')||[];
  const matches=debts.filter(d=>d.type===type&&String(d.person||'').trim().toLowerCase()===String(person||'').trim().toLowerCase());
  if(!matches.length)return showToast('الحساب غير موجود','warning');

  const hasBalance=matches.some(d=>getDebtRemaining(d)>0);
  const msg=hasBalance
    ? `سيتم حذف حساب ${person} بالكامل بكل فواتيره وحركاته. هل أنت متأكد؟`
    : `سيتم حذف سجل حساب ${person} بالكامل. هل أنت متأكد؟`;
  if(!confirm(msg))return;

  matches.forEach(d=>Store.remove('debts',d.id));
  showToast(`🗑️ تم حذف حساب ${person}`);
  renderDebtsList();
}

function getDebtGroup(person,type){
  const key=String(person||'').trim().toLowerCase();
  return (Store.get('debts')||[]).filter(d=>
    d.type===type && String(d.person||'').trim().toLowerCase()===key && getDebtRemaining(d)>0
  ).sort((a,b)=>{
    const ad=String(a.date||'9999-99-99'),bd=String(b.date||'9999-99-99');
    return ad.localeCompare(bd);
  });
}

function syncSaleBatchFromDebt(d, paidAfter){
  if(!d || d.type!=='لنا' || d.source!=='sale' || !d.saleBatchId)return;
  const sales=Store.get('sales')||[];
  const batch=sales.filter(s=>String(s.saleBatchId||'')===String(d.saleBatchId));
  if(!batch.length)return;
  const batchTotal=batch.reduce((n,s)=>n+Number(s.total||0),0);
  const basePaid=Math.max(0,Number(d.saleTotal||batchTotal)-Number(d.amount||0));
  const paid=Math.min(batchTotal,Math.max(0,basePaid+Number(paidAfter||0)));
  const remaining=Math.max(0,batchTotal-paid);
  batch.forEach(s=>Store.update('sales',s.id,{paid,remaining}));
}

function applyGroupDebtPayment(person,type,amount,isFull){
  const debts=Store.get('debts')||[];
  const items=getDebtGroup(person,type);
  const total=items.reduce((n,d)=>n+getDebtRemaining(d),0);
  amount=Number(amount)||0;
  if(amount<=0)return showToast('أدخل مبلغ السداد','warning');
  if(amount>total+0.0001){
  return showToast(`مبلغ السداد لا يمكن أن يتجاوز إجمالي الحساب (${fmt(total)})`,'warning');
}

  const groupId='PAY-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  let left=amount;
  const now=cairoDateTimeISO();

  for(const d of items){
    if(left<=0)break;
    const rem=getDebtRemaining(d);
    const pay=Math.min(rem,left);
    if(pay<=0)continue;

    const isLegacySource=(d.debtVersion!==2&&(d.source==='purchase'||d.source==='sale'));
    const paidBefore=isLegacySource?0:Math.max(0,Number(d.paidAmount||0));
    const paidAfter=paidBefore+pay;
    const history=Array.isArray(d.paymentHistory)?d.paymentHistory.slice():[];
    history.push({amount:pay,date:now,type:pay>=rem?'full':'partial',groupId});
    Store.update('debts',d.id,{
      paidAmount:paidAfter,
      paid:paidAfter>=Number(d.amount||0)-0.0001,
      paymentHistory:history,
      debtVersion:2,
      lastPaymentAt:now
    });
    syncSaleBatchFromDebt(d,paidAfter);
    left-=pay;
  }

  closeModal();
  showToast(isFull?'✅ تم سداد الحساب بالكامل':'✅ تم تسجيل السداد وتوزيعه على الفواتير');
  renderDebtsList();
}

function undoGroupDebtPayment(encodedPerson,type,groupId){
  const person=decodeURIComponent(encodedPerson);
  const debts=Store.get('debts')||[];
  let changed=0;

  debts.filter(d=>d.type===type&&String(d.person||'').trim().toLowerCase()===String(person||'').trim().toLowerCase())
    .forEach(d=>{
      const history=Array.isArray(d.paymentHistory)?d.paymentHistory.slice():[];
      const entries=history.filter(h=>h.groupId===groupId);
      if(!entries.length)return;
      const amount=entries.reduce((n,h)=>n+Number(h.amount||0),0);
      const remainingHistory=history.filter(h=>h.groupId!==groupId);
      const paidAfter=Math.max(0,Number(d.paidAmount||0)-amount);
      Store.update('debts',d.id,{
        paidAmount:paidAfter,
        paid:false,
        paymentHistory:remainingHistory,
        lastPaymentAt:remainingHistory.length?remainingHistory[remainingHistory.length-1].date:null,
        debtVersion:2
      });
      syncSaleBatchFromDebt(d,paidAfter);
      changed++;
    });

  showToast(changed?'↩️ تم التراجع عن آخر سداد للحساب':'لا يوجد سداد يمكن التراجع عنه','info');
  renderDebtsList();
}

function confirmDebtPayment(id){

}

function payDebtPart(id,amount){
  const debts=Store.get('debts')||[];
  const d=debts.find(x=>x.id===id);
  if(!d)return;
  const remaining=getDebtRemaining(d);
  amount=Number(amount)||0;
  if(amount<=0)return showToast('أدخل مبلغ السداد','warning');
  if(amount>remaining+0.0001)return showToast('مبلغ السداد أكبر من المتبقي','warning');

  const isSaleDebt=d.type==='لنا' && d.source==='sale' && d.saleBatchId;
  const isLegacySource=(d.debtVersion!==2&&(d.source==='purchase'||d.source==='sale'));
  const paidBefore=isLegacySource?0:Math.max(0,Number(d.paidAmount||0));
  const paidAfter=paidBefore+amount;
  const history=Array.isArray(d.paymentHistory)?d.paymentHistory.slice():[];
  const now=cairoDateTimeISO();
  history.push({amount,date:now,type:amount>=remaining?'full':'partial'});

  // مزامنة تحصيل الدين مع الفاتورة الأصلية في سجل المبيعات.
  syncSaleBatchFromDebt(d,paidAfter);

  const remainingAfter=Math.max(0, remaining-(Number(document.getElementById('debtPayAmount')?.value)||0));
  const actualRemaining=Math.max(0, remaining-Number(history[history.length-1]?.amount||0));
  Store.update('debts',id,{
    paidAmount:paidAfter,
    paid:paidAfter>=Number(d.amount||0)-0.0001,
    paymentHistory:history,
    debtVersion:2,
    lastPaymentAt:now
  });
  closeModal();
  const isFullyPaid=actualRemaining<=0.0001;
  showToast(isFullyPaid
    ? `🎉 تم سداد الحساب بالكامل — المتبقي: ${fmt(actualRemaining)}`
    : `✅ تم تسجيل السداد بنجاح — تم تحصيل ${fmt(history[history.length-1]?.amount||0)} — المتبقي: ${fmt(actualRemaining)}`
  );
  renderDebtsList();
  if(typeof renderSalesTable==='function')renderSalesTable();
}

function undoLastDebtPayment(id){
  const debts=Store.get('debts')||[];
  const d=debts.find(x=>x.id===id);
  if(!d)return;
  const history=Array.isArray(d.paymentHistory)?d.paymentHistory.slice():[];
  if(history.length){
    const last=history.pop();
    const paidAfter=Math.max(0,Number(d.paidAmount||0)-Number(last.amount||0));
    Store.update('debts',id,{paidAmount:paidAfter,paid:false,paymentHistory:history,lastPaymentAt:history.length?history[history.length-1].date:null,debtVersion:2});
    syncSaleBatchFromDebt(d,paidAfter);
    showToast('↩️ تم التراجع عن آخر سداد');
  }else if(d.paid){
    Store.update('debts',id,{paid:false,paidAmount:0,paymentHistory:[],lastPaymentAt:null,debtVersion:2});
    showToast('↩️ تم التراجع عن السداد');
  }else{
    showToast('لا يوجد سداد يمكن التراجع عنه','info');
  }
  renderDebtsList();
}

function toggleDebt(id,currentPaid){
  if(currentPaid)return undoLastDebtPayment(id);
  const d=(Store.get('debts')||[]).find(x=>x.id===id);
  if(d)openDebtPayment(id);
}
function deleteDebt(id){if(!confirm('حذف الدين؟'))return;Store.delete('debts',id);showToast('🗑️ تم الحذف');renderDebtsList();}


function getDebtRemaining(d){
  if(!d)return 0;
  if(d.paid)return 0;
  const amount=Math.max(0,Number(d.amount||0));
  const isLegacySource=(d.debtVersion!==2&&(d.source==='purchase'||d.source==='sale'));
  const paidAmount=isLegacySource?0:Math.max(0,Number(d.paidAmount||0));
  return Math.max(0,amount-paidAmount);
}
function normalizeWhatsAppPhone(phone){
  let p=String(phone||'').replace(/[^\d+]/g,'');
  if(p.startsWith('+20'))p=p.slice(1);
  else if(p.startsWith('0020'))p=p.slice(2);
  else if(p.startsWith('0'))p='20'+p.slice(1);
  return p;
}
function openWhatsApp(phone,message){
  const p=normalizeWhatsAppPhone(phone);
  if(!p || p.length<11)return showToast('أضف رقم هاتف صحيح أولاً','warning');
  const url='https://wa.me/'+p+'?text='+encodeURIComponent(message||'');
  window.open(url,'_blank');
}
function debtShareMessage(name,remaining,type){
  // "علينا" = نحن مدينون للطرف الآخر، لذلك المبلغ مستحق له.
  const relation=type==='علينا'?'المبلغ المستحق لكم':'المبلغ المتبقي عليك';
  return `السلام عليكم ${name}،

ده ملخص حسابك لدى كنوز الطبيعة:
${relation}: ${fmt(remaining)}

لو محتاج تفاصيل الحساب أنا تحت أمرك.`;
}

function getCustomerFinancials(customer){
  const sales=Store.get('sales')||[];
  const debts=Store.get('debts')||[];
  const customerId=String(customer.id);
  const customerName=String(customer.name||'').trim().toLowerCase();

  const lines=sales.filter(s=>{
    if(s.customerId && String(s.customerId)===customerId)return true;
    return !s.customerId&&String(s.customerName||'').trim().toLowerCase()===customerName;
  });
  const batches={};
  lines.forEach(s=>{
    const key=s.saleBatchId||s.invoiceNo||s.id;
    if(!batches[key])batches[key]={total:0,paid:0,remaining:0,date:s.date,invoiceNo:s.invoiceNo||key,saleBatchId:s.saleBatchId};
    batches[key].total=Math.max(batches[key].total,Number(s.total||0));
    batches[key].paid=Math.max(batches[key].paid,Number(s.paid||0));
    batches[key].remaining=Math.max(batches[key].remaining,Number(s.remaining||0));
    batches[key].date=s.date||batches[key].date;
    batches[key].invoiceNo=s.invoiceNo||batches[key].invoiceNo;
    batches[key].saleBatchId=s.saleBatchId||batches[key].saleBatchId;
  });
  const invoices=Object.values(batches).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));

  const linkedDebts=debts.filter(d=>d.type==='لنا'&&d.source==='sale'&&(
    String(d.person||'').trim().toLowerCase()===customerName||
    (d.customerId&&String(d.customerId)===customerId)
  ));
  const debtByKey={};
  linkedDebts.forEach(d=>{
    const key=String(d.saleBatchId||d.invoiceNo||'');
    if(key)debtByKey[key]=d;
  });

  let invoiceOutstanding=0;
  invoices.forEach(inv=>{
    const key=String(inv.saleBatchId||inv.invoiceNo||'');
    const debt=debtByKey[key];
    invoiceOutstanding+=debt?getDebtRemaining(debt):Math.max(0,Number(inv.remaining||0));
  });

  const manualDebtRemaining=debts.filter(d=>d.type==='لنا'&&d.source!=='sale'&&(
    String(d.person||'').trim().toLowerCase()===customerName||
    (d.customerId&&String(d.customerId)===customerId)
  )).reduce((n,d)=>n+getDebtRemaining(d),0);

  const totalSpent=invoices.reduce((n,x)=>n+Number(x.total||0),0);
  const paid=Math.max(0,totalSpent-invoiceOutstanding);
  return {lines,invoices,totalSpent,paid,remaining:invoiceOutstanding+manualDebtRemaining,linkedDebts};
}

function getSupplierFinancials(supplier){
  const purchases=Store.get('purchases')||[];
  const debts=Store.get('debts')||[];
  const supplierId=String(supplier.id);
  const supplierName=String(supplier.name||'').trim().toLowerCase();

  const rows=purchases.filter(p=>{
    if(p.supplierId&&String(p.supplierId)===supplierId)return true;
    return !p.supplierId&&String(p.supplier||p.supplierName||'').trim().toLowerCase()===supplierName;
  });
  const batches={};
  rows.forEach(p=>{
    const key=p.purchaseBatchId||p.invoiceNo||p.id;
    if(!batches[key])batches[key]={total:0,paid:0,remaining:0,date:p.date,invoiceNo:p.invoiceNo||key,purchaseBatchId:p.purchaseBatchId};
    batches[key].total=Math.max(batches[key].total,Number(p.total||p.cost||p.amount||0));
    batches[key].paid=Math.max(batches[key].paid,Number(p.paid||0));
    batches[key].remaining=Math.max(batches[key].remaining,Number(p.remaining||0));
    batches[key].date=p.date||batches[key].date;
    batches[key].invoiceNo=p.invoiceNo||batches[key].invoiceNo;
    batches[key].purchaseBatchId=p.purchaseBatchId||batches[key].purchaseBatchId;
  });
  const invoices=Object.values(batches).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));

  const linkedDebts=debts.filter(d=>d.type==='علينا'&&d.source==='purchase'&&(
    String(d.person||'').trim().toLowerCase()===supplierName||
    (d.supplierId&&String(d.supplierId)===supplierId)
  ));
  const debtByKey={};
  linkedDebts.forEach(d=>{
    const key=String(d.purchaseBatchId||d.invoiceNo||'');
    if(key)debtByKey[key]=d;
  });

  let invoiceOutstanding=0;
  invoices.forEach(inv=>{
    const key=String(inv.purchaseBatchId||inv.invoiceNo||'');
    const debt=debtByKey[key];
    invoiceOutstanding+=debt?getDebtRemaining(debt):Math.max(0,Number(inv.remaining||0));
  });

  const manualDebts=debts.filter(d=>d.type==='علينا'&&d.source!=='purchase'&&(
    String(d.person||'').trim().toLowerCase()===supplierName||
    (d.supplierId&&String(d.supplierId)===supplierId)
  ));
  const manualDebtRemaining=manualDebts.reduce((n,d)=>n+getDebtRemaining(d),0);
  const totalPurchased=invoices.reduce((n,x)=>n+Number(x.total||0),0);
  const paid=Math.max(0,totalPurchased-invoiceOutstanding);
  const remaining=invoiceOutstanding+manualDebtRemaining;
  return {rows,invoices,totalPurchased,paid,remaining,linkedDebts,manualDebts};
}

    (d.supplierId&&String(d.supplierId)===String(supplierId)) ||
    (!d.supplierId&&String(d.person||'').trim().toLowerCase()===name)
  )).filter(d=>getDebtRemaining(d)>0)
  .sort((a,b)=>String(a.date||'9999-99-99').localeCompare(String(b.date||'9999-99-99')));
}

function getSupplierLastPaymentGroup(supplierId){
  const supplier=(Store.get('suppliers')||[]).find(s=>String(s.id)===String(supplierId));
  if(!supplier)return '';
  const name=String(supplier.name||'').trim().toLowerCase();
  const groups=[];
  (Store.get('debts')||[]).filter(d=>d.type==='علينا'&&(
    (d.supplierId&&String(d.supplierId)===String(supplierId)) ||
    (!d.supplierId&&String(d.person||'').trim().toLowerCase()===name)
  )).forEach(d=>(Array.isArray(d.paymentHistory)?d.paymentHistory:[]).forEach(h=>{
    if(h.groupId)groups.push({groupId:h.groupId,date:h.date});
  }));
  groups.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));

function paySupplierFull(supplierId){
  const items=getSupplierDebtItems(supplierId);
  const remaining=items.reduce((n,d)=>n+getDebtRemaining(d),0);
  const supplier=(Store.get('suppliers')||[]).find(s=>String(s.id)===String(supplierId));
  if(!supplier||remaining<=0)return showToast('الحساب مسدد بالكامل','info');
  if(!confirm(`تأكيد سداد كامل حساب ${supplier.name} بمبلغ ${fmt(remaining)}؟`))return;
  applySupplierPayment(supplierId,remaining);
}

function applySupplierPayment(supplierId,amount){
  const items=getSupplierDebtItems(supplierId);
  const total=items.reduce((n,d)=>n+getDebtRemaining(d),0);
  amount=Number(amount)||0;
  if(amount<=0)return showToast('أدخل مبلغ السداد','warning');
  if(amount>total+0.0001)return showToast(`مبلغ السداد لا يمكن أن يتجاوز إجمالي الحساب (${fmt(total)})`,'warning');

  const groupId='SUPPAY-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  let left=amount;
  const now=cairoDateTimeISO();

  for(const d of items){
    if(left<=0)break;
    const rem=getDebtRemaining(d);
    const pay=Math.min(rem,left);
    const history=Array.isArray(d.paymentHistory)?d.paymentHistory.slice():[];
    history.push({amount:pay,date:now,type:pay>=rem?'full':'partial',groupId});
    const paidBefore=Math.max(0,Number(d.paidAmount||0));
    const paidAfter=paidBefore+pay;
    Store.update('debts',d.id,{
      paidAmount:paidAfter,
      paid:paidAfter>=Number(d.amount||0)-0.0001,
      paymentHistory:history,
      debtVersion:2,
      lastPaymentAt:now
    });
    left-=pay;
  }

  closeModal();
  showToast('✅ تم تسجيل السداد وتوزيعه على فواتير المورد');
  renderSuppliersPage(document.getElementById('contentArea'));
}

function undoSupplierLastPayment(supplierId){
  const groupId=getSupplierLastPaymentGroup(supplierId);
  if(!groupId)return showToast('لا يوجد سداد يمكن التراجع عنه','info');
  const supplier=(Store.get('suppliers')||[]).find(s=>String(s.id)===String(supplierId));
  if(!supplier)return;
  if(!confirm(`التراجع عن آخر سداد مسجل للمورد ${supplier.name}؟`))return;

  const name=String(supplier.name||'').trim().toLowerCase();
  let changed=0;
  (Store.get('debts')||[]).filter(d=>d.type==='علينا'&&(
    (d.supplierId&&String(d.supplierId)===String(supplierId)) ||
    (!d.supplierId&&String(d.person||'').trim().toLowerCase()===name)
  )).forEach(d=>{
    const history=Array.isArray(d.paymentHistory)?d.paymentHistory.slice():[];
    const entries=history.filter(h=>h.groupId===groupId);
    if(!entries.length)return;
    const amount=entries.reduce((n,h)=>n+Number(h.amount||0),0);
    const remainingHistory=history.filter(h=>h.groupId!==groupId);
    const paidAfter=Math.max(0,Number(d.paidAmount||0)-amount);
    Store.update('debts',d.id,{
      paidAmount:paidAfter,
      paid:false,
      paymentHistory:remainingHistory,
      lastPaymentAt:remainingHistory.length?remainingHistory[remainingHistory.length-1].date:null,
      debtVersion:2
    });
    changed++;
  });
  showToast(changed?'↩️ تم التراجع عن آخر سداد':'لا يوجد سداد يمكن التراجع عنه','info');
  renderSuppliersPage(document.getElementById('contentArea'));
}

function updateOfferPreview(){
  const discount=Math.max(0,Number(document.getElementById('oDiscount')?.value||0));
  const productId=document.getElementById('oProduct')?.value||'';
  const products=Store.get('products')||[];
  const p=products.find(x=>String(x.id)===String(productId));
  const baseEl=document.getElementById('oBasePrice');
  const base=Number(baseEl?.value|| (p?.retail||0));
  if(baseEl && p && !baseEl.value) baseEl.value=Number(p.retail||0);
  const pct=base>0?Math.min(100,(discount/base)*100):0;
  const final=Math.max(0,base-discount);
  const pe=document.getElementById('oDiscountPercent'); if(pe)pe.value=`${pct.toFixed(2)}%`;
  const fe=document.getElementById('oOfferPrice'); if(fe)fe.value=base>0?fmt(final):'-';
  const box=document.getElementById('offerPreviewBox');
  if(box) box.innerHTML=base>0 && discount>0 ? `🏷️ خصم <strong>${fmt(discount)}</strong> = <strong>${pct.toFixed(2)}%</strong> من ${fmt(base)} → السعر بعد الخصم <strong>${fmt(final)}</strong>` : 'أدخل قيمة الخصم واختر الصنف لعرض النسبة والسعر بعد الخصم.';
}
function addOffer(){
  const name=document.getElementById('oName').value.trim();
  const discount=Math.max(0,Number(document.getElementById('oDiscount').value||0));
  const productId=document.getElementById('oProduct').value||null;
  if(!name||discount<=0)return showToast('أكمل اسم العرض وقيمة الخصم','warning');
  Store.add('offers',{name,productId,discountValue:discount,discount:discount,startDate:document.getElementById('oStart').value||today(),endDate:document.getElementById('oEnd').value||null,note:document.getElementById('oNote').value,active:true});
  showToast('✅ تم إضافة العرض وتفعيله في المبيعات');
  renderOffersPage(document.getElementById('contentArea'));
}
function renderOffersList(){
  const offers=Store.get('offers')||[];
  const products=Store.get('products')||[];
  const now=today();
  document.getElementById('offersList').innerHTML=offers.map(o=>{
    const isActive=o.active!==false&&(!o.startDate||o.startDate<=now)&&(!o.endDate||o.endDate>=now);
    const productName=o.productId?(products.find(p=>String(p.id)===String(o.productId))?.name||'الصنف غير موجود'):'كل الأصناف';
    const base=o.productId?(Number(products.find(p=>String(p.id)===String(o.productId))?.retail||0)):0;
    const d=Math.max(0,Number(o.discountValue!=null?o.discountValue:o.discount)||0);
    const pct=base>0?Math.min(100,d/base*100):null;
    const final=base>0?Math.max(0,base-d):null;
    return `<div class="offer-card ${isActive?'active':''}">
      <div class="offer-title">${o.name} ${isActive?'<span style="color:var(--success)">● نشط</span>':'<span style="color:var(--text-muted)">● غير نشط/منتهي</span>'}</div>
      <div class="offer-details">📦 ${productName} | 📅 ${o.startDate||'-'} ${o.endDate?' إلى '+o.endDate:''}</div>
      <div class="offer-discount">خصم ${fmt(d)}${pct!==null?` · ${pct.toFixed(2)}%`:''}</div>
      ${base>0?`<div class="offer-details">💰 ${fmt(base)} → ${fmt(final)}</div>`:''}
      <div style="margin-top:10px;display:flex;gap:6px">
        <button class="btn btn-sm ${o.active?'btn-danger':'btn-success'}" onclick="toggleOffer('${o.id}',${o.active!==false})">${o.active?'إيقاف':'تفعيل'}</button>
        <button class="btn btn-sm btn-danger" onclick="deleteOffer('${o.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>`;
  }).join('')||'<div class="empty-state"><i class="fas fa-tags"></i><p>لا يوجد عروض</p></div>';
}
function toggleOffer(id,currentActive){Store.update('offers',id,{active:!currentActive});showToast(!currentActive?'✅ تم التفعيل وتطبيق العرض في المبيعات':'⏹️ تم إيقاف العرض');renderOffersList();}

function loadSummary(){
  const month=document.getElementById('summaryMonth')?.value||today().slice(0,7);
  const sales=Store.get('sales');
  const purchases=Store.get('purchases');
  const expenses=Store.get('expenses');
  const withdrawals=Store.get('withdrawals');
  const debts=Store.get('debts');
  const products=Store.get('products');
  const customers=Store.get('customers');

  const inMonth=d=>d.startsWith(month);

  const mSales=sales.filter(s=>inMonth(s.date));
  const mPurchases=purchases.filter(p=>inMonth(p.date));
  const mExpenses=expenses.filter(e=>inMonth(e.date));
  const mWithdrawals=withdrawals.filter(w=>inMonth(w.date));

  const totalSales=mSales.reduce((sum,s)=>sum+(s.total||0),0);
  const totalProfit=mSales.reduce((sum,s)=>sum+(s.profit||0),0);
  const totalPurchases=mPurchases.reduce((sum,p)=>sum+(p.total||0),0);
  const totalExpenses=mExpenses.reduce((sum,e)=>sum+(e.amount||0),0);
  const totalWithdrawals=mWithdrawals.reduce((sum,w)=>sum+(w.amount||0),0);
  const totalDiscounts=mSales.reduce((sum,s)=>sum+((s.price*s.qty)-(s.total||0)),0);

  const debtsOnUs=debts.filter(d=>d.type==='علينا'&&!d.paid).reduce((sum,d)=>sum+(d.amount||0),0);
  const debtsForUs=debts.filter(d=>d.type==='لنا'&&!d.paid).reduce((sum,d)=>sum+(d.amount||0),0);
  const netDebts=debtsForUs-debtsOnUs;

  const inventoryValue=products.reduce((sum,p)=>sum+((p.qty||0)*(p.purchase||0)),0);

  const initialCapital=currentUser?.capital||0;
  const capital=initialCapital>0?initialCapital:totalPurchases+inventoryValue;

  const netProfit=totalProfit-totalExpenses;

  document.getElementById('sumCapital').textContent=fmt(capital);
  document.getElementById('sumInventory').textContent=fmt(inventoryValue);
  document.getElementById('sumSales').textContent=fmt(totalSales);
  document.getElementById('sumPurchases').textContent=fmt(totalPurchases);
  document.getElementById('sumExpenses').textContent=fmt(totalExpenses);
  document.getElementById('sumWithdrawals').textContent=fmt(totalWithdrawals);
  
  document.getElementById('sumDebts').textContent=fmt(netDebts);
  document.getElementById('sumDebts').style.color=netDebts>=0?'var(--success-light)':'var(--danger-light)';
  
  document.getElementById('sumTotalProfit').textContent=fmt(totalProfit);
  document.getElementById('sumTotalProfit').style.color=totalProfit>=0?'var(--success-light)':'var(--danger-light)';
  
  document.getElementById('sumNetProfit').textContent=fmt(netProfit);
  document.getElementById('sumNetProfit').style.color=netProfit>=0?'#fbbf24':'#f87171';

  document.getElementById('sumSaleCount').textContent=mSales.length;
  document.getElementById('sumAvgSale').textContent=fmt(mSales.length?totalSales/mSales.length:0);
  document.getElementById('sumProfitPercent').textContent=totalSales>0?((totalProfit/totalSales)*100).toFixed(1)+'%':'0%';
  document.getElementById('sumTotalDiscounts').textContent=fmt(totalDiscounts);

  const ps={};
  mSales.forEach(s=>{ps[s.productName]=(ps[s.productName]||0)+(s.total||0)});
  const top=Object.entries(ps).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('sumTopProduct').textContent=top?top[0]:'-';

  const cs={};
  mSales.filter(s=>s.customerName).forEach(s=>{cs[s.customerName]=(cs[s.customerName]||0)+(s.total||0)});
  const topC=Object.entries(cs).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('sumTopCustomer').textContent=topC?topC[0]+' ('+fmt(topC[1])+')':'-';
}

const THEME_PRESETS={
  green:{name:'زمردي فاخر',primary:'#0b6b63',primaryDark:'#064e4a',primaryLight:'#14b8a6',accent:'#d4af37',accentLight:'#f4d35e'},
  blue:{name:'أزرق ملكي',primary:'#1d4ed8',primaryDark:'#173ea5',primaryLight:'#60a5fa',accent:'#f59e0b',accentLight:'#fbbf24'},
  purple:{name:'بنفسجي فاخر',primary:'#6d28d9',primaryDark:'#4c1d95',primaryLight:'#a78bfa',accent:'#f59e0b',accentLight:'#fbbf24'},
  orange:{name:'برتقالي حيوي',primary:'#c2410c',primaryDark:'#9a3412',primaryLight:'#fb923c',accent:'#0f766e',accentLight:'#2dd4bf'},
  red:{name:'أحمر ملكي',primary:'#b91c1c',primaryDark:'#7f1d1d',primaryLight:'#f87171',accent:'#d4af37',accentLight:'#f4d35e'},
  teal:{name:'تركواز لامع',primary:'#087f8c',primaryDark:'#065f69',primaryLight:'#22d3ee',accent:'#7c3aed',accentLight:'#a78bfa'}
};
function getThemeSettings(){
  const s=getAppSettings();
  return {mode:s.themeMode||'light',preset:s.themePreset||'green',primary:s.themePrimary||'',accent:s.themeAccent||''};
}
function hexToRgb(hex){
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return '15,118,110';
  return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16);
}
function applyAppTheme(){
  const t=getThemeSettings();
  const preset=THEME_PRESETS[t.preset]||THEME_PRESETS.green;
  const primary=t.primary||preset.primary;
  const accent=t.accent||preset.accent;
  const root=document.documentElement;
  root.setAttribute('data-theme',t.mode==='dark'?'dark':'light');
  root.style.setProperty('--primary',primary);
  root.style.setProperty('--primary-dark',t.primary && t.primaryDark ? t.primaryDark : preset.primaryDark);
  root.style.setProperty('--primary-light',t.primary && t.primaryLight ? t.primaryLight : preset.primaryLight);
  root.style.setProperty('--accent',accent);
  root.style.setProperty('--accent-light',t.accent && t.accentLight ? t.accentLight : preset.accentLight);
  root.style.setProperty('--primary-rgb',hexToRgb(primary));
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content',primary);
}
function getThemeSummary(){
  const t=getThemeSettings();
  const preset=THEME_PRESETS[t.preset]||THEME_PRESETS.green;
  return (t.mode==='dark'?'🌙 داكن':'☀️ فاتح')+' • '+(t.primary&&t.accent?'ألوان مخصصة':preset.name);
}
function saveThemeSettings(mode,preset,primary,accent){
  const s=getAppSettings();
  s.themeMode=mode==='dark'?'dark':'light';
  s.themePreset=THEME_PRESETS[preset]?preset:'green';
  s.themePrimary=primary||'';
  s.themeAccent=accent||'';
  saveAppSettings(s);
  applyAppTheme();
}
function openThemeSettings(){
  const t=getThemeSettings();
  const preset=THEME_PRESETS[t.preset]||THEME_PRESETS.green;
  const primary=t.primary||preset.primary;
  const accent=t.accent||preset.accent;
  const choices=Object.entries(THEME_PRESETS).map(([key,p])=>`<button type="button" class="theme-choice ${t.preset===key?'active':''}" onclick="selectThemePreset('${key}')"><span class="theme-swatch" style="background:linear-gradient(135deg,${p.primary},${p.accent})"></span>${p.name}</button>`).join('');
  openModal(`
    <div class="card-title"><i class="fas fa-palette"></i> مظهر وألوان البرنامج</div>
    <div class="settings-note">اختار شكل البرنامج واللون الذي يناسبك. التغيير فوري ويتم حفظه تلقائيًا على الجهاز.</div>
    <div class="theme-palette">
      <button type="button" id="themeModeLight" class="theme-choice ${t.mode==='light'?'active':''}" onclick="setThemeMode('light')"><i class="fas fa-sun"></i> فاتح</button>
      <button type="button" id="themeModeDark" class="theme-choice ${t.mode==='dark'?'active':''}" onclick="setThemeMode('dark')"><i class="fas fa-moon"></i> داكن</button>
    </div>
    <div style="margin-top:16px;font-weight:900;font-size:.82rem;color:var(--text)">ألوان جاهزة</div>
    <div class="theme-palette">${choices}</div>
    <div style="margin-top:16px;font-weight:900;font-size:.82rem;color:var(--text)">ألوان مخصصة</div>
    <div class="theme-colors-grid">
      <div class="theme-color-field"><label>اللون الأساسي</label><input id="customPrimaryColor" type="color" value="${primary}" onchange="applyCustomThemeColors()"></div>
      <div class="theme-color-field"><label>اللون المساعد</label><input id="customAccentColor" type="color" value="${accent}" onchange="applyCustomThemeColors()"></div>
    </div>
    <div class="theme-current-preview"><span class="theme-preview-dot"></span><div><strong>المعاينة المباشرة</strong><span>سيتم حفظ الألوان تلقائيًا عند اختيارها.</span></div></div>
    <button class="btn btn-outline btn-block" style="margin-top:14px" onclick="resetAppTheme()"><i class="fas fa-rotate-left"></i> استعادة الألوان الأصلية</button>
    <button class="btn btn-primary btn-block" style="margin-top:8px" onclick="closeModal()"><i class="fas fa-check"></i> تم</button>
  `);
}
function setThemeMode(mode){
  const s=getAppSettings();
  s.themeMode=mode==='dark'?'dark':'light';
  saveAppSettings(s); applyAppTheme();
  openThemeSettings();
}
function selectThemePreset(key){
  const p=THEME_PRESETS[key]||THEME_PRESETS.green;
  const s=getAppSettings();
  s.themePreset=key; s.themePrimary=''; s.themeAccent='';
  saveAppSettings(s); applyAppTheme();
  openThemeSettings();
}
function applyCustomThemeColors(){
  const primary=document.getElementById('customPrimaryColor')?.value||'#0f766e';
  const accent=document.getElementById('customAccentColor')?.value||'#c99a22';
  const s=getAppSettings();
  s.themePreset='green'; s.themePrimary=primary; s.themeAccent=accent;
  saveAppSettings(s); applyAppTheme();
  const summary=document.getElementById('settingsThemeSummary');
  if(summary) summary.textContent=getThemeSummary();
}
function resetAppTheme(){
  const s=getAppSettings();
  delete s.themeMode; delete s.themePreset; delete s.themePrimary; delete s.themeAccent;
  saveAppSettings(s); applyAppTheme();
  openThemeSettings();
  showToast('🎨 تم استعادة ألوان البرنامج الأصلية','success');
}

function exportData(){
  const data=buildBackupPayload();
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='كنوز_الطبيعة_نسخة_احتياطية_'+today()+'_'+APP_VERSION+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  const size=Math.max(1,Math.round(blob.size/1024));
  showToast('✅ تم حفظ نسخة احتياطية آمنة — '+size+' كيلوبايت','success');
  return true;
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!isUsableBackup(data)){
        showToast('🛡️ ملف النسخة الاحتياطية فارغ أو غير صالح، ولم يتم تغيير أي بيانات','error');
        input.value='';
        return;
      }
      const sourceVersion=data.version||'غير معروف';
      if(!confirm('تم العثور على نسخة صالحة من «'+(data.appName||'متجري')+'».\nالإصدار: '+sourceVersion+'\n'+backupSummary(data)+'\n\nسيتم استبدال البيانات الحالية. هل تريد المتابعة؟'))return;
      const collections=getBackupCollections();
      for(const k of collections) Store.set(k,Array.isArray(data[k])?data[k]:[]);
      if(data.userData)Store.setUser(data.userData);
      currentUser=data.userData||currentUser;
      const stamp=new Date().toLocaleString('ar-EG');
      localStorage.setItem('bm_last_backup',stamp); refreshLocalBackupStamp(stamp);
      refreshGoogleBackupStatusUI();
      showToast('✅ تمت استعادة النسخة من الجهاز بنجاح','success');
      setTimeout(()=>navigateTo('dashboard'),350);
    }catch(err){
      console.error('Local backup import failed:',err);
      showToast('❌ ملف النسخة الاحتياطية غير صالح أو تالف','error');
    }finally{
      input.value='';
    }
  };
  reader.onerror=()=>{showToast('❌ تعذر قراءة ملف النسخة الاحتياطية','error');input.value='';};
  reader.readAsText(file,'utf-8');
}
function clearAllData(){
  if(!confirm('⚠️ سيتم حذف جميع البيانات! متأكد؟'))return;
  if(!confirm('تأكيد نهائي: مسح كل البيانات؟'))return;
  Store.clear();showToast('🗑️ تم المسح');navigateTo('dashboard');
}
function renderProductsGrid() {
  const products = Store.get('products') || [];
  if (products.length === 0) {
    return `<div style="text-align:center; padding:20px; color:var(--text-light)">لا توجد منتجات مسجلة</div>`;
  }
  let html = '<div class="products-grid">';
  products.forEach(product => {
    html += `
      <div class="pos-product-card" onclick="addToCart('${product.id}')">
        <div class="icon"><i class="fas fa-box"></i></div>
        <div class="name">${product.name}</div>
        <div class="price">${fmt(product.price)}</div>
      </div>
    `;
  });
  html += '</div>';
  return html;
}

function openModal(content){
  document.getElementById('modalContent').innerHTML=content;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');

function showToast(message,type='success'){
  const container=document.getElementById('toastContainer');
  const toast=document.createElement('div');
  toast.className='toast '+type;
  const icons={success:'check-circle',error:'exclamation-circle',warning:'exclamation-triangle'};
  toast.innerHTML=`<i class="fas fa-${icons[type]||'check-circle'}"></i> ${message}`;
  container.appendChild(toast);
  setTimeout(()=>{toast.style.animation='toastOut 0.3s ease';setTimeout(()=>toast.remove(),300)},3000);
}
function fmt(n){
  return Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
}
function today(){
  return cairoDateISO();
}
