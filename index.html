<script id="sales-history-v142-js">
(function(){
  const money = v => Number(v||0);
  function allSales(){ return Array.isArray(Store.get('sales')) ? Store.get('sales') : []; }
  function lineItems(s){ return Array.isArray(s.items) ? s.items : [s]; }
  function invoiceKey(s){ return s.saleBatchId ? 'batch:'+s.saleBatchId : 'sale:'+s.id; }

  // ===== ترقيم الفواتير القديمة تلقائيًا =====
  // الفواتير القديمة التي كانت تحمل INV-YYYYMMDD-xxxxxx تُعطى أرقامًا
  // تسلسلية مرة واحدة، مع الاحتفاظ بالرقم القديم داخل invoiceNo للرجوع إليه.
  function legacyInvoiceSortKey(lines){
    const first=lines[0]||{};
    const no=String(first.invoiceNo||'');
    const m=no.match(/^INV-(\d{8})-(\d+)$/i);
    if(m) return m[1]+'-'+m[2].padStart(20,'0');
    return String(first.date||'')+' '+String(first.time||'')+' '+String(first.id||'');
  }
  function ensureLegacyInvoiceSequences(){
    const sales=allSales();
    if(!sales.length) return;
    const map=new Map();
    sales.forEach(s=>{
      const key=invoiceKey(s);
      if(!map.has(key)) map.set(key,[]);
      map.get(key).push(s);
    });
    const groups=[...map.values()];
    const used=new Set();
    groups.forEach(lines=>{
      const n=Number(lines.find(s=>Number(s.invoiceSeq)>0)?.invoiceSeq||0);
      if(Number.isFinite(n)&&n>0) used.add(n);
    });
    const missing=groups.filter(lines=>!lines.some(s=>Number(s.invoiceSeq)>0)).sort((a,b)=>legacyInvoiceSortKey(a).localeCompare(legacyInvoiceSortKey(b)));
    let next=1;
    missing.forEach(lines=>{
      while(used.has(next)) next++;
      lines.forEach(s=>Store.update('sales',s.id,{invoiceSeq:next}));
      used.add(next);
      next++;
    });
  }

  function productForSaleLine(s){
    const p=(Store.get('products')||[]).find(x=>String(x.id)===String(s.productId));
    if(p) return p;
    const name=String(s.productName||'').trim();
    if(/موزاريلا|موتزاريلا|mozzarella/i.test(name)) return {name,unit:'كجم',sellByWeight:true};
    if(/رومي|رومى|romy|كيري|kiri|قشطة|قشطه|cream/i.test(name)) return {name,unit:'علبة'};
    return {name,unit:s.sellUnit||'علبة'};
  }

  function groupSales(){
    ensureLegacyInvoiceSequences();
    const map=new Map();
    allSales().forEach(s=>{
      const key=invoiceKey(s);
      if(!map.has(key)) map.set(key,[]);
      map.get(key).push(s);
    });
    return [...map.values()].map(lines=>{
      const first=lines[0];
      const total=lines.reduce((n,s)=>n+money(s.total),0);
      const profit=lines.reduce((n,s)=>n+money(s.profit),0);
      const paid=money(first.paid);
      const remaining=Math.max(0,total-paid);
      const returnedAmount=lines.reduce((n,s)=>n+money(s.returnedAmount),0);
      const returnedQty=lines.reduce((n,s)=>n+money(s.returnedQty),0);
      const returnedLines=lines.filter(s=>money(s.returnedQty)>0);
      const activeLines=lines.filter(s=>money(s.qty)>0 && money(s.total)>0);
      const returnStatus=returnedLines.length?(activeLines.length?'partial':'full'):'';
      return {key:invoiceKey(first),id:first.id,saleBatchId:first.saleBatchId||null,invoiceNo:first.invoiceNo||('INV-'+String(first.id||'').slice(-6)),invoiceSeq:first.invoiceSeq||null,date:first.date||'',time:first.time||'',customerId:first.customerId||null,customerName:first.customerName||'عميل عادي',type:first.type||'retail',paymentMethod:first.paymentMethod||'cash',note:first.note||'',total,profit,paid,remaining,returnedAmount,returnedQty,returnedLines,activeLines,returnStatus,lines};
    }).sort((a,b)=>String(b.date+' '+b.time).localeCompare(String(a.date+' '+a.time)));
  }
  function paymentLabel(m){return ({cash:'نقدي',credit:'آجل',transfer:'تحويل',card:'بطاقة'})[m]||m||'نقدي';}
  function paymentIcon(m){return ({cash:'fa-money-bill-wave',credit:'fa-clock',transfer:'fa-mobile-screen-button',card:'fa-credit-card'})[m]||'fa-wallet';}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function invoiceTotalText(inv){return fmt(inv.total);}
  function invoiceText(inv){
    let t=`🧾 *كنوز الطبيعة — فاتورة بيع*\n`;
    t+=`━━━━━━━━━━━━━━\n`;
    t+=`🔢 رقم الفاتورة: *${inv.invoiceSeq||inv.invoiceNo}*\n`;
    t+=`📅 التاريخ: *${formatInvoiceDate(inv.date)}${inv.time?' — '+inv.time:''}*\n`;
    t+=`👤 العميل: *${inv.customerName||'عميل عادي'}*\n`;
    t+=`🛍️ نوع البيع: *${inv.type==='wholesale'?'جملة':'قطاعي'}*\n`;
    t+=`━━━━━━━━━━━━━━\n`;
    inv.lines.forEach((s,i)=>{
      const p=productForSaleLine(s);
      const qty=isKgProduct(p)||s.isWeightSale ? saleQuantityLabel(p,s.packages||1,s.weight||1) : `${s.packages||s.qty||1} ${isFixedPackProduct(p)?'علبة':(s.sellUnit||p?.unit||'علبة')}`;
      const cashierLabel=`بيع من الكاشير — ${qty}`;
      const returned=money(s.returnedQty)>0;
      t+=`${i+1}. *${s.productName||'صنف'}*${returned?' ↩️ مرتجع':''}\n`;
      t+=`   📦 ${cashierLabel}\n`;
      t+=`   💰 ${fmt(s.total)}${returned?` — مرتجع ${fmt(s.returnedAmount||0)}`:''}\n`;
    });
    if(inv.returnStatus)t+=`↩️ حالة المرتجع: *${inv.returnStatus==='partial'?'مرتجع جزئي':'مرتجع بالكامل'}*\n`;
    t+=`━━━━━━━━━━━━━━\n`;
    if(money(inv.subtotal)!==money(inv.total)||money(inv.discount)>0)t+=`الإجمالي قبل الخصم: ${fmt(inv.subtotal)}\n`;
    if(money(inv.discount)>0)t+=`🏷️ الخصم: ${fmt(inv.discount)}\n`;
    if(money(inv.tax)>0)t+=`🧾 الضريبة: ${fmt(inv.tax)}\n`;
    t+=`💰 *الإجمالي النهائي: ${fmt(inv.total)}*\n`;
    t+=`💵 المدفوع: ${fmt(inv.paid)}\n`;
    t+=`${inv.paymentMethod==='cash'?'💸 الباقي':'📌 المتبقي'}: *${fmt(inv.paymentMethod==='cash'?Math.max(0,inv.paid-inv.total):inv.remaining)}*\n`;
    t+=`💳 السداد: *${paymentLabel(inv.paymentMethod)}*`;
    if(inv.note)t+=`\n📝 ملاحظة: ${inv.note}`;
    t+=`\n━━━━━━━━━━━━━━\n❤️ *شكرًا لتعاملكم معنا*`;
    return t;
  }

  function historyCard(inv){
    const lineCount=inv.activeLines.length;
    const qtyText=inv.activeLines.reduce((n,s)=>n+money(s.packages||s.qty||0),0);
    const statusClass=inv.returnStatus?'returned':(inv.remaining>0?'due':'paid');
    const statusText=inv.returnStatus?(inv.returnStatus==='partial'?'مرتجع جزئي ↩️':'مرتجع بالكامل ↩️'):(inv.remaining>0?'آجل':'مدفوع');
    const names=inv.activeLines.slice(0,2).map(s=>s.productName||'صنف');
    const preview=names.join(' + ')||'تم إرجاع جميع الأصناف';
    const extra=inv.activeLines.length>2?' + '+(inv.activeLines.length-2)+' أصناف أخرى':'';
    return `<article class="invoice-pro-card ${inv.returnStatus?'has-return':''}" onclick="openInvoicePro('${esc(inv.key)}')">
      <div class="invoice-pro-top"><div><span class="invoice-pro-number">رقم ${esc(inv.invoiceSeq||inv.invoiceNo)}</span><small>${esc(inv.date)} ${esc(inv.time)}</small></div><span class="invoice-pro-status ${statusClass}">${statusText}</span></div>
      <div class="invoice-pro-main"><div class="invoice-pro-icon"><i class="fas fa-file-invoice"></i></div><div class="invoice-pro-info"><strong>${esc(inv.customerName)}</strong><span class="invoice-pro-product-name"><i class="fas fa-box-open"></i> ${esc(preview)}${extra}</span><small>${lineCount} ${lineCount===1?'صنف':'أصناف'} • ${qtyText} كمية${inv.returnedQty>0?' • ↩️ مرتجع '+fmt(inv.returnedAmount):''}</small></div><div class="invoice-pro-total"><small>الإجمالي</small><b>${invoiceTotalText(inv)}</b></div></div>
      <div class="invoice-pro-meta"><span><i class="fas fa-${paymentIcon(inv.paymentMethod)}"></i> ${paymentLabel(inv.paymentMethod)}</span><span><i class="fas fa-hand-holding-dollar"></i> ${fmt(inv.paid)}</span><span class="${inv.remaining>0?'due-text':'profit-text'}">${inv.remaining>0?'متبقي '+fmt(inv.remaining):'ربح '+fmt(inv.profit)}</span></div>
      <div class="invoice-pro-actions" onclick="event.stopPropagation()"><button onclick="openInvoicePro('${esc(inv.key)}')"><i class="fas fa-eye"></i> الفاتورة</button><button onclick="printInvoicePro('${esc(inv.key)}')"><i class="fas fa-print"></i></button><button onclick="shareInvoicePro('${esc(inv.key)}')"><i class="fab fa-whatsapp"></i></button><button onclick="editInvoicePro('${esc(inv.key)}')"><i class="fas fa-pen"></i></button><button class="invoice-delete-mini" onclick="deleteInvoicePro('${esc(inv.key)}')" title="حذف الفاتورة"><i class="fas fa-trash"></i></button></div>
    </article>`;
  }

  window.ensureLegacyInvoiceSequences=ensureLegacyInvoiceSequences;
  window.productForSaleLine=productForSaleLine;
  window.salesInvoiceProState=window.salesInvoiceProState||{q:'',range:'all',type:'',payment:'',date:''};
  window.renderSalesTable=function(){
    const st=window.salesInvoiceProState;
    const q=(document.getElementById('saleSearch')?.value??st.q).trim().toLowerCase();
    const type=document.getElementById('saleTypeFilter')?.value??st.type;
    const payment=document.getElementById('salePaymentFilter')?.value??st.payment;
    const date=document.getElementById('saleFilterDate')?.value??st.date;
    const range=window.salesRange||st.range||'all';
    st.q=q;st.type=type;st.payment=payment;st.date=date;st.range=range;
    let list=groupSales();
    let start='',end='';
    if(range==='custom'&&date){start=end=date;} else if(range!=='all'&&typeof getSalesRangeDates==='function'){[start,end]=getSalesRangeDates(range);}
    list=list.filter(inv=>{
      const hay=`${inv.invoiceNo} ${inv.customerName} ${inv.note} ${inv.lines.map(s=>s.productName||'').join(' ')}`.toLowerCase();
      return (!q||hay.includes(q))&&(!type||inv.type===type)&&(!payment||inv.paymentMethod===payment)&&(!start||(inv.date||'')>=start&&(inv.date||'')<=end);
    });
    const total=list.reduce((n,x)=>n+x.total,0), paid=list.reduce((n,x)=>n+x.paid,0), profit=list.reduce((n,x)=>n+x.profit,0);
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    set('salesStatCount',list.length);set('salesStatTotal',fmt(total));set('salesStatPaid',fmt(paid));set('salesStatProfit',fmt(profit));
    const target=document.getElementById('salesTable');if(target)target.innerHTML=list.map(historyCard).join('')||'<div class="sales-empty"><div><i class="fas fa-receipt"></i></div><strong>لا توجد فواتير</strong><span>جرّب تغيير البحث أو الفلاتر</span></div>';
  };

  window.clearSalesFilters=function(){window.salesRange='all';window.salesInvoiceProState={q:'',range:'all',type:'',payment:'',date:''};['saleSearch','saleFilterDate','saleTypeFilter','salePaymentFilter'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});document.querySelectorAll('.sales-quick-filters button').forEach(b=>b.classList.toggle('active',b.dataset.range==='all'));renderSalesTable();};

  function findInvoice(key){return groupSales().find(x=>x.key===key);}
  function closeIfOpen(){try{closeModal();}catch(e){}}

  window.openInvoicePro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const customer=(Store.get('customers')||[]).find(c=>inv.customerId&&String(c.id)===String(inv.customerId));
    const phone=customer?.phone||'';
    const rows=inv.lines.map(s=>{
      const q=money(s.packages||s.qty||0),w=money(s.weight||1),p=productForSaleLine(s);
      const qty=isKgProduct(p)||s.isWeightSale?saleQuantityLabel(p,q,w):`${q} ${isFixedPackProduct(p)?'علبة':(s.sellUnit||p?.unit||'علبة')}`;
      const returned=money(s.returnedQty)>0;
      return `<div class="invoice-line-pro ${returned?'invoice-line-returned':''}"><div><strong>${esc(s.productName||'صنف')} ${returned?'<em>↩️ مرتجع</em>':''}</strong><small>${esc(qty)} × ${fmt(s.price||0)}${returned?' • مرتجع '+fmt(s.returnedAmount||0):''}</small></div><b>${fmt(s.total)}</b></div>`;
    }).join('');
    const status=inv.returnStatus==='partial'?`<span class="invoice-detail-status returned">مرتجع جزئي ↩️</span>`:inv.returnStatus==='full'?`<span class="invoice-detail-status returned">مرتجع بالكامل ↩️</span>`:inv.remaining>0?`<span class="invoice-detail-status due">متبقي ${fmt(inv.remaining)}</span>`:`<span class="invoice-detail-status paid">مدفوعة بالكامل ✓</span>`;
    openModal(`<div class="invoice-modal-pro invoice-detail-modern">
      <div class="modal-header invoice-detail-head">
        <div>
          <div class="invoice-detail-title"><i class="fas fa-file-invoice"></i><h2>فاتورة رقم ${esc(inv.invoiceSeq||inv.invoiceNo)}</h2></div>
          <small>${esc(inv.date)} ${esc(inv.time)}</small>
        </div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>

      <div class="invoice-detail-customer">
        <div class="invoice-detail-avatar"><i class="fas fa-user"></i></div>
        <div class="invoice-detail-customer-info">
          <span>العميل</span>
          <strong>${esc(inv.customerName)}</strong>
          ${phone?`<small><i class="fas fa-phone"></i> ${esc(phone)}</small>`:''}
        </div>
        ${phone?`<button class="invoice-detail-wa" title="إرسال الفاتورة على واتساب" onclick="openWhatsApp('${esc(phone)}',invoiceText(findInvoice('${esc(inv.key)}')))"><i class="fab fa-whatsapp"></i></button>`:''}
      </div>

      <div class="invoice-pro-banner invoice-detail-banner">
        <div><span>طريقة السداد</span><strong><i class="fas ${paymentIcon(inv.paymentMethod)}"></i> ${paymentLabel(inv.paymentMethod)}</strong></div>
        <div><span>نوع البيع</span><strong>${inv.type==='wholesale'?'📦 جملة':'🛍️ قطاعي'}</strong></div>
        <div><span>الحالة</span><strong>${status}</strong></div>
      </div>

      <div class="invoice-detail-section-label"><i class="fas fa-box-open"></i> الأصناف</div>
      <div class="invoice-lines-pro">${rows}</div>

      <div class="invoice-totals-pro invoice-detail-totals">
        <div><span>الإجمالي</span><b>${fmt(inv.total)}</b></div>
        <div><span>المدفوع</span><b>${fmt(inv.paid)}</b></div>
        <div class="${inv.remaining>0?'due-row':'paid-ok'} invoice-remaining-row"><span>${inv.remaining>0?'المتبقي':'الحالة'}</span><b>${inv.remaining>0?fmt(inv.remaining):'مدفوعة بالكامل ✓'}</b></div>
        <div><span>الربح</span><b class="profit-text">${fmt(inv.profit)}</b></div>
      </div>

      ${inv.note?`<div class="invoice-note-pro"><i class="fas fa-note-sticky"></i><span>${esc(inv.note)}</span></div>`:''}

      <div class="invoice-actions-pro invoice-detail-actions">
        <button onclick="printInvoicePro('${esc(inv.key)}')"><i class="fas fa-print"></i><span>طباعة</span></button>
        <button onclick="shareInvoicePro('${esc(inv.key)}')"><i class="fab fa-whatsapp"></i><span>واتساب</span></button>
        <button onclick="editInvoicePro('${esc(inv.key)}')"><i class="fas fa-pen"></i><span>تعديل</span></button>
        <button onclick="openInvoiceReturnPro('${esc(inv.key)}')"><i class="fas fa-rotate-left"></i><span>مرتجع</span></button>
        ${inv.remaining>0?`<button onclick="openInvoiceCollectionPro('${esc(inv.key)}')"><i class="fas fa-money-bill-wave"></i><span>تحصيل</span></button>`:''}
        <button class="danger" onclick="deleteInvoicePro('${esc(inv.key)}')"><i class="fas fa-trash"></i><span>حذف</span></button>
      </div>
    </div>`);
  };

  window.shareInvoicePro=function(key){const inv=findInvoice(key);if(!inv)return;window.open('https://wa.me/?text='+encodeURIComponent(invoiceText(inv)),'_blank');};

  window.printInvoicePro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const rows=inv.lines.map(s=>{const q=money(s.packages||s.qty||1),w=money(s.weight||1);const p=productForSaleLine(s);const qty=isKgProduct(p)||s.isWeightSale?saleQuantityLabel(p,q,w):`${q} ${isFixedPackProduct(p)?'علبة':(s.sellUnit||p?.unit||'علبة')}`;return `<tr><td>${esc(s.productName||'صنف')}</td><td>${esc(qty)}</td><td>${fmt(s.price||0)}</td><td>${fmt(s.total)}</td></tr>`}).join('');
    const w=window.open('','_blank','width=900,height=800');if(!w){showToast('اسمح بفتح نافذة الطباعة','warning');return;}
    const html='<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>'+esc(inv.invoiceNo)+'</title><style>@page{size:A4;margin:12mm}body{margin:0;font-family:Arial,Tahoma,sans-serif;color:#173b32;background:#fff}.page{width:100%;max-width:190mm;margin:auto;padding:6mm;box-sizing:border-box}.brand{text-align:center;font-size:28px;font-weight:900;color:#0f766e;margin-bottom:4px}.sub{text-align:center;color:#66756f;font-size:12px;line-height:1.8}.line{border-top:1px solid #dce8e3;margin:14px 0}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}th{background:#eef7f3;color:#0f766e}th,td{padding:9px 7px;border-bottom:1px solid #e6eeeb;text-align:right}.r{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}.grand{font-size:19px;font-weight:900;border-top:2px solid #0f766e;margin-top:8px;padding-top:10px}.thanks{text-align:center;margin-top:25px;color:#71827b;font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.meta div{border:1px solid #dfeae5;border-radius:10px;padding:8px}.meta small{display:block;color:#778780;font-size:10px}.meta b{display:block;margin-top:3px;font-size:12px}@media print{button{display:none}}</style></head><body><div class="page"><div class="brand">كنوز الطبيعة</div><div class="sub">فاتورة بيع — '+esc(inv.invoiceNo)+'<br>'+esc(inv.date)+' '+esc(inv.time)+'</div><div class="line"></div><div class="meta"><div><small>العميل</small><b>'+esc(inv.customerName)+'</b></div><div><small>نوع البيع</small><b>'+(inv.type==='wholesale'?'جملة':'قطاعي')+'</b></div><div><small>السداد</small><b>'+paymentLabel(inv.paymentMethod)+'</b></div></div><div class="line"></div><table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+rows+'</tbody></table><div class="line"></div><div class="r"><span>الإجمالي</span><b>'+fmt(inv.total)+'</b></div><div class="r"><span>المدفوع</span><b>'+fmt(inv.paid)+'</b></div><div class="r grand"><span>المتبقي</span><b>'+fmt(inv.remaining)+'</b></div>'+(inv.note?'<div class="line"></div><div class="r"><span>ملاحظات</span><b>'+esc(inv.note)+'</b></div>':'')+'<div class="thanks">شكرًا لتعاملكم معنا ❤️</div></div></body></html>';
    w.document.open();w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),350);
  };

  window.editInvoicePro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const rows=inv.lines.map((s,i)=>`<div class="edit-invoice-line"><div class="edit-invoice-name"><strong>${esc(s.productName||'صنف')}</strong><small>المباع: ${money(s.qty)} ${s.weight?'كجم':''}</small></div><input data-edit-line="${i}" data-field="qty" type="number" min="0" step="0.001" value="${money(s.qty)}" placeholder="الكمية"><input data-edit-line="${i}" data-field="price" type="number" min="0" step="0.01" value="${money(s.price)}" placeholder="السعر"><input data-edit-line="${i}" data-field="discount" type="number" min="0" max="100" step="0.1" value="${money(s.discount)}" placeholder="خصم %"></div>`).join('');
    openModal(`<div class="modal-header"><h2><i class="fas fa-pen" style="color:var(--primary);margin-left:8px"></i> تعديل الفاتورة ${esc(inv.invoiceNo)}</h2><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="form-group" style="margin-bottom:12px"><label><i class="fas fa-calendar-day" style="color:var(--primary);margin-left:6px"></i> تاريخ الفاتورة</label><input id="editInvoiceDate" type="date" value="${esc(inv.date||'')}" class="sales-date-filter"></div><div class="edit-invoice-head"><span>الصنف</span><span>الكمية</span><span>السعر</span><span>الخصم %</span></div><div id="editInvoiceLines">${rows}</div><div class="form-group" style="margin-top:10px"><label>ملاحظات</label><input id="editInvoiceNote" value="${esc(inv.note)}"></div><button class="btn btn-primary btn-block" onclick="saveInvoiceEditPro('${esc(inv.key)}')"><i class="fas fa-save"></i> حفظ تعديل الفاتورة</button>`);
  };

  window.saveInvoiceEditPro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const originalTotal=inv.total;
    let newTotal=0,newProfit=0,valid=true;
    const newVals=inv.lines.map((s,i)=>{const q=money(document.querySelector(`[data-edit-line="${i}"][data-field="qty"]`)?.value),p=money(document.querySelector(`[data-edit-line="${i}"][data-field="price"]`)?.value),d=Math.min(100,Math.max(0,money(document.querySelector(`[data-edit-line="${i}"][data-field="discount"]`)?.value)));if(q<0||p<0)valid=false;const gross=p*(s.weight?money(s.weight):1)* (s.packages!=null? (q/(money(s.weight)||1)):q);const total=Math.max(0,gross*(1-d/100));const cost=money(s.cost)*(s.weight?money(s.weight):1);const profit=(q>0?Math.max(0,total-cost*q):0);newTotal+=total;newProfit+=profit;return {s,q,p,d,total,profit};});
    if(!valid)return showToast('تحقق من الكميات والأسعار','warning');
    // Inventory adjustment per line: return old qty, then deduct new qty.
    newVals.forEach(v=>{const p=Store.get('products').find(x=>String(x.id)===String(v.s.productId));if(p){const restored=money(p.qty)+money(v.s.qty);Store.update('products',p.id,{qty:restored-v.q});}});
    const oldCustomer=inv.customerId,oldCustomerName=inv.customerName;
    const note=document.getElementById('editInvoiceNote')?.value||'';
    const newDate=document.getElementById('editInvoiceDate')?.value||inv.date||'';
    const delta=newTotal-originalTotal;
    newVals.forEach(v=>Store.update('sales',v.s.id,{qty:v.q,packages:v.s.weight?Math.max(0,v.q/(money(v.s.weight)||1)):v.q,price:v.p,discount:v.d,total:v.total,profit:v.profit,note,date:newDate}));
    const paid=Math.min(inv.paid,newTotal),remaining=Math.max(0,newTotal-paid);
    if(inv.saleBatchId){
      newVals.forEach(v=>Store.update('sales',v.s.id,{paid,remaining}));
      (Store.get('debts')||[]).filter(d=>d.saleBatchId===inv.saleBatchId&&d.source==='sale').forEach(d=>Store.delete('debts',d.id));
      if(remaining>0)Store.add('debts',{saleBatchId:inv.saleBatchId,invoiceNo:inv.invoiceNo,date:newDate,person:oldCustomerName,type:'لنا',amount:remaining,due:'',note:`آجل من الفاتورة ${inv.invoiceNo}`,paid:false,source:'sale',saleTotal:newTotal,paidAmount:0});
    }else{
      Store.update('sales',inv.id,{paid,remaining});
    }
    if(oldCustomer){const cs=Store.get('customers');const c=cs.find(x=>x.id===oldCustomer);if(c){c.totalSpent=Math.max(0,money(c.totalSpent)+delta);Store.set('customers',cs);}}
    closeIfOpen();showToast('✅ تم تعديل الفاتورة وتحديث المخزون','success');renderSalesTable();
  };

  window.openInvoiceReturnPro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const rows=inv.lines.map((s,i)=>{const remainingQty=money(s.qty);const already=money(s.returnedQty);return `<div class="return-invoice-line ${remainingQty<=0?'already-returned':''}"><div><strong>${esc(s.productName||'صنف')}</strong><small>المتاح للمرتجع: ${remainingQty} ${s.weight?'كجم':''}${already>0?' • تم إرجاع '+already+' سابقًا':''}</small></div><input data-return-line="${i}" type="number" min="0" max="${remainingQty}" step="0.001" value="0" placeholder="مرتجع" ${remainingQty<=0?'disabled':''}></div>`;}).join('');
    openModal(`<div class="modal-header"><h2><i class="fas fa-rotate-left" style="color:var(--accent);margin-left:8px"></i> مرتجع الفاتورة</h2><button class="modal-close" onclick="closeModal()">&times;</button></div><p style="font-size:.72rem;color:var(--text-light)">يمكنك إدخال كمية مرتجعة لكل صنف، أو إدخال كامل الكمية للمرتجع الكامل.</p><div class="return-invoice-list">${rows}</div><button class="btn btn-accent btn-block" style="margin-top:10px" onclick="confirmInvoiceReturnPro('${esc(inv.key)}')"><i class="fas fa-check"></i> تنفيذ المرتجع</button>`);
  };

  window.confirmInvoiceReturnPro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    let refund=0,changed=false;
    inv.lines.forEach((s,i)=>{const input=document.querySelector(`[data-return-line="${i}"]`);const r=Math.min(money(s.qty),Math.max(0,money(input?.value)));if(r<=0)return;changed=true;const ratio=s.qty?Math.min(1,r/money(s.qty)):1;refund+=money(s.total)*ratio;const p=Store.get('products').find(x=>String(x.id)===String(s.productId));if(p)Store.update('products',p.id,{qty:money(p.qty)+r});const newQty=Math.max(0,money(s.qty)-r);const newTotal=Math.max(0,money(s.total)-money(s.total)*ratio);const newProfit=Math.max(0,money(s.profit)-money(s.profit)*ratio);Store.update('sales',s.id,{qty:newQty,packages:s.weight?newQty/(money(s.weight)||1):newQty,total:newTotal,profit:newProfit,returnedQty:money(s.returnedQty)+r,returnedAmount:money(s.returnedAmount)+money(s.total)*ratio});});
    if(!changed)return showToast('حدد كمية المرتجع أولًا','warning');
    const updated=findInvoice(key);const newTotal=updated?updated.total:Math.max(0,inv.total-refund);const paid=Math.min(inv.paid,newTotal),remaining=Math.max(0,newTotal-paid);
    if(inv.saleBatchId){const batch=allSales().filter(s=>s.saleBatchId===inv.saleBatchId);batch.forEach(s=>Store.update('sales',s.id,{paid,remaining}));(Store.get('debts')||[]).filter(d=>d.saleBatchId===inv.saleBatchId&&d.source==='sale').forEach(d=>Store.delete('debts',d.id));if(remaining>0)Store.add('debts',{saleBatchId:inv.saleBatchId,invoiceNo:inv.invoiceNo,date:inv.date,person:inv.customerName,type:'لنا',amount:remaining,due:'',note:`آجل بعد مرتجع ${inv.invoiceNo}`,paid:false,source:'sale',saleTotal:newTotal,paidAmount:0});}
    closeIfOpen();showToast('✅ تم تسجيل المرتجع '+fmt(refund)+' وتحديث المخزون','success');renderSalesTable();
  };

  window.openInvoiceCollectionPro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    openModal(`<div class="modal-header"><h2><i class="fas fa-money-bill-wave" style="color:var(--success);margin-left:8px"></i> تحصيل من ${esc(inv.invoiceNo)}</h2><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="collection-pro-box"><small>المتبقي الحالي</small><strong>${fmt(inv.remaining)}</strong><input id="invoiceCollectionAmount" type="number" min="0" max="${inv.remaining}" step="0.01" value="${inv.remaining}"></div><button class="btn btn-success btn-block" onclick="confirmInvoiceCollectionPro('${esc(inv.key)}')"><i class="fas fa-check"></i> تسجيل التحصيل</button>`);
  };
  window.confirmInvoiceCollectionPro=function(key){
    const inv=findInvoice(key);if(!inv)return;
    const amount=Math.min(inv.remaining,Math.max(0,money(document.getElementById('invoiceCollectionAmount')?.value)));
    if(amount<=0)return showToast('أدخل مبلغ التحصيل','warning');
    const newPaid=inv.paid+amount,newRemaining=Math.max(0,inv.total-newPaid);
    const now=cairoDateTimeISO();
    // سجل السداد الجديد في سجل المبيعات بشكل مستقل حتى لا تُحسب كل قيمة paid التراكمية مرة أخرى في الخزنة.
    const firstLine=inv.lines[0];
    const existingHistory=Array.isArray(firstLine?.collectionHistory)?firstLine.collectionHistory.slice():[];
    existingHistory.push({amount,date:now,type:newRemaining<=0?'full':'partial'});
    inv.lines.forEach((line,i)=>Store.update('sales',line.id,{paid:newPaid,remaining:newRemaining,initialPaid:Object.prototype.hasOwnProperty.call(line,'initialPaid')?line.initialPaid:(i===0?Math.max(0,inv.paid-(Array.isArray(line.collectionHistory)?line.collectionHistory.reduce((n,h)=>n+Number(h.amount||0),0):0)):0),collectionHistory:i===0?existingHistory:(Array.isArray(line.collectionHistory)?line.collectionHistory:[])}));
    if(inv.saleBatchId){
      const debts=Store.get('debts')||[];
      const related=debts.filter(d=>d.saleBatchId===inv.saleBatchId&&d.source==='sale'&&d.type==='لنا');
      related.forEach(d=>{
        const debtPaidBefore=Math.max(0,Number(d.paidAmount||0));
        const debtPaidAfter=Math.min(Number(d.amount||0),debtPaidBefore+amount);
        const history=Array.isArray(d.paymentHistory)?d.paymentHistory.slice():[];
        history.push({amount:Math.min(amount,Math.max(0,Number(d.amount||0)-debtPaidBefore)),date:now,type:debtPaidAfter>=Number(d.amount||0)-0.0001?'full':'partial',source:'sales'});
        Store.update('debts',d.id,{paidAmount:debtPaidAfter,paid:debtPaidAfter>=Number(d.amount||0)-0.0001,paymentHistory:history,debtVersion:2,lastPaymentAt:now});
      });
    }
    closeIfOpen();showToast(newRemaining<=0?`🎉 تم سداد الفاتورة بالكامل — ${fmt(newPaid)}`:`✅ تم تسجيل التحصيل ${fmt(amount)} — المتبقي ${fmt(newRemaining)}`,'success');
    renderSalesTable();
    if(typeof renderCashboxData==='function')renderCashboxData();
  };

  window.deleteInvoicePro=function(key){const inv=findInvoice(key);if(!inv)return;if(!confirm(`حذف الفاتورة ${inv.invoiceNo} بالكامل؟ سيتم إعادة الكميات للمخزون.`))return;inv.lines.forEach(s=>{const p=Store.get('products').find(x=>String(x.id)===String(s.productId));if(p)Store.update('products',p.id,{qty:money(p.qty)+money(s.qty)});Store.delete('sales',s.id);});if(inv.saleBatchId)(Store.get('debts')||[]).filter(d=>d.saleBatchId===inv.saleBatchId&&d.source==='sale').forEach(d=>Store.delete('debts',d.id));closeIfOpen();showToast('🗑️ تم حذف الفاتورة وإرجاع الكميات للمخزون');renderSalesTable();};

  // Make the existing sale-history section look like an invoice manager without replacing the POS.
  const originalRenderSalesPage=window.renderSalesPage;
  if(typeof originalRenderSalesPage==='function'){
    window.renderSalesPage=function(container){originalRenderSalesPage(container);setTimeout(()=>renderSalesTable(),0);};
  }
})();

</script>
